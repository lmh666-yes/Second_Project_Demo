plugins {
    id 'com.android.application'
}

// 签名配置（独立 keystore：与其他两个 APK 完全独立，签名/包名都不会冲突）
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace 'com.cquiz.enword'
    compileSdk 35

    defaultConfig {
        // 独立包名：与「面试刷题·客观」(com.cquiz.app)、「面试刷题·主观」(com.cquiz.subj) 都不冲突
        applicationId "com.cquiz.enword"
        // minSdk 24 = Android 7.0：WebView 完全支持应用使用的现代 JS 语法
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 调试包也用同一签名，方便 adb install -r 覆盖安装
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
