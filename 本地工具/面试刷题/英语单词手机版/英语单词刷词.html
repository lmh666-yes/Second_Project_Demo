<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算机专业英语词汇 · 刷词（手机版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(165deg,#e8f0fa 0%,#f6f8fc 45%,#eaf6ef 100%)}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
/* 顶部 */
header{background:linear-gradient(135deg,#14486e 0%,#1a5276 55%,#2980b9 100%);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 3px 12px rgba(26,82,118,.28)}
header .title{font-size:16px;font-weight:bold;letter-spacing:.5px}
header .stat{font-size:11px;opacity:.95;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px}
/* 模式栏 */
.tabs{display:flex;background:#2c3e50}
.tabs button{flex:1;padding:11px 0;border:none;background:transparent;color:#bdc3c7;font-size:14px;cursor:pointer;transition:color .25s,background .25s}
.tabs button.active{background:#1a5276;color:#fff;font-weight:bold;box-shadow:inset 0 -3px 0 #58d68d}
/* 考试栏 + 题号导航 */
#examBar{display:none;background:#34495e;padding:6px 8px;gap:6px}
#examBar button{flex:1;border:none;border-radius:8px;padding:8px;color:#fff;font-size:13px;cursor:pointer;transition:transform .12s,filter .2s}
#examBar button:active{transform:scale(.96)}
#qnav{display:none;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#fff;border-radius:12px;margin:0 12px;box-shadow:0 1px 5px rgba(0,0,0,.06);max-height:130px;overflow-y:auto}
#qnav button{width:32px;height:32px;border:none;border-radius:9px;font-size:12px;cursor:pointer;transition:transform .12s,filter .2s}
#qnav button:active{transform:scale(.92)}
#qnav button.un{background:#f1f3f5;color:#555}
#qnav button.ok{background:#27ae60;color:#fff}
#qnav button.no{background:#c62828;color:#fff}
/* 主体 */
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.head{color:#1a5276;font-size:13px;font-weight:bold}
/* 单词卡片 */
.wordcard{background:#fff;border-radius:14px;padding:16px 16px 14px;box-shadow:0 2px 12px rgba(0,0,0,.07);animation:fadeSlide .3s ease}
.word{font-size:26px;font-weight:bold;color:#14486e;line-height:1.35;word-break:break-word}
.note{font-size:12px;color:#7f8c8d;margin-top:6px;line-height:1.5}
/* 提示/说明卡（考试说明、成绩页） */
.card{background:#fff;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 12px rgba(0,0,0,.07);animation:fadeSlide .3s ease}
/* 选项 */
#opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#fff;border:1.5px solid #e3e8ee;border-radius:12px;padding:13px 14px;font-size:15px;word-break:break-word;overflow-wrap:break-word;cursor:pointer;transition:transform .12s,border-color .2s,background .2s,box-shadow .2s;box-shadow:0 1px 4px rgba(26,82,118,.06)}
.opt:active{transform:scale(.985)}
.opt.right{background:#e8f8f0;color:#1a7f37;border-color:#2ecc71;font-weight:bold;animation:pop .3s ease}
.opt.wrong{background:#fdecea;color:#c62828;border-color:#e74c3c;animation:shake .3s ease}
/* 填空题作答区 */
#answerBox{display:none;flex-direction:column;gap:10px}
#answerBox input{width:100%;border:1.5px solid #d6dde5;border-radius:12px;padding:14px;font-size:17px;font-family:inherit;background:#fffdf5;outline:none;transition:border-color .2s,box-shadow .2s}
#answerBox input:focus{border-color:#2471a3;box-shadow:0 0 0 3px rgba(36,113,163,.14)}
#answerBox input:disabled{background:#f4f6f7;color:#555}
/* 反馈 */
#fb{background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75;display:none;box-shadow:0 2px 10px rgba(0,0,0,.06);animation:fadeSlide .3s ease;word-break:break-word}
#fb .tag-ok{color:#1a7f37;font-weight:bold}
#fb .tag-no{color:#c62828;font-weight:bold}
#fb .k{color:#1a5276;font-weight:bold}
/* 小提示 toast */
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-12px);background:rgba(26,82,118,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 底部操作栏 */
footer{background:#fff;padding:9px;display:flex;gap:6px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
footer button{flex:1;border:none;border-radius:10px;padding:12px 2px;font-size:12.5px;color:#fff;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .2s}
footer button:active{transform:scale(.95);filter:brightness(.92)}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;animation:fadeIn .18s ease}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;width:86%;max-width:360px;padding:18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:zoomIn .25s ease}
.mbox h3{font-size:16px;margin-bottom:8px}
.mbox p{font-size:14px;line-height:1.7;color:#333;margin-bottom:14px;white-space:pre-wrap;text-align:left}
.mbox .btns{display:flex;gap:10px;justify-content:center}
.mbox button{border:none;border-radius:10px;padding:10px 22px;font-size:14px;color:#fff;cursor:pointer;transition:transform .12s,filter .2s}
.mbox button:active{transform:scale(.95)}
.chip{border:none;border-radius:20px;padding:7px 13px;margin:3px;background:linear-gradient(135deg,#c62828,#e74c3c);color:#fff;font-size:12px;cursor:pointer;transition:transform .12s,filter .2s;box-shadow:0 2px 6px rgba(198,40,40,.25)}
.chip:active{transform:scale(.94)}
/* 动画 */
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes staggerIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>

<div id="app">
  <header>
    <div class="title">📖 计算机专业英语词汇</div>
    <div class="stat" id="stat">-</div>
  </header>
  <div class="tabs" id="tabs">
    <button data-mode="顺序" class="active">顺序</button>
    <button data-mode="错词">错词</button>
    <button data-mode="考试">考试</button>
  </div>
  <div id="examBar"></div>
  <div id="qnav"></div>
  <main id="main">
    <div class="head" id="head"></div>
    <div class="wordcard" id="wordcard">
      <div class="word" id="word"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="card" id="card" style="display:none"></div>
    <div id="opts"></div>
    <div id="answerBox">
      <input id="answerInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入中文意思后点「确认答案」">
    </div>
    <div id="fb"></div>
  </main>
  <footer id="footer"></footer>
</div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

function rec(id){ if(!progress[id]) progress[id]={ok:null,wrong_count:0}; var r=progress[id];
  if(r.in_wrong===undefined){ r.in_wrong=(r.ok===false); r.life=r.in_wrong?1:0; } return r; }
/* 只读访问：不存在返回空对象，不往进度里塞空记录 */
function recGet(id){ var r=progress[id]; if(!r||typeof r!=="object") return {};
  if(r.in_wrong===undefined){ r.in_wrong=(r.ok===false); r.life=r.in_wrong?1:0; } return r; }

    if(!r||typeof r!=="object"||id.charAt(0)==="_") continue;
    if(r.in_wrong===undefined){ r.in_wrong=(r.ok===false); r.life=r.in_wrong?1:0; ch=true; }
    if(r.wrong_count===undefined){ r.wrong_count=0; ch=true; }
    if(!r.in_wrong && r.life){ r.life=0; ch=true; }
  }

/* ---------- 错词寿命机制 ----------
   答错（任何模块）：累计次数+1，入错词本（寿命初始 1）；次数达 3/5/7/9 或 >10 时寿命+1。
   只有「错词考试」答对才寿命 -1，归零后移除；顺序/普通考试答对不影响错词状态。 */
function bumpWrong(r){ r.wrong_count=(r.wrong_count||0)+1; var wc=r.wrong_count;
  if(!r.in_wrong){ r.in_wrong=true; r.life=1; }
  if(wc===3||wc===5||wc===7||wc===9||wc>10) r.life=(r.life||1)+1; }
function lifeDec(r){ if(!r.in_wrong) return false;
  r.life=Math.max(0,(r.life||1)-1);
  if(r.life<=0){ r.in_wrong=false; return true; }
  return false; }
/* ctx: seq=顺序/错词重做等非考试，exam=普通考试，wexam=错词考试 */
function record(id, ok, ctx){ var r=rec(id); r.ok=ok;
  var cleared=false;
  if(!ok) bumpWrong(r); else if(ctx==="wexam") cleared=lifeDec(r);
  save(); return cleared; }

/* 记忆位置 = 「连续完成题目的最后一题」：
   做了 1、2、3、4，跳过 5 又做了 6、7、8 → 下次打开就在第 4 题 */
function resumeIndex(){
  var last=-1;
  for(var i=0;i<BANK.length;i++){ if(isDone(BANK[i])) last=i; else break; }
  if(last>=0) return last;
  return Math.min(progress._last||0, Math.max(0,BANK.length-1));
}

/* 中文释义等价判定
   · 去空格、统一中英标点、忽略句末句号
   · 省略号「…」/「...」/「什么」/「XX」互相等价（如「改变…的位置」）
   · 释义含多个义项（以 ，；/ 分隔）时，答出任一义项即算对 */
function normCn(s){
  s=String(s==null?"":s).replace(/[\s\u3000]+/g,"");
  s=s.replace(/[（(]/g,"(").replace(/[）)]/g,")");
  s=s.replace(/[，,、]+/g,"，").replace(/[；;]+/g,"；").replace(/[：:]+/g,"：");
  s=s.replace(/[。.]+$/,"");
  s=s.replace(/…+/g,"\u00a7").replace(/\.{2,}/g,"\u00a7").replace(/。{2,}/g,"\u00a7");
  s=s.replace(/[“”"'’‘]/g,"");
  return s;
}
function sameOne(user, ref){
  var c=normCn(ref), u=normCn(user);
  if(u==="" ) return false;
  if(u===c) return true;
  if(c.indexOf("\u00a7")>=0){                 /* 参考释义里有省略号占位 */
    u=u.replace(/什么/g,"\u00a7").replace(/[xXＸｘ]{2,}/g,"\u00a7")
       .replace(/某(个|些)?/g,"\u00a7").replace(/省略(的)?(部分|内容)?/g,"\u00a7");
    if(u===c) return true;
  }
  return false;
}
function senses(cn){ return String(cn||"").split(/[，,；;\/]/).filter(function(x){return x.trim();}); }
function checkMeaning(user, it){
  if(sameOne(user, it.cn)) return true;
  var ss=senses(it.cn);
  for(var i=0;i<ss.length;i++){ if(sameOne(user, ss[i])) return true; }
  return false;
}

/* ============ 顺序 / 错词（选择题） ============ */
function buildOptions(it){
  /* 1 个正确答案 + 3 个随机干扰（来自其它词条释义），选项顺序随机；
     干扰项优先选与正确答案长度相近的，选项更像人话；
     并排除"与正确答案同义/互为子串"的干扰项，避免出现两个都算对的选项 */
  var correct=it.cn, L=Math.max(1, correct.length);
  var nc=normCn(correct);
  var cap=Math.max(16, Math.round(L*1.6)), rcap=Math.max(24, Math.round(L*2.5));
  var best=[], fallback=[], seen={};
  seen[correct]=1;
  function ambiguous(cn){
    var n=normCn(cn);
    if(n===nc) return true;                                  /* 规范化后完全相同 */
    if(n.length>=2 && nc.length>=2 && (n.indexOf(nc)>=0 || nc.indexOf(n)>=0)) return true; /* 互为子串 */
    return false;
  }
  var others=shuffle(BANK);
  for(var i=0;i<others.length;i++){
    var cn=others[i].cn;
    if(!cn || seen[cn]) continue;
    if(ambiguous(cn)) continue;
    if(senses(cn)[0]===senses(correct)[0]) continue;         /* 首义项相同也跳过，避免近似重复 */
    seen[cn]=1;
    if(cn.length<=cap){ best.push(cn); if(best.length>=6) break; }
    else if(cn.length<=rcap){ fallback.push(cn); }
  }
  var pool=best.slice(0,3);
  for(var j=0;j<fallback.length && pool.length<3;j++) pool.push(fallback[j]);
  if(pool.length<3){                                         /* 兜底：放宽长度限制再补 */
    for(var k=0;k<others.length && pool.length<3;k++){
      var c2=others[k].cn;
      if(!c2 || seen[c2] || ambiguous(c2)) continue;
      seen[c2]=1; pool.push(c2);
    }
  }
  return shuffle(pool.concat([correct]));
}

function pickOption(el, cn, it){
  if(answered) return;
  var right=(normCn(cn)===normCn(it.cn));
  /* 同义项也算对（个别词条释义写法略有差异） */
  if(!right && checkMeaning(cn, it)) right=true;
  answered=true;
  var nodes=document.querySelectorAll("#opts .opt");
  forEachNode(nodes, function(n){
    var isThis=(n===el);
    if(normCn(n.getAttribute("data-cn"))===normCn(it.cn)) n.classList.add("right");
    else if(isThis) n.classList.add("wrong");
  });
  var r=rec(it.id);
  if(right){
    record(it.id, true, mode==="错词"?"wrong":"seq");
    stat();
    var extra="";
    if(r.wrong_count) extra="\n（该词累计答错 "+r.wrong_count+" 次）";
    if(r.in_wrong) extra+="\n📕 仍在错词本：寿命 "+r.life+"（只有「错词考试」答对才 -1）";

    toast("✅ 正确");
    setTimeout(function(){ if(answered && mode!=="错词") nav(1); }, 1100);
  }else{
    record(it.id, false, mode==="错词"?"wrong":"seq");
    stat();
    showFb("<span class='tag-no'>❌ 答错了，已加入错词本</span>\n<span class='k'>"+it.en+"</span> —— "+it.cn+

function nav(d){

/* ============ 考试（普通：20 题填空听写；错词考试：≤10 题选中文） ============ */
var EXAM_NUM=20, EXAM_SCORE=5, WEXAM_NUM=10;
var exam=null, examUsed=0, examTimer=null, examChecked=false;
function examTitle(){ return (exam&&exam.kind==="wrong")?"错词考试":"模拟考试"; }

function examIds(){ return BANK.map(function(x){ return x.id; }); }
function pickPlanned(ids, orderKey, curKey, n){
  var plan=(progress._exam_plan && typeof progress._exam_plan==="object")?progress._exam_plan:{};
  var order=plan[orderKey];
  if(!Array.isArray(order) || order.length!==ids.length ||
     ids.some(function(id){ return order.indexOf(id)<0; })){
    order=shuffle(ids); plan[curKey]=0;
  }
  var m=order.length, cur=plan[curKey]||0;
  if(!(cur>=0) || cur>=m) cur=0;
  var end=cur+n, picked;
  if(end<=m) picked=order.slice(cur,end);
  else picked=order.slice(cur).concat(order.slice(0,end-m));
  plan[orderKey]=order; plan[curKey]=end%m;
  progress._exam_plan=plan;
  return picked;
}
function enterExamBoard(){
  if(exam && exam.active){
    if(exam.finished){ renderResult(); return; }
    if(exam.paused){ showPaused(); return; }
    startTicker(); renderExamQ(); return;
  }
  renderExamReady();
}

    "· 答错的词自动进入「错词」板块\n"+
    "· 错词清除规则：只有「错词考试」答对才减少寿命，寿命归零后移除\n"+
    "· 抽词用环形算法：每场 20 题不重复，连续多场可覆盖全部 "+BANK.length+" 个单词\n"+
    "· 考试中可暂停/退出，强制关闭也会自动保存，下次打开继续\n"+
    "· 考试中不能切换板块\n\n当前第 "+(cnt+1)+" 次考试 · 已完成 "+cnt+" 次\n\n点击下方「开始考试」按钮开始。（错词考试在「错词」板块进入）";
  footerBtns([["开始考试","#1a5276",function(){ startExam(); }]]);

function startExam(kind){
  kind=kind||"normal";
  var ids;
  if(kind==="wrong"){
    var wIds=BANK.filter(function(x){ return recGet(x.id).in_wrong; }).map(function(x){ return x.id; });
    if(!wIds.length){ msg("错词考试","当前没有错词，先去刷词吧！"); return; }
    ids=shuffle(wIds).slice(0,Math.min(WEXAM_NUM,wIds.length));
  }else{
    ids=pickPlanned(examIds(), "en_order", "en_cur", EXAM_NUM);
  }
  exam={active:true,finished:false,paused:false,kind:kind,ids:ids,idx:0,answers:{},order:{}};
  examUsed=0; examChecked=false;
  progress.exam=exam; save();
  startTicker(); examBarShow([["⏸ 暂停","#b9770e",pauseExam],["📮 交卷","#27ae60",askFinish]]);
  renderExamQ();
}
function startWrongExam(){

  var w=BANK.filter(function(x){ return recGet(x.id).in_wrong; });
  if(!w.length){ msg("错词考试","当前没有错词，先去刷词吧！"); return; }

function startTicker(){

function wrongExamPick(it, cn){
  if(!exam || !exam.active || exam.finished || exam.paused) return;
  if(exam.answers[it.id]) return;                       /* 每题只判一次 */
  var right=(normCn(cn)===normCn(it.cn));
  if(!right && checkMeaning(cn, it)) right=true;
  exam.answers[it.id]={ans:cn, correct:it.cn, ok:right};
  var cleared=record(it.id, right, "wexam");            /* 错词考试：答对寿命-1 */
  examChecked=true; progress.exam=exam; save();
  renderExamQ(); renderExamNav();
  showFb((right?"<span class='tag-ok'>✅ 回答正确！</span>":"<span class='tag-no'>❌ 回答错误</span>")+
         "\n<span class='k'>"+it.en+"</span> —— 正确答案："+it.cn+
         "\n你选的是："+cn+
         (cleared?"\n🎉 错词寿命归零，已从错词本移除！":"\n📕 仍在错词本：寿命 "+recGet(it.id).life+""));

  progress.exam=exam; save();

  stat(); renderExamNav();
  examChecked=true;
  inp.disabled=true;
  showFb((ok?"<span class='tag-ok'>✅ 回答正确！</span>":"<span class='tag-no'>❌ 回答错误（已加入错词本）</span>")+
         "\n<span class='k'>"+it.en+"</span> —— 正确答案："+it.cn+
         "\n你的答案："+user+
         (ok?"":"\n📕 错词寿命 "+recGet(it.id).life+"（在「错词考试」中答对 -1）"));
  toast(ok?"✅ 正确":"❌ 错误");

function examNext(){

  stat();

/* ============ 重置 ============ */
function resetProgress(){ resetStep(1); }

  else confirm2("重置进度（3/3）","最后一次确认：立即清空全部数据并重新开始！",function(){

        examUsed=exam.used||0;
        exam.idx=Math.max(0,Math.min(exam.idx||0, exam.ids.length-1));
        if(exam.finished){ renderResult(); }
        else if(exam.paused){ showPaused(); }
        else{
          examBarShow([["⏸ 暂停","#b9770e",pauseExam],["📮 交卷","#27ae60",askFinish]]);
          startTicker(); examChecked=!!(exam.answers&&exam.answers[exam.ids[exam.idx]]); renderExamQ();
        }
        window.__appReady=true;
        return;
      }
    }
    mode="顺序";
    queue=BANK.slice();
    idx=resumeIndex();
    renderQ();
    window.__appReady=true;
  }catch(e){
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    progress={}; exam=null; mode="顺序"; queue=BANK.slice(); idx=0;
    try{ renderQ(); }catch(_){}
    showErrBox("初始化失败（已自动清除本地旧数据，请刷新页面重试）："+((e&&e.message)?e.message:e));
  }
})();

    tip.style.cssText="position:fixed;left:0;right:0;top:0;background:#fff8e1;color:#8a6d3b;font-size:12px;line-height:1.6;padding:7px 34px 7px 10px;z-index:998;text-align:center";
    var tx=document.createElement("span"); tx.textContent="✕";
    tx.style.cssText="position:absolute;right:6px;top:5px;font-size:14px;cursor:pointer;padding:2px 8px;color:#8a6d3b";
    tx.onclick=function(){ if(tip.parentNode) tip.parentNode.removeChild(tip); };

    tip.appendChild(tx); document.body.appendChild(tip);
  }catch(e){}
}
</script>
