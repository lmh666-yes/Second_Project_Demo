: "单选题", "num": 323, "stem": "下面程序段的运行结果是（　）\nchar *s=\"abcde\";\ns+=2;\nprintf(\"%d\", s);", "options": [{"key": "A", "text": "cde"}, {"key": "B", "text": "字符'c'"}, {"key": "C", "text": "字符'c'的地址"}, {"key": "D", "text": "无确定的输出结果"}], "answer": "D", "explain": "考点定位：本题考查指针算术、字符串字面量的存储形式，以及格式符与实参类型必须匹配这一硬规则。正确项依据：s 是指向字符串字面量 \"abcde\" 首字符的指针，s+=2 使 s 指向第 3 个字符 'c'；此时 s 是一个地址（int * 量级的指针值），而格式符 %d 要求对应的实参是 int。用 %d 打印指针类型是未定义行为，标准既没有规定输出什么，也不保证能移植，所以严格答案是没有确定输出，选 D。干扰项分析：A 的 cde 需要格式符写 %s 才会输出（而且必须写成 printf(\"%s\", s)）；B、C 都是对取值的描述，%d 并不会因为实参是指针就自动改印所指字符或改印成地址的说明文字，它们描述的是“s 指向什么”，不是本题的打印结果。易错提醒：打印指针的正规写法是 printf(\"%p\", (void *)s)，且必须把指针转换为 void *；很多 32 位平台会把地址按十进制原样印出（例如某个具体数字），这会让本题看起来“有确定结果”，但那是实现定义/未定义的行为，考试一旦问“无确定输出结果”就应该选它。另外原卷此处把变量写成大写 S+=2，与声明 char *s 不一致，按小写 s 理解（同一变量的大小写笔误）。", "imgs": []}, {"id": "choice-324", "kind": "choice", "kind_name": "单选题", "num": 324, "stem": "设 p1 和 p2 是指向同一个字符串的指针变量，c 为字符变量，则以下不能正确执行的赋值语句是（　）", "options": [{"key": "A", "text": "c=*p1+*p2;"}, {"key": "B", "text": "p2=c;"}, {"key": "C", "text": "p1=p2;"}, {"key": "D", "text": "c=*p1*(*p2);"}], "answer": "B", "explain": "考点定位：本题考查指针与字符的赋值类型匹配：指针之间可互相赋值，但不能把整数/字符赋给指针（除 0 这种空指针常量）。正确项依据：p1、p2 都是 char *，类型相同，p1=p2 是合法赋值；p2 是 char *，c 是 char，把 char 赋给 char * 会让编译器把字符的整数编码当成地址使用，属于类型错误，故 p2=c 不能正确执行，选 B。干扰项分析：A 的 *p1 与 *p2 各是一个 char，char 相加按整数提升后进行，结果是 int，赋给 char 型 c 会发生实现定义的截断但语句合法；C 见上，合法；D 的 *p1*(*p2) 是两个 char 相乘再赋给 c，同样合法（只是可能溢出）。易错提醒：这题的经典陷阱是“把字符变量当指针用”，正确的做法是先取地址（p2=&c）或者干脆用整型；另外 *p1*(*p2) 中的括号不能省，否则 *(p1*(*p2)) 会被解析成先做乘法再解引用，含义完全不同。", "imgs": []}, {"id": "choice-325", "kind": "choice", "kind_name": "单选题", "num": 325, "stem": "下面程序的运行结果是（　）\n程序：\n#include <stdio.h>\n#include <string.h>\nvoid fun(char *w, int n)\n{\n    char t,*s1,*s2;\n    s1=w;\n    s2=w+n-1;\n    while(s1<s2)\n    {\n        t=*s1++;\n        *s1=*s2--;\n        *s2=t;\n    }\n}\nint main(void)\n{\n    char p[]=\"1234567\";\n    fun(p, strlen(p));\n    puts(p);\n}", "options": [{"key": "A", "text": "7654321"}, {"key": "B", "text": "1714171"}, {"key": "C", "text": "1711717"}, {"key": "D", "text": "7177171"}], "answer": "C", "explain": "考点定位：本题考查用两个指针在字符串首尾同时游走完成原地逆置、后缀自增自减的取值时机，以及把程序完整“算一遍”的能力，最后还要与选项逐一比对。正确项依据：fun 中 s1=w 指向 p[0]，s2=w+n-1 指向 p[n-1]；n=strlen(p)=7，故 s1→p[0]='1'、s2→p[6]='7'。每轮的执行序列是：t=*s1++ 先取出 s1 当前所指字符、再把 s1 后移一格；*s1=*s2-- 把 s2 当前所指字符写入 s1 现在所指的位置、再把 s2 前移一格；*s2=t 把暂存字符写入 s2 现在所指的位置。把 7 个字符写出来逐步跟踪：初始 1 2 3 4 5 6 7（下标 0~6）；第 1 轮：t='1'，s1 移到下标 1，p[1] 被赋成 p[6]='7'，s2 移到下标 5，p[5]='1'，得 1 7 3 4 5 1 7；第 2 轮：t=p[1]='7'，s1 移到下标 2，p[2] 被赋成 p[5]='1'，s2 移到下标 4，p[4]='7'，得 1 7 1 4 7 1 7；第 3 轮：t=p[2]='1'，s1 移到下标 3，p[3] 被赋成 p[4]='7'，s2 移到下标 3，p[3]='1'，得 1 7 1 1 7 1 7（此时 s1 与 s2 都停在下标 3，s1<s2 不成立，循环结束）。最终数组是 1 7 1 1 7 1 7，puts 输出 1711717。换个更直观的口径核对：该循环做的并不是逐对首尾互换（因为 s1++ 在取字符时已经先走了一步），而是把 s1 后面的字符与 s2 位置的字符互换，再回填暂存字符，所以真正的结果与标准逆置不同；在纸上按上面三轮逐格写数组是最可靠的做法。选项比对：A=7654321、B=1714171、C=17171717（8 位，与 7 字符串长度矛盾，先排除）、D=7177171，四个选项与真实结果 1711717 都不相同，故本条记为存疑（无正确选项）。干扰项分析：A 的 7654321 是按标准整体逆置算出的串，但本题的指针写法因 s1++ 的额外偏移并不等于标准逆置；B 的 1714171 与 D 的 7177171 都是同一族数字的重排，容易让人误以为“只剩 1 和 7 就够了”，但缺了一位 1 或者次序不对；C 的位数直接就不对。易错提醒：本题最大的坑是把 *s1++ 与 *(++s1) 混淆——*s1++ 是“先取 *s1，再让 s1 自增”，等价于 *(s1++)，而不是先把指针前移；另外 fun 用 void 返回、main 无返回类型都是原卷的 C89 风格写法；原卷印刷/转录还有三处形近误录：第 3 行 fun(char \"w, int n) 的引号实为星号，应为 fun(char *w, int n)，第 6 行 s1=W; 的 W 应为小写 w（原图是小写 w，本文件已修正），main 段 char p0=\"1234567\"; fun(p, strlen(p)); 中的 p0 应为 p[]（原图是方括号，转录成了数字 0，本文件已修正为 char p[]=\"1234567\"; fun(p, strlen(p));）。", "imgs": []}, {"id": "choice-326", "kind": "choice", "kind_name": "单选题", "num": 326, "stem": "若有以下定义，则对 a 数组元素的正确引用是（　）\nint a[5], *p=a;", "options": [{"key": "A", "text": "*&a[5]"}, {"key": "B", "text": "a+2"}, {"key": "C", "text": "*(p+5)"}, {"key": "D", "text": "*(a+2)"}], "answer": "D", "explain": "考点定位：本题考查指针与数组下标的等价表示、数组名的退化规则，以及数组下标从 0 开始、合法范围是 0~4。正确项依据：*(a+2) 中 a 退化为指向 a[0] 的 int *，a+2 指向 a[2]，再解引用就得到 a[2] 这个元素（左值），下标 2 在 [0,5) 之内，合法，选 D。干扰项分析：A 的 &a[5] 先取 “a[5] 的地址”，但 a[5] 已经越界（a 只有 5 个元素，合法下标 0~4），越界元素的地址虽在算术上可表示，但对它的间接引用属于越界访问，不是对数组元素的正确引用；B 的 a+2 类型是 int *，得到的是地址不是元素（要取值必须解引用），而且题目问的是“引用元素”；C 的 *(p+5) 等价于 p[5]，同样越界一格。易错提醒：数组名在表达式中退化为指向首元素的指针，只有 sizeof 和 & 两种场合例外；&a[5] 这种“正好越界一位”的写法是常见陷阱，编译器不一定报错，但语义上不是数组元素；另外要区分“元素的正确引用”与“元素地址的正确表示”，B、C 都是地址层面的表达式。", "imgs": []}, {"id": "choice-327", "kind": "choice", "kind_name": "单选题", "num": 327, "stem": "一个立方体的六面，分别写着 ABCDEF 六个字母，根据以下四张图，推测 B 的对面是什么字母（　）\n（配图见下方四张立方体图）", "options": [{"key": "A", "text": "c"}, {"key": "B", "text": "d"}, {"key": "C", "text": "e"}, {"key": "D", "text": "f"}], "answer": "C", "explain": "考点定位：本题考查空间想象与“同一视图内三个面两两相邻、相对的两面永不同时可见”的推理。正确项依据：先把四张图读成相邻关系——(1) 顶 e、正 a、右 c 三个面两两相邻；(2) 顶 a、正 b、右 c 两两相邻；(3) 顶 f、正 e、右 c 两两相邻；(4) 顶 e、正 d、右 a 两两相邻。由 (1)(2)(4) 可知 a 与 b、c、e、d 都相邻，即 a 的四个邻面是 b、c、e、d，六个字母中除 a 自身外只剩 f，所以 a 与 f 相对；c 在 (1)(2)(3) 三张图中都出现，说明 c 与 a、b、e、f 都相邻，c 的对面只能是剩下的 d；剩下的一对就是 b—e：e 的邻面由图 (1) 给出 a、c，由图 (3) 给出 f，由图 (4) 给出 d，e 与 a、c、f、d 都相邻、唯独不与 b 同时可见，所以 b 的对面是 e，选 C。用四张图逐张验证该配对无矛盾：相对面永不同时出现——图 (1) 出现 e、a、c（分别属于 b-e、a-f、c-d 三对，互不冲突）；图 (2) 出现 a、b、c；图 (3) 出现 f、e、c；图 (4) 出现 e、d、a，四张图里都没有任何一对相对面同时露面，配对自洽。干扰项分析：A 的 c 与 b 在图 (2) 中（顶 a、正 b、右 c）同时可见，说明 b 与 c 相邻而非相对；B 的 d 由图 (4) 与 a、e 同时可见（顶 e、正 d、右 a），也与 (1) 的 a、c、e 相容，d 属于 c—d 这一对、不是 b 的对面；C 的 e 正是与 b 相对的那一面（配对关系 b—e，两字母在四张图里从未同时出现），是本题正确项。易错提醒：这类题必须先把所有“同时可见 ⇒ 两两相邻”的关系列全，再用“邻面数最多 4 个”逐一排除，只看一两张图很容易把相邻误判成相对；配图已从原卷裁出（四张立方体图，下方依次标 (1)(2)(3)(4)）。", "imgs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+oAAAFeCAAAAAA3MbpEAAEAAElEQVR4nOz9h3LkWJI2CkKGJoM6s6p77r3v/xT7JNf+f6a7MkkGgwwtoNZc+wEQzOy7ZrtmW8RMV5JBBHCU68/d4yb6ur6ur+v//6/k/9cD+Lq+rq/r/xvXF6l/XV/X3+L6IvWv6+v6W1xfpP51fV1/i+uL1L+ur+tvcX2R+tf1df0tri9S/7q+rr/F9UXqX9fX9be4vkj96/q6/hbXF6l/XV/X3+L6IvWv6+v6W1xfpP51fV1/i+uL1L+ur+tvcX2R+tf1df0tri9S/7q+rr/F9UXqX9fX9be4vkj96/q6/hbXF6l/XV/X3+L6IvWv6+v6W1xfpP51fV1/i+uL1L+ur+tvcX2R+tf1df0tri9S/7q+rr/F9UXqX9fX9be4vkj96/q6/hbXF6l/XV/X3+L6IvWv6+v6W1xfpP51fV1/iyvr/fT/1TRNHMcR/F8UQQfHBv8bN02Ef8DP4b9NU0dpTH9vgnvhh6Zu8BlNA//iX+IY/w7PwFuiqKnrOorxqRH+29R1g9+KExgDf0OeH8dJBKODZ8II6K/8LBxh7J4 理块号，文件的数据块可以散布在任意空闲块上——逻辑上连续、物理上离散，因此不必为整块连续的磁盘空间而等待，能很方便地实现物理块的动态分配，也便于文件动态增长，选 B。干扰项分析：A 错，索引组织虽然不用链指针串数据块，但索引表本身要占空间（而且有的实现把索引块也用指针串起来），所以“不需要链接指针”不是它的主要优点，反而“要多占索引空间”是它的缺点；C 错，回收时要释放数据块和索引块，而且索引表的维护（增删条目、索引块分裂）比连续分配的回收复杂；D 错，用户“存取方便”是文件系统对用户透明的结果（三种物理结构对用户都是按名存取、按逻辑地址读写），不是索引组织区别于其他组织的主要优点。易错提醒：典型对比要记牢——连续分配：支持随机存取、顺序读快、但不利于文件增长且易产生外部碎片；链接分配：无外部碎片、便于增长、但只能顺序存取且指针占空间、可靠性差；索引分配：支持随机存取、便于动态增长、代价是索引表开销。", "imgs": []}, {"id": "choice-330", "kind": "choice", "kind_name": "单选题", "num": 330, "stem": "文件目录的主要作用是（　）", "options": [{"key": "A", "text": "按名存取"}, {"key": "B", "text": "提高速度"}, {"key": "C", "text": "节省空间"}, {"key": "D", "text": "提高外存利用率"}], "answer": "A", "explain": "考点定位：本题考查文件目录（FCB 的集合）在文件系统中的职责。正确项依据：文件目录记录了文件名与文件控制块（FCB，包含物理位置、大小、权限、时间等信息）之间的映射，用户只需给出文件名，系统通过查目录就能定位文件的物理位置并完成读写，即“按名存取”——这正是目录存在的根本目的，也是文件系统对用户提供的最基本抽象，选 A。干扰项分析：B 错，目录的检索本身要花时间（为此才有索引结点、哈希目录、多级目录等优化），“提高速度”是目录结构改进的目标而不是目录的主要作用；C 错，目录项要占存储空间，多级目录甚至会增加空间开销，它的职责不是省空间；D 错，提高外存利用率靠的是块分配算法与空闲空间管理，与目录的职责不同。易错提醒：不要把“目录的作用”和“目录结构的改进”混为一谈；另外要区分“按名存取”（用户视角的目标）与“文件共享/保护/重名问题”（目录能带来的附加能力）。", "imgs": []}, {"id": "choice-331", "kind": "choice", "kind_name": "单选题", "num": 331, "stem": "以下不合法的用户标识符是（　）", "options": [{"key": "A", "text": "f2_G3"}, {"key": "B", "text": "lf"}, {"key": "C", "text": "4d"}, {"key": "D", "text": "_8"}], "answer": "C", "explain": "考点定位：本题考查 C 语言标识符的构词规则：只能由字母、数字、下划线组成，且首字符不能是数字；同时不能是关键字。正确项依据：4d 以数字 4 开头，违反“首字符必须是字母或下划线”的规则，是非法标识符，选 C。干扰项分析：A 的 f2_G3 由字母、数字、下划线组成且以字母开头，合法；B 的 lf 是两个字母、以字母开头，合法（注意它与 C++11 的 long double 后缀 l/L 无关，这里只是一个普通标识符；原卷该选项的字母识别可能把“l（小写 L）”看成“1”，若真是“1f”就非法，但原图字形为小写 L，按合法处理）；D 的 _8 以下划线开头，后接下划线/数字都合法，只是以下划线开头的名字在库/保留名约定上要谨慎使用（双下划线或下划线+大写是保留给实现的）。易错提醒：标识符区分大小写（Abc 与 abc 是两个名字）；关键字（int、for、while 等）不能作标识符；长度上 C89 只保证前 31 个有效字符（外部名 6 个），超长会被截断，这也是嵌入式编码规范限制名字长度的原因。", "imgs": []}, {"id": "choice-332", "kind": "choice", "kind_name": "单选题", "num": 332, "stem": "C 语言中，double 型数据所占字节数是（　）", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "4"}, {"key": "C", "text": "6"}, {"key": "D", "text": "8"}], "answer": "D", "explain": "考点定位：本题考查 C 基本数据类型在主流平台上的长度。正确项依据：C 标准只规定 sizeof(float) ≤ sizeof(double) ≤ sizeof(long double)，并没有写死字节数；但在所有主流平台（x86/x64/ARM 的 Windows、Linux、macOS）上 double 都采用 IEEE 754 双精度格式，占 8 字节（64 位：1 位符号、11 位阶码、52 位尾数），能表示约 15~16 位有效十进制数字，选 D。干扰项分析：A 的 2 字节是 16 位平台上的 int/short 常见长度；B 的 4 字节是 float 的长度（单精度，约 7 位有效数字）；C 的 6 字节是早期某些 8 位/16 位编译器的“long double/双精度”实现，现代平台已不再使用。易错提醒：记长度要成组记——char 1、short 2、int 4（16 位机为 2）、long 4（Windows/Linux 64 位下 Linux 是 8）、long long 8、float 4、double 8、指针 4（32 位）/8（64 位）；面试若被追问，要主动说明“标准只保证大小关系，具体由实现决定，可用 sizeof 验证”。", "imgs": []}, {"id": "choice-333", "kind": "choice", "kind_name": "单选题", "num": 333, "stem": "关于 if 语句中圆括号内的表达式，以下叙述正确的是（　）", "options": [{"key": "A", "text": "只能用逻辑表达式"}, {"key": "B", "text": "只能用关系表达式"}, {"key": "C", "text": "只能用关系表达式或逻辑表达式"}, {"key": "D", "text": "可以用任意表达式"}], "answer": "D", "explain": "考点定位：本题考查 if 语句对条件表达式的类型要求：C 语言的条件只要求“标量表达式”，不限定必须是关系或逻辑表达式。正确项依据：if (表达式) 的语义是先求表达式的值，再与该值是否等于 0 比较：非 0 为真、0 为假；表达式可以是任意类型（算术、指针、赋值、函数调用、逗号表达式等），例如 if (x)、if (p)、if (a=b)、if (i--) 都合法，所以选 D。干扰项分析：A、B、C 都把条件限制成某类表达式，与 C 的规则不符；其中 C 是看起来最“像”的答案（因为实践中 if 里最常见的就是关系和逻辑表达式），但它不是语言的强制要求。易错提醒：if (x) 与 if (x != 0) 在语义上等价（x 是标量时），但可读性上前者容易把“判空指针/判分配失败”与“判整数”混同；另外 if (a=b) 是合法的（先赋值、再按结果判真假），而 if (a==b) 才是比较，少写一个等号是经典 bug，很多编译器会用 -Wparentheses 告警。", "imgs": []}, {"id": "qa-334", "kind": "qa", "kind_name": "特殊题", "num": 334, "stem": "若 a=1、b=15、c=0，则表达式 a 的值为（　）", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "0"}, {"key": "C", "text": "非 0"}, {"key": "D", "text": "真"}], "answer": "存疑：原卷题干缺待求表达式（印成“则表达式a的值为”），无法唯一确定答案（数值口径为 1、布尔口径为“真”，选项把两种口径混放）；请对照原卷。", "explain": "考点定位：本题考查真值口径，但原卷题干本身漏印了待求的表达式：题面只写到「若 a=1、b=15、c=0，则表达式 a 的值为」，并没有给出任何算式（已放大原图核对，原图此处即如此，不是转写遗漏）。「表达式 a」就等于 a 本身，按“非零即真”只能答 D 真，按“a 的值为多少”则应答 A 1，而原卷四个选项把这两种口径混放在一起（A.1、B.0 是数值口径，C.非 0、D.真 是布尔口径），无法唯一确定，故按题库规范标为存疑。若按命题意图（判断 a 的真值）作答，取 D 真。", "imgs": []}, {"id": "choice-335", "kind": "choice", "kind_name": "单选题", "num": 335, "stem": "线性表 L=(a1,a2,…,ai,…,an)，下列说法正确的是（　）", "options": [{"key": "A", "text": "每个元素都有一个直接前驱和直接后继"}, {"key": "B", "text": "线性表中至少要有一个元素"}, {"key": "C", "text": "表中诸元素的排列顺序必须是由小到大或由大到小的"}, {"key": "D", "text": "除第一个元素和最后一个元素外，其余每个元素都有一个且仅有一个直接前驱和直接后继"}], "answer": "D", "explain": "考点定位：本题考查线性表的逻辑结构定义：元素之间是一对一的线性关系，除首尾外每个元素有且只有一个前驱和一个后继。正确项依据：按定义，a1 没有前驱、an 没有后继，中间元素 ai（1<i<n）恰好有一个前驱 a(i-1) 和一个后继 a(i+1)，所以 D 的叙述准确，选 D。干扰项分析：A 错，它把首元素（无前驱）和尾元素（无后继）也算了进去，只有 n≥3 时中间元素才满足，首尾元素永远不满足；B 错，线性表允许空表（n=0），空表是合法的线性表；C 错，线性表只要求元素之间有序（存在唯一的次序），并不要求元素的值按大小排序，例如 (3,1,7) 仍是合法线性表。易错提醒：区分“有序”的两种含义——线性表的“有序”指位置次序确定，不是指值的大小关系（后者是排序表/有序表的概念）；另外线性表是逻辑结构，顺序表和链表是它的两种存储结构，不要拿存储方式去回答逻辑性质的题。", "imgs": []}, {"id": "choice-336", "kind": "choice", "kind_name": "单选题", "num": 336, "stem": "设 int x[] = {5, 6, 7, 8, 9}, *p = x;，则值为 7 的表达式是（　）", "options": [{"key": "A", "text": "p+=2, p++"}, {"key": "B", "text": "p+=2, *++p"}, {"key": "C", "text": "p+=2, *p++"}, {"key": "D", "text": "p+=2, ++*p"}], "answer": "C", "explain": "考点定位：本题考查指针算术与 *、++ 三个运算符的结合性/优先级：后缀 ++ 优先级高于 *，前缀 ++ 与 * 同级且从右向左结合。正确项依据：先 p+=2，使 p 指向 x[2]（元素 7）；再看第二个逗号表达式的子表达式——C 的 *p++ 等价于 *(p++)，先取 *p 得到 x[2]=7，再把 p 后移一格，所以整个表达式的值就是 7，选 C。干扰项分析：A 的 p+=2,p++ 里第二个子表达式 p++ 整个表达式是“旧指针值”，其类型是 int *，不是整数 7（而且整个逗号表达式的值是最后一个子表达式的值，即旧指针）；B 的 *++p 先让 p 自增到 x[3] 再解引用，得到 8；D 的 ++*p 是对 (*p) 自增，把 x[2] 从 7 改成 8，表达式的值是 8，还会破坏数组数据。易错提醒：逗号表达式的值等于最后一个子表达式的值，所以 A 返回的不是 7 而是指针；内存口诀是“*p++ 先取值再移指针、(*p)++ 取的值自增、*++p 先移指针再取值、++*p 把所指对象加一”，四者务必分清。", "imgs": []}, {"id": "choice-337", "kind": "choice", "kind_name": "单选题", "num": 337, "stem": "以下的 C 程序代码片段运行后 c 和 d 的值分别是多少（　）\nint a=1, b=2;\nint c, d;\nc=(a&b)&&a;\nd=(a&&b)&a;", "options": [{"key": "A", "text": "1,1"}, {"key": "B", "text": "0,0"}, {"key": "C", "text": "0,1"}, {"key": "D", "text": "1,0"}], "answer": "C", "explain": "考点定位：本题考查逻辑与 && 与按位与 & 的区别，以及两者在同一式子里混排时的求值顺序。正确项依据：a=1、b=2 都非 0。第一式 c=(a&b)&&a：先做按位与 1&2 = 01&10 = 00 = 0，再与 a 做逻辑与 0&&1，左操作数为 0（假）立即短路，结果 c=0。第二式 d=(a&&b)&a：先做逻辑与 1&&2，结果为真、值是 int 的 1，再把 1 与 a=1 按位与，1&1 = 1，结果 d=1。所以 (c,d) = (0,1)，选 C。干扰项分析：A 的 (1,1) 把第一式也当成了逻辑与；B 的 (0,0) 把第二式的按位与结果算成了 0；D 的 (1,0) 把两式对调，误以为 c 用 &&、d 用 &。易错提醒：&& 的结果只可能是 1 或 0，而 & 的结果是逐位相与得到的整数值；&& 有短路（左操作数为假时右边不求值），& 则两个操作数都要先求值；& 的优先级低于 ==，写 (a&b)==c 时必须加括号。审题时务必逐字看清是一根 & 还是两根 &&，这是本题唯一的考点。", "imgs": []}, {"id": "choice-338", "kind": "choice", "kind_name": "单选题", "num": 338, "stem": "这段程序的输出是（　）\nvoid e(int);\nint main(void)\n{\n    int a;\n    a=3;\n    e(a);\n}\nvoid e(int n)\n{\n    if(n>0)\n    {\n        e(--n);\n        printf(\"%d\",n);\n        e(--n);\n    }\n}", "options": [{"key": "A", "text": "0120"}, {"key": "B", "text": "0121"}, {"key": "C", "text": "1201"}, {"key": "D", "text": "0211"}], "answer": "A", "explain": "考点定位：本题考查递归调用的执行顺序、参数按值传递（每次递归各自持有一份 n），以及前缀自减的时机。正确项依据：把调用展开——e(3)：n=3>0，先求 e(--n) 即 e(2)；e(2)：n=2>0，先求 e(--n) 即 e(1)；e(1)：n=1>0，先求 e(--n) 即 e(0)；e(0)：n=0，if 不成立，直接返回；回到 e(1)，此时 n=0，printf 打印 0，然后求 e(--n) 即 e(-1)，n 变 -1，if 不成立返回；回到 e(2)，此时 n=1，printf 打印 1，然后 e(--n) 即 e(0)，返回；回到 e(3)，此时 n=2，printf 打印 2，然后 e(--n) 即 e(1)：n=1>0，先 e(--n)=e(0) 返回，printf 打印 0，再 e(--n)=e(-1) 返回；整个输出依次为 0、1、2、0，即 0120，选 A。干扰项分析：B 的 0121 多了一位，是把某次 e(--n) 的副作用当成了打印；C 的 1201 顺序颠倒，是把“先打印后递归”当成了“先递归后打印”；D 的 0211 既顺序不对、也把最后一位算错。易错提醒：递归题必须画出“调用—返回”的执行栈，并记住每个栈帧里的 n 是各自独立的局部变量，对形参自减只影响本层；另外 e 没有 else 分支，n 降到 0 时是直接跳过整段 if 返回，不会打印，所以输出里虽然出现 0 但只出现在 printf 的位置上。", "imgs": []}, {"id": "choice-339", "kind": "choice", "kind_name": "单选题", "num": 339, "stem": "本程序执行到最后，j 的值是（　）\nint counter(int i)\n{\n    static int count = 0;\n    count = count + i;\n    return(count);\n}\nint main(void)\n{\n    int i, j;\n    for(i=0; i<=5; i++)\n        j=counter(i);\n}", "options": [{"key": "A", "text": "10"}, {"key": "B", "text": "15"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "B", "explain": "考点定位：本题考查 static 局部变量的寿命与初始化时机，以及循环把函数返回值反复赋给同一变量。正确项依据：counter 里的 count 是 static 局部变量，只在程序开始时初始化一次、函数返回后依然存在，因此六次调用是累加：0+1+2+3+4+5=15；每次调用都把当前累加值 return 给 main，再赋给 j，循环结束时 j 是最后一次调用（i=5）的返回值，也就是 0+1+2+3+4+5=15，选 B。干扰项分析：A 的 10 相当于漏掉了某一次（例如只加到 4）；C 的 6 是循环次数而不是累加结果；D 的 7 是把 count 的初值 1 误加进去或用别的方式算错。易错提醒：static 局部变量的三条要点——只在首次进入时初始化一次（未显式初始化则自动置 0）、寿命贯穿整个程序、作用域仍限于本函数；题目里 for 的循环体没有花括号，只有 j=counter(i); 一句属于循环体，不要误以为 j 在循环外被赋最后一次值之外的东西；另外原卷此处写的是 inti,j;（转录音近粘连），本文件按 int i, j; 修正。", "imgs": []}, {"id": "choice-340", "kind": "choice", "kind_name": "单选题", "num": 340, "stem": "extern 关键字的作用是什么（　）", "options": [{"key": "A", "text": "声明外部链接"}, {"key": "B", "text": "声明外部头文件引用"}, {"key": "C", "text": "声明使用扩展 C++ 语句"}, {"key": "D", "text": "声明外部成员函数、成员数据"}], "answer": "A", "explain": "考点定位：本题考查 extern 的链接属性语义。正确项依据：extern 用于声明一个变量或函数具有外部链接（external linkage），即告诉编译器“这个符号的定义在别的翻译单元里，本处只做声明”，链接阶段再由链接器解析；它还可以用在函数声明前（函数声明默认就是 extern），所以选 A。干扰项分析：B 错，引用头文件用的是预处理指令 #include，与 extern 无关（extern 有时配合 extern \"C\" 使用，但那解决的是名字改编问题，不是“引用头文件”）；C 错，extern \"C\" 用于在 C++ 中按 C 语言的方式链接，属于链接约定而不是“扩展 C++ 语句”；D 错，extern 不是面向对象的成员声明机制，它声明的是具有外部链接的全局对象/函数，C++ 里类的成员由类定义与 static 等规则决定，不靠 extern 声明成“外部成员”。易错提醒：要分清“声明”与“定义”——int x; 在文件作用域是暂定义（tentative definition），extern int x; 是纯粹的声明（不分配存储）；同一变量在多个 .c 里都写定义会触发重复定义错误，正确做法是“一个 .c 定义 + 头文件里 extern 声明”。", "imgs": []}, {"id": "choice-341", "kind": "choice", "kind_name": "单选题", "num": 341, "stem": "设 int a[3][4];，则与元素 a[0][0] 不等价的表达式是（　）", "options": [{"key": "A", "text": "*a"}, {"key": "B", "text": "**a"}, {"key": "C", "text": "*a[0]"}, {"key": "D", "text": "*(*(a+0)+0)"}], "answer": "A", "explain": "考点定位：本题考查二维数组名的类型层次与解引用层级：a 退化为行指针，*a 退化为元素指针，对 a 连解两次引用才得到元素值，也就是常见的“数组名—行指针—元素指针—元素值”四层。正确项依据：a 的类型是 int[3][4]，作右值时退化为 int (*)[4]（指向一行 4 个 int 的指针）；对 a 解引用得到 *a，它退化为 int *，指向第 0 行的首元素，取到的是一行地址（指针值），并不等于一个 int 元素值 a[0][0]；而 C 的 *a[0] 按优先级解析为 *(a[0])，a[0] 是 int * 且等于 &a[0][0]，再解引用就得到 a[0][0]，等价；B 是对 a 连续两次解引用，*a 是 int *、再解一次得到 a[0][0] 的 int 值，等价；D 的 *(*(a+0)+0) 逐层展开：a+0 仍是行指针，*(a+0) 得第 0 行（int *），+0 不改变指向，再解引用得 a[0][0]，等价。所以与 a[0][0] 不等价的是 A（*a 得到的是首行地址 / int * 指针，而不是 0 号元素的整数值），选 A。干扰项分析：B、C、D 三者都精确等于 a[0][0]，只是解引用的写法层次不同，属于标准等价形式，不能选；A 的 *a 是把“行指针解引用”停在了中间一层，若把 a[0][0] 的地址（&a[0][0]）也当成“地址值”来比较更会混淆概念，题目问的是元素值，故不等价。显示说明：选项 B 原卷印的是连续两个星号（对 a 连续两次解引用），题库里按原样保留。易错提醒：必须记住 a、一次解引用的结果、两次解引用的结果三者类型依次是 int(*)[4]、int*、int，只有最后一层才是元素值；a[0] 与 *a 同类型同值，都可以写成 &a[0][0]，但 a 本身不是二级指针，所以用「int 双星号 p」去接收二维数组名是典型错误（那种写法只适用于指针数组 int *a[3]）；此外 *(a+1) 表示第 1 行而不是 a[1][0]，行指针每加 1 会跨过一整行（sizeof(int)*4 字节），元素指针加 1 只跨一个 int，两者的步长差别是本考点的核心。", "imgs": []}, {"id": "choice-342", "kind": "choice", "kind_name": "单选题", "num": 342, "stem": "设 #define L(x) 2*3.14x，则 L(x) 是（　）", "options": [{"key": "A", "text": "函数名"}, {"key": "B", "text": "函数调用"}, {"key": "C", "text": "无参的宏名"}, {"key": "D", "text": "带参的宏名"}], "answer": "D", "explain": "考点定位：本题考查带参宏（函数式宏）的定义形式与预处理期的纯文本替换语义。正确项依据：#define L(x) 2*3.14x 的形参表里有参数 x，宏体里也引用了 x，因此 L 是一个带参数的宏名（带参宏），使用时要写成 L(表达式) 并由预处理器在编译前完成文本替换，故选 D。干扰项分析：A 错，L 不是函数名，宏在预处理阶段就被替换掉了，不进入编译器的符号表，也没有函数调用的栈帧、参数求值顺序、类型检查等特征；B 错，写成 L(2+1) 表面上像函数调用，实际只是“宏调用”，替换后是 2*3.14*2+1 这样的文本（正是下面易错点）；C 错，无参宏的形参表是空的（如 #define PI 3.14），本题有形参 x，所以不是无参宏。易错提醒：本题的宏体没有给 x 加括号，也没有给整个宏体加括号，展开时按运算符优先级会出问题——L(2+1) 展开为 2*3.14*2+1 = 13.56 而不是 2*3.14*(2+1) = 18.84；规范写法是 #define L(x) (2*3.14*(x))；另外宏参数若是 a++，展开后可能被求值多次（如 #define SQ(x) x*x 里 SQ(a++) 会让 a++ 执行两次），这也是“能用 const/inline 函数就别用宏”的原因。", "imgs": []}, {"id": "choice-343", "kind": "choice", "kind_name": "单选题", "num": 343, "stem": "以 \"w\" 方式打开文本文件 a:\\aa.dat，若该文件已存在，则（　）", "options": [{"key": "A", "text": "新写入数据被追加到文件末尾"}, {"key": "B", "text": "文件被清空，从文件头开始存放新写入数据"}, {"key": "C", "text": "显示出错信息"}, {"key": "D", "text": "新写入数据被插入到文件首部"}], "answer": "B", "explain": "考点定位：本题考查 fopen 各打开模式对已存在文件的处理（截断 / 追加 / 只读）。正确项依据：\"w\"（write）模式以只写方式打开文本文件，若文件已存在则把其长度截断为 0（原内容全部丢失），写入从文件头开始；若文件不存在则新建，所以选 B。干扰项分析：A 的“追加到末尾”是 \"a\" 模式的语义；D 的“插入到文件首部”不是任何标准模式的语义——文件是字节流，\"w+\"/\"r+\" 也只是把文件指针定位到头部并覆盖写（不会把已有内容“后移插入”）；C 错，\"w\" 打开已存在文件是正常操作，不报错（只有路径不存在、无权限、只读文件系统等才会返回 NULL）。易错提醒：常见模式要成对记牢——\"r\" 只读、文件必须存在；\"w\" 只写、清空或新建；\"a\" 只写、定位到末尾追加；加 \"+\" 表示可读写；加 \"b\" 表示二进制（在 Windows 上会关闭 CRLF 与 Ctrl+Z 的文本处理）；另外本题路径写 a:\\aa.dat 是 Windows 盘符路径，程序里字符串必须转义成 \"a:\\\\aa.dat\"，否则 \\a 会被当成非法转义序列。", "imgs": []}, {"id": "choice-344", "kind": "choice", "kind_name": "单选题", "num": 344, "stem": "执行语句 k=5|3; 后，变量 k 的当前值是（　）", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "8"}, {"key": "C", "text": "7"}, {"key": "D", "text": "2"}], "answer": "C", "explain": "考点定位：本题考查按位或运算符 | 的逐位运算。正确项依据：把两个操作数写成二进制——5 = 0101、3 = 0011；逐位做或：0|0=0、1|0=1、0|1=1、1|1=1，得到 0111 = 7，所以 k 的值是 7，选 C。干扰项分析：A 的 1 是 5&3 的结果（0101 & 0011 = 0001），那是按位与；B 的 8 既不是 5|3 也不是 5<<3 的结果，属于算错位权；D 的 2 是 5^3 吗？——5^3 = 0110 = 6，不是 2，2 可能是把 5 与 3 的某一位单独取出或写成 5-3。易错提醒：四个位运算符必须分清——&（按位与，逐位都为 1 才为 1）、|（按位或，有一位为 1 即为 1）、^（按位异或，相异为 1）、~（按位取反）；注意不要把 | 与逻辑或 || 混用（5||3 的结果是 1），也不要把 & 与逻辑与 && 混用（5&&3 的结果也是 1）；面试里常被追问“如何用位运算实现置位/清位/翻转”：置位 x|=1<<n、清位 x&=~(1<<n)、翻转 x^=1<<n、判位 (x>>n)&1。", "imgs": []}, {"id": "choice-345", "kind": "choice", "kind_name": "单选题", "num": 345, "stem": "执行下列程序后输出的结果是（　）\nint a = 3, b = 4;\nvoid fun(int x1, int x2)\n{printf(\"%d,  %d\\n\", x1+x2, b);}\nint main(void)\n{\n    int a = 5, b = 6;\n    fun(a, b);\n}", "options": [{"key": "A", "text": "3,4"}, {"key": "B", "text": "11,1"}, {"key": "C", "text": "11,4"}, {"key": "D", "text": "11,6"}], "answer": "C", "explain": "考点定位：本题考查全局变量与局部变量的作用域屏蔽（shadowing）规则、实参按值传递。正确项依据：全局定义 a=3、b=4；main 里又定义了局部 a=5、b=6，在 main 内部局部名屏蔽全局名，所以 fun(a,b) 传入的是 5 和 6；但 fun 的函数体内没有声明 b，它看到的 b 是文件作用域的全局 b=4，因此 printf 的两个实参分别是 x1+x2=5+6=11 和全局 b=4，输出 11,  4，选 C。干扰项分析：A 的 3,4 是把两个值都当成全局变量；B 的 11,1 是把 b 错看成某个“1”；D 的 11,6 是误以为 fun 能看见 main 的局部 b（实际上名字查找按作用域链进行，函数定义处的全局 b 才是可见名）。易错提醒：C 语言是词法作用域，函数能访问到的是“定义处可见”的名字，而不是“调用处”的局部变量；同名局部变量在作用域内屏蔽全局变量，但在其作用域之外全局变量照旧可见；另外本题第二版转录把 \\n（反斜杠 n）识别成了 1n，若真按 %d1n 理解，输出会是 “11,  41n”，与四个选项都不符，故已按原图修正为 %d\\n 并按修正后作答。", "imgs": []}, {"id": "choice-346", "kind": "choice", "kind_name": "单选题", "num": 346, "stem": "设有定义 union u{int a[4]; float b[3]; char c[16];}aa; 则 printf(\"%d\\n\", sizeof(aa)); 的输出是（　）", "options": [{"key": "A", "text": "32"}, {"key": "B", "text": "16"}, {"key": "C", "text": "12"}, {"key": "D", "text": "8"}], "answer": "B", "explain": "考点定位：本题考查联合体（union）的内存布局：所有成员共享同一段存储，联合体的大小等于最大成员的大小（并按最大对齐要求取整）。正确项依据：三个成员的大小分别是 int a[4] = 4×4 = 16 字节（本卷 int 按 4 字节口径）、float b[3] = 3×4 = 12 字节、char c[16] = 16 字节，最大者是 16，所以 sizeof(aa) 为 16，选 B。干扰项分析：A 的 32 是把 16+16 当成“两个成员相加”，这是结构体而不是联合体的算法（即使结构体，本题也不是简单相加）；C 的 12 只取了 float b[3] 的大小，忽略了更大的两个成员；D 的 8 是把 union 当成两个 int 或误以为 union 取“最小公倍数/最大对齐”的错算。易错提醒：union 的所有成员首地址相同，给一个成员赋值会覆盖其他成员的内容（也叫“类型双关”），因此“同一时刻只保存一个成员有效”是使用 union 的前提；sizeof(union) 若最大成员大小为奇数，还要按对齐向上取整（例如 union {char c[5]; int i;} 的大小通常是 8 而不是 5）；另外区分 union 与 struct：struct 各成员依次排布、总大小是各成员加填充，union 各成员重叠、总大小是最大成员。", "imgs": []}, {"id": "choice-347", "kind": "choice", "kind_name": "单选题", "num": 347, "stem": "设 int a;，则语句 for(a=0; a==0; a++); 和语句 for(a=0,a=0; a++); 执行的次数分别是（　）", "options": [{"key": "A", "text": "0,0"}, {"key": "B", "text": "0,1"}, {"key": "C", "text": "1,0"}, {"key": "D", "text": "1,1"}], "answer": "C", "explain": "考点定位：本题考查 for 语句中“条件表达式”的求值时机与逗号表达式、赋值与相等运算的区别。正确项依据：第一条 for(a=0; a==0; a++); 的执行是——初始化 a=0；判断条件 a==0 成立（0==0 为真），执行一次空循环体，再执行 a++ 使 a=1；回到条件 a==0 不再成立，循环结束；共执行循环体 1 次，a 最终为 1。第二条 for(a=0,a=0; a++); ——初始化部分是逗号表达式 a=0,a=0，等价于只有 a=0；条件部分是 a++：先取 a 的当前值 0 作为条件（假），同时 a 自增为 1，因此循环体一次都不执行；两条语句执行的次数分别为 1 和 0，选 C。干扰项分析：A 的 0,0 把第一条也算错了；B 的 0,1 把两条对调；D 的 1,1 忽略了第二条条件用的是后缀自增（先取值再自增，取到的是 0 即假）。易错提醒：本题两个陷阱——条件里写成 a==0（相等判断）而不是 a=0（赋值）；以及 a++ 作为条件时“取值在自增之前”，所以第一次判断拿到的是 0 而不是 1，循环立即结束；如果把后缀改成前缀 ++a，第二条语句的第一次判断就会拿到 1（真）从而变成无限循环。", "imgs": []}, {"id": "choice-348", "kind": "choice", "kind_name": "单选题", "num": 348, "stem": "下面的输出是（　）\n#include<stdio.h>\nint main(void)\n{\n    int a = 10, b = 20, c = 30;\n    printf(\"\\n  %d  %d  %d  \\n\",  a+b+c,  (b  =  b*2),  (c  =  c*2));\n    return  0;\n}", "options": [{"key": "A", "text": "110 40 60"}, {"key": "B", "text": "60 40 110"}, {"key": "C", "text": "60 110 40"}, {"key": "D", "text": "110 60 40"}], "answer": "A", "explain": "考点定位：本题考查函数实参的求值顺序与侧效应（side effect）在同一表达式中的纠缠，属于 C 标准未规定的行为（未定义行为）。正确项依据：printf 的三个实参 a+b+c、(b=b*2)、(c=c*2) 之间存在“修改 b、修改 c、读取 b、读取 c”的冲突，标准（C11 6.5p2）规定：若对一个标量对象的副作用相对同一标量对象的另一副作用或取值是无序的，则行为未定义——因此严格来说本程序的输出不可预测，任何选项都不能称为“标准答案”。按经典教材与考试惯例（x86 上 printf 参数从右向左入栈、且各实参无其它交织副作用），实际计算顺序是：先算 (c=c*2) 把 c 变成 60，再算 (b=b*2) 把 b 变成 40，最后算 a+b+c = 10+40+60 = 110，得到 “110 40 60”，对应选项 A（虽然选项 A 的排列是 A. 110 40 60，而原卷 D 项写作 110 60 40、A 项写作 110 40 60，两者的差别正在于 b、c 的先后）。干扰项分析：B 的 60 40 110 是把 a+b+c 放到最后计算（即认为先算完两个赋值再求和、且求和行为被安排在最后输出）的镜像顺序；C 的 60 110 40 与 D 的 110 60 40 都是把 b、c 的求值次序弄反的产物（先算 b 则为 110、先算 c 则为 110 40 60，二者对应不同实现）。易错提醒：这道题的正解态度是“先说未定义行为，再按惯例给 A”——面试时只答 110 40 60 而不提未定义，容易被追问；要明确写出“实参求值顺序未规定、这段代码严格说有未定义行为，可改成先赋值到临时变量再 printf”才是满分答案；另外注意格式串开头的 \\n 会先输出一个换行，输出第一行是空行。", "imgs": []}, {"id": "choice-349", "kind": "choice", "kind_name": "单选题", "num": 349, "stem": "以下对一维数组 a 的正确说明是（　）", "options": [{"key": "A", "text": "char a (10);"}, {"key": "B", "text": "int a[];"}, {"key": "C", "text": "int k=5, a[k];"}, {"key": "D", "text": "char a[3]={'a','b','c'};"}], "answer": "D", "explain": "考点定位：本题考查数组定义/初始化的语法：方括号、常量长度、以及初始化表与长度的配合。正确项依据：D 用方括号给出长度 3，并用初始化表 {'a','b','c'} 依次填充，三个字符字面量的类型都是 int（字符常量的类型是 int）但会按 char 元素转换后存入，合法且完全指定，选 D。干扰项分析：A 用圆括号写成函数式声明，语法上 char a (10); 是“返回 char 的函数 a 声明（参数 10）”，属于旧式非原型声明，函数定义的形参根本不能写成数值 10，因此不是数组定义（原图此处即写作 char a (10)，是本题最典型的“括号写成圆括号”的错误示例）；B 的 int a[]; 声明了不完整类型且没有初始化表，编译器无法推出元素个数，在文件作用域只是暂定义、在块作用域是错误，不能算“正确说明”；C 的 int k=5, a[k]; 用运行期变量 k 作为数组长度，C89 不允许，C99 起虽支持变长数组（VLA）但要求 k 在此时已有值、函数内为自动存储期且不可初始化，写在同一行的这个位置也无法通过编译，不是通用正确的写法。易错提醒：数组长度必须是“整型常量表达式”，最稳妥的是字面量或宏/枚举常量；若用 char a[3]={'a','b','c'} 这样刚好填满，后面就没有 '\\0'，当成字符串用（如 printf(\"%s\") ）会越界读——要当字符串就写 char a[4]=\"abc\" 或 char a[]=\"abc\"。", "imgs": []}, {"id": "choice-350", "kind": "choice", "kind_name": "单选题", "num": 350, "stem": "已知 int a[10]; 则对 a 数组元素的正确引用是（　）", "options": [{"key": "A", "text": "a[10]"}, {"key": "B", "text": "a[3.5]"}, {"key": "C", "text": "a(5)"}, {"key": "D", "text": "a[0]"}], "answer": "D", "explain": "考点定位：本题考查数组下标运算符的两个要点：下标必须是整型、且取值范围为 0 ~ 长度-1。正确项依据：a[0] 的下标 0 是合法整型下标，落在 [0,10) 内，是 a 的第一个元素（int 左值），选 D。干扰项分析：A 的 a[10] 下标等于数组长度，越界一格（合法最大下标是 9），属于越界访问，不是对数组元素的正确引用；B 的 a[3.5] 下标是浮点数，虽然 C 会先把它转换为 int（截断成 3）后才作下标，但这属于隐式转换的语法隐患（部分编译器会告警），而且严格讲下标运算符要求整型表达式，作为“正确引用”的范例不成立；C 的 a(5) 用了圆括号，是把下标写成了函数调用形式，a 不是函数，编译错误。易错提醒：C 语言不做数组下标越界检查，越界读写可能不报错却悄悄破坏其它变量（典型的缓冲区溢出根源）；要记住“数组名+下标”只是 *(a+i) 的语法糖，而 a+i 的类型是指针，所以 a[i] 与 i[a] 其实等价（不推荐这样写）；另外 a[3.5] 能编译通过不代表写法正确，规范做法是把下标算成整型。", "imgs": []}, {"id": "choice-351", "kind": "choice", "kind_name": "单选题", "num": 351, "stem": "若有说明 int a[][3]={{1,2,3},{4,5},{6,7}}; 则数组 a 的第一维的大小为（　）", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "3"}, {"key": "C", "text": "4"}, {"key": "D", "text": "不确定"}], "answer": "B", "explain": "考点定位：本题考查二维数组定义时“第一维可省略、由初始化表推出”的规则。正确项依据：int a[][3] 只指定了第二维为 3，第一维由初始化表的行数决定；初始化表里有 {{1,2,3},{4,5},{6,7}} 三组花括号，也就是三行，因此第一维是 3，选 B。干扰项分析：A 的 2 可能是只数了“不足 3 个元素的行”（{4,5}、{6,7}），忽略了完整行；C 的 4 是把元素个数算错（3+2+2=7 个元素，7/3 上取整是 3 行而不是 4 行）；D 的“不确定”不成立，因为给出了初始化表，行数在编译期就完全确定。易错提醒：二维数组按行优先存放，第二维不能省略（省略就无法计算行跨度 a+i 的步长）；每一行的元素不足时其余元素自动补 0（所以 a[1][2]=0、a[2][2]=0）；若写成 int a[][3]={{1},{4}}，第一维就是 2；另外 sizeof(a)/sizeof(a[0]) 可以求行数，sizeof(a[0])/sizeof(a[0][0]) 可以求列数，这是面试常用的写法。", "imgs": []}, {"id": "choice-352", "kind": "choice", "kind_name": "单选题", "num": 352, "stem": "字符串“ABCD”在内存占用的字节数是（　）", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "6"}, {"key": "C", "text": "1"}, {"key": "D", "text": "5"}], "answer": "D", "explain": "考点定位：本题考查字符串字面量在内存中的存储形式：C 的字符串以空字符 '\\0' 结尾，并把这个结尾计入占用空间。正确项依据：\"ABCD\" 含 4 个可见字符 A、B、C、D，再加上一个结束标志 '\\0'（值为 0，占 1 字节），共 5 字节，选 D。干扰项分析：A 的 4 只数了可见字符，漏掉 '\\0'，这是最常见的错；B 的 6 多算了一字节（可能误加了两个结束符或把 \\0 当成两个字节）；C 的 1 是单个字符（或结束符本身）的大小，与整串不符。易错提醒：要区分 strlen 与 sizeof——strlen(\"ABCD\") 返回的是 4（只数到 '\\0' 之前，不含 '\\0'），而 sizeof(\"ABCD\") 返回的是 5（含 '\\0'，因为数组长度由字面量决定）；写 char buf[4]=\"ABCD\"; 也是错的（数组放不下 '\\0'，C 允许但不合法，用 %s 打印会越界）；中文/宽字符与普通字符的字节数不同（UTF-8 一个汉字通常 3 字节），这是另一个常考点。", "imgs": []}, {"id": "choice-353", "kind": "choice", "kind_name": "单选题", "num": 353, "stem": "下列命令或语句中，正确的是（　）", "options": [{"key": "A", "text": "#define MYNAME=\"ABC\""}, {"key": "B", "text": "#include stdio.h"}, {"key": "C", "text": "for(i=0;i<10;i++);"}, {"key": "D", "text": "struct int stu{int name};"}], "answer": "C", "explain": "考点定位：本题考查预处理指令的书写形式与 C 语句/声明的合法性判断，属于“在一堆选项里挑出命题人所指的那个正确项”型题目。正确项依据：C 的 for(i=0;i<10;i++); 语法完整——for 头 + 一个分号构成的空语句作为循环体，等价于把空操作执行 10 次循环判断，只要 i 已声明就是完全合法的 C 语句，这正是本题最无争议的正确项，选 C。干扰项分析：B 的 #include stdio.h 缺少头文件名两侧的 < > 或 \" \"，预处理阶段直接报错，明显错误；D 的 struct int stu{int name}; 把类型关键字 int 放到了结构体标签的位置，属非法声明，且成员 int name 后缺分号，明显错误；A 的 #define MYNAME=\"ABC\" 需要辨析——宏体里的引号属于替换文本的一部分，#define MYNAME \"ABC\" 本身是合法的宏定义，写成 MYNAME=\"ABC\" 在常见理解下是想把整个 MYNAME=\"ABC\" 当宏名，故被命题人判为错项，但要注意若按“宏名后跟替换文本”的规则读，这一行其实也能通过预处理（只是此后 MYNAME 展开为 \"ABC\"），因此 A 属于有争议项，本题取最无争议的 C。易错提醒：#define 的完整形式是 #define 名字 替换文本，替换文本必须与宏名之间用空白分隔（宏名不能包含 = 号），所以更规范的写法是 #define MYNAME \"ABC\"；#include 的两种形式 <文件名>（到系统/编译器搜索路径找）与 \"文件名\"（先在当前目录找）都必须带两侧标志符；另外空语句的 for 循环（循环体只有一个分号）是常见的“延时/空转”写法，但要注意优化器可能把它整个删掉。", "imgs": []}, {"id": "choice-354", "kind": "choice", "kind_name": "单选题", "num": 354, "stem": "下述对 C 语言中字符数组的描述错误的是（　）", "options": [{"key": "A", "text": "字符数组可以存放字符串"}, {"key": "B", "text": "字符数组中的字符串可以整体输入和输出"}, {"key": "C", "text": "可在赋值语句中通过赋值运算符\"=\"对字符数组整体赋值"}, {"key": "D", "text": "可在对字符数组定义时通过赋值运算符\"=\"对字符数组整体初始化"}], "answer": "C", "explain": "考点定位：本题考查字符数组与字符串的关系，以及“初始化”与“赋值”在数组上的区别。正确项依据：数组名在表达式中退化为不可修改的地址常量（不是左值），因此不能用 = 对数组整体赋值；要给字符数组赋新串，必须逐字符赋值或调用 strcpy/strncpy/memcpy，所以“可在赋值语句中通过 = 对字符数组整体赋值”是错误的描述，选 C。干扰项分析：A 是正确描述——字符数组的元素类型是 char，当然可以按字符串的格式存放字符序列（含 '\\0'）；B 是正确描述——scanf(\"%s\", a) / printf(\"%s\", a)、gets/fputs 等都能把字符数组当成整体来输入输出（fgets 更安全）；D 是正确描述——定义时用初始化（char a[]=\"abc\"; 或 char a[4]=\"abc\";）是允许的，这与赋值语句中的整体赋值是两件不同的事。易错提醒：本题的题眼就是“初始化可以整体给、赋值不可以整体给”，所以答案不是 D；另外 char a[3]; a=\"ab\"; 是编译错误（数组名不可赋值），而 char *p; p=\"ab\"; 却合法（p 是指针、可改指向），注意区分“字符数组”与“字符指针”；字符数组若不初始化，其内容是未定义的（局部变量），不能指望它是空串。", "imgs": []}, {"id": "choice-355", "kind": "choice", "kind_name": "单选题", "num": 355, "stem": "在 C 语言中，以（　）作为字符串结束标志", "options": [{"key": "A", "text": "'\\n'"}, {"key": "B", "text": "''"}, {"key": "C", "text": "'0'"}, {"key": "D", "text": "'\\0'"}], "answer": "D", "explain": "考点定位：本题考查 C 字符串的结束标志：转义字符 \\0（数值 0 的空字符）。正确项依据：C 的字符串是一段以 '\\0' 结尾的 char 序列，所有字符串库函数（strlen、strcpy、printf 的 %s 等）都靠扫描到 '\\0' 才停止，\\0 的数值是 0，占 1 字节，写作 '\\0' 或 0（整型常量 0 也可用于初始化 char），选 D。干扰项分析：A 的 '\\n' 是换行符（数值 10），它只是普通字符，scanf(\"%s\") 之类还会因为它而结束输入，但它绝不被当作字符串结束标志；B 在原卷里是一对单引号中间空白（空字符常量），C 语言不允许空字符常量（'' 是语法错误），这是原卷印错/污损之处，其本意通常是 \"\\0\" 被漏印了反斜杠，无论哪种解释都不是正确标志；C 的 '0' 是数字字符零（ASCII 48），它与数值 0 不是一回事，写成 char *s=\"123\"; 里出现 '0' 只是普通字符。易错提醒：务必分清数值 0（NUL，写作 '\\0'）与字符 '0'（ASCII 0x30）；也不要把它和 NULL（空指针常量）、EOF（-1）混为一谈；strlen(\"ab\\0cd\") 的结果是 2，因为字符串在第一个 \\0 处就结束了——这个例子常被用来考“字符串里嵌 NULL 会截断”。", "imgs": []}, {"id": "choice-356", "kind": "choice", "kind_name": "单选题", "num": 356, "stem": "若有说明语句 int a[5], *p=a;，则对数组元素的正确引用是（　）", "options": [{"key": "A", "text": "a[p]"}, {"key": "B", "text": "p[a]"}, {"key": "C", "text": "*(p+2)"}, {"key": "D", "text": "p+3"}], "answer": "C", "explain": "考点定位：本题考查指针与数组下标的等价形式 *(p+i) 与 p[i]、以及“取到元素”和“取得地址”的区别。正确项依据：p 指向 a[0]，*(p+2) 等价于 p[2] 即 a[2]，取得的是元素本身（int 左值），下标 2 在 [0,5) 内合法，选 C。干扰项分析：A 的 a[p] 语法上合法但要求下标是整型，而 p 是指针（在真正编译时会告警/报错，且语义上是“用地址当数组下标”，不是对数组元素的常规正确引用）；B 的 p[a] 同理（a 退化成的地址被当成下标），属于形式上等价于 *(p+a) 的怪写法，不是本题期望的答案；D 的 p+3 是地址表达式（类型 int *），指向 a[3]，但“引用元素”要求取值，光有地址不算引用元素。易错提醒：*(p+i)、*(a+i)、p[i]、a[i] 四种写法完全等价（因为 p[i] 定义为 *(p+i)，且加法满足交换律才有 a[i]、p[a] 也等价）；但“等价”不等于“可读/规范”，工程上应优先用 a[i] 或 p[i]；另外 p+3 这类表达式常用于传参（如 scanf 的目标、函数实参），要按上下文判断题目问的是“元素”还是“地址”。", "imgs": []}, {"id": "choice-357", "kind": "choice", "kind_name": "单选题", "num": 357, "stem": "设有如下定义：\nstruct sk {\n    int a;\n    float b;\n}data;\nint *p;\n若要使 p 指向 data 中的 a 域，正确的赋值语句是（　）", "options": [{"key": "A", "text": "p=&a;"}, {"key": "B", "text": "p=data.a;"}, {"key": "C", "text": "p=&data.a;"}, {"key": "D", "text": "*p=data.a;"}], "answer": "C", "explain": "考点定位：本题考查结构体成员的访问语法（成员运算符 . ）与“取值/取地址”的区别，以及指针赋值的类型匹配。正确项依据：data 是结构体变量，data.a 是它的 int 型成员（左值），&data.a 的类型是 int *，与 p 的类型完全一致，所以 p=&data.a; 让 p 指向该成员，选 C。干扰项分析：A 的 p=&a; 中的 a 没有结构体前缀，在本作用域里没有这个名字（成员名不构成独立标识符，必须通过对象访问），编译错误；B 的 p=data.a; 是把 int 值赋给指针，类型不匹配（就算强转也只是把成员的值当地址，语义错误）；D 的 *p=data.a; 是对 p 所指向的未知位置写入成员的值，且 p 未初始化，属越界写，不是“让 p 指向”。易错提醒：结构体成员的访问要用 . （对象）或 ->（指针），成员在结构体之外不能直接用名字；本题原卷第 1 行把 struct 拼成了 struck，属原卷拼写错误，本文件已按 struct 修正并按修正后作答；另外记住 &data.a 得到的地址在结构体内部可能带填充偏移，用 offsetof 宏可以求出成员偏移，这在驱动/协议解析中很常用。", "imgs": []}, {"id": "choice-358", "kind": "choice", "kind_name": "单选题", "num": 358, "stem": "已知（设整型 2 字节，字符型 1 字节，浮点型 4 字节）\nstruct {\n    int i;\n    char c;\n    float a;\n}test;\n则 sizeof(test) 的值是（　）", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "D", "explain": "考点定位：本题考查结构体大小 = 各成员大小之和 +（可能的）对齐填充，以及“按题目给定平台口径计算”的方法。正确项依据：题目明确给定整型 2 字节、字符型 1 字节、浮点型 4 字节；成员依次是 int i（2 字节）、char c（1 字节）、float a（4 字节）。原卷按“不插入填充字节”的口径命制（与同卷“数控公司”部分第 3 题一致，那道题的解析明确写了这一口径），把成员大小直接相加：2+1+4=7，与选项 D 的 7 对应，故选 D。干扰项分析：A 的 4 只等于一个 float 的大小，把 int 和 char 整个漏掉；C 的 6 相当于 2+4（漏掉 char）或 1+1+4 之类的错算；B 的 5 相当于 1+4（漏掉 int）或 2+1+2（把 float 当成 2 字节）。四个选项里没有任何一个等于按真实默认对齐算出的 8，这也从侧面印证本题是按“直接相加”口径出的。易错提醒：这是本卷最容易踩的坑——在真实编译器上按默认对齐规则，char c 之后会插入 1 字节填充使 float a 落在 4 字节边界上（若结构体按 4 字节对齐），sizeof(test) 实际是 8 而不是 7；也就是说“按原卷口径”是 7、“按真实平台”是 8，两者都能自圆其说，正因为选项里没有 8，本题只能取 D。面试作答的正确姿势是：先报出按默认对齐的 8 并说明填充来源（char 后补 1 字节、结构体总大小还要向上取整到最大对齐 4 的倍数），再补一句“若按原卷给定的不填充口径则是 7”，不要只丢一个数字。另需注意：本题原卷第 4 行把 float a; 印成了 float a:（冒号误作分号），本文件已按 float a; 修正。", "imgs": []}, {"id": "choice-359", "kind": "choice", "kind_name": "单选题", "num": 359, "stem": "表达式 strcmp(\"2.56\", \"4.728\") 的值是一个（　）", "options": [{"key": "A", "text": "非零整数"}, {"key": "B", "text": "浮点数"}, {"key": "C", "text": "0"}, {"key": "D", "text": "字符"}], "answer": "A", "explain": "考点定位：本题考查 strcmp 的返回值类型与比较规则。正确项依据：strcmp 的原型是 int strcmp(const char *s1, const char *s2)，它逐字符比较两个字符串的 ASCII 码，返回 int：相等返回 0，s1 大于 s2 返回正整数，s1 小于 s2 返回负整数；两串首字符 '2'(0x32=50) 与 '4'(0x34=52) 已不相等，故返回一个负数，属于非零整数，选 A。干扰项分析：B 错，C 标准库的 strcmp 只返回 int，绝不会返回 float；C 错，0 专指两串完全相等，而两串首字符就不同；D 错，返回值是整数，不是字符。易错提醒：不要用 strcmp 的返回值与 1 或 -1 判等（标准只保证符号，不保证是 ±1 还是两字符之差），判断相等必须写 strcmp(a,b)==0；另外本题不是浮点数比较，\"2.56\" 只是普通字符串，不存在把字符串当数值转换的问题。", "imgs": []}, {"id": "choice-360", "kind": "choice", "kind_name": "单选题", "num": 360, "stem": "设 struct { short a; char b; float c; } st; 则 sizeof(st) 的值是（　）", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "D", "explain": "考点定位：本题考查结构体的成员大小与内存对齐（padding）。正确项依据：本卷按不插入填充字节的计算口径命制，即 2(short)+1(char)+4(float)=7，与选项 D 对应，故选 D。干扰项分析：A 的 4 只相当于一个 float 的大小，漏算了 short 与 char；B 的 5 只累加了 short+char+ 假设 float 占 2 字节；C 的 6 相当于 short+char 再加 3 字节对齐填充（或把 float 当成 3 字节），均是把成员大小数错。易错提醒：这是本题的关键坑——在普通 32 位平台上按默认对齐规则，编译器会在 char b 之后插入 3 字节填充、使 float c 落在 4 字节边界上，因而 sizeof(st) 实际等于 8，而不是选项里的 7；只有当目标机 ABI 要求 4 字节对齐或代码显式写了 #pragma pack(1) 时 7 才成立。答案之所以仍取 D，是因为原卷选项只给了 4~7、没有 8，按命题者「把成员大小直接相加」的口径 7 才落在选项内。遇到这种题务必先确认编译环境；面试作答时应当场说明「默认对齐下是 8 字节，若按不填充口径则是 7 字节」，只答 7 而不加说明容易被追问。", "imgs": []}, {"id": "choice-361", "kind": "choice", "kind_name": "单选题", "num": 361, "stem": "设\n#define N 3\n#define Y(n) ((N+1)*n)\n则表达式 2*(N+Y(5+1)) 的值是（　）", "options": [{"key": "A", "text": "42"}, {"key": "B", "text": "48"}, {"key": "C", "text": "54"}, {"key": "D", "text": "出错"}], "answer": "B", "explain": "考点定位：本题考查带参宏的纯文本替换与运算符优先级。正确项依据：预处理阶段只做文本替换、不做求值，Y(5+1) 被替换为 ((N+1)*5+1)，代入 N=3 得 (3+1)*5+1=4*5+1=21；再算外层 2*(N+Y)=2*(3+21)=2*24=48，故选 B。干扰项分析：A 的 42 来自先算 5+1=6 再乘 (N+1)=4 得 24、再加 N=3 得 27、乘 2 的错法，或把宏体写成 ((N+1)*(n)) 后的 2*(3+24)=54 之类的算错；C 的 54 正是「误以为宏参数被整体加括号」（2*(3+4*6)=54）得到的结果，即把 Y(5+1) 当成 ((N+1)*(5+1))=24 来算；D 错，题目语法完全合法，不会出错。易错提醒：宏参数 n 在宏体里没有加括号，Y(5+1) 展开成 ((N+1)*5+1)，是乘除优先于加减造成的陷阱；规范写法应为 #define Y(n) ((N+1)*(n))，并且宏体整体再加一层括号。注意本题若按不同平台解释 N 与 Y 的先后替换，只要严格按文本替换展开答案恒为 48。", "imgs": []}, {"id": "qa-362", "kind": "qa", "kind_name": "特殊题", "num": 362, "stem": "下列程序段运行后，x 的值是（　）\na=1;b=2;x=0;\nif((--a))x--;\nif(!b)x=7;else ++x;", "options": [{"key": "A", "text": "0"}, {"key": "B", "text": "3"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "存疑（按卷面字面得 x=1，不在选项中；经典原题为 if(!(--a))x--;，答案为 A.0）", "explain": "考点定位：本题考查前置自减、逻辑取反与 if-else 的执行路径；本题为存疑题，原因在题干本身。按卷面字面推演：--a 使 a 从 1 变成 0，if((--a)) 的判断值就是整数 0，0 为假，x-- 不执行，x 仍为 0；再看 if(!b)，b=2 非 0，!b 为 0（假），于是走 else 执行 ++x，x 变成 1。也就是说，严格按卷面这两行代码，结果是 x=1，而选项只有 0/3/6/7，无一项正确——这说明原卷此处漏印了一个逻辑非。对照这道题的经典版本：第一行应写作 if(!(--a))x--;，此时 !0 为 1（真）→ 执行 x-- 得 x=-1，第二条 if(!b) 为假 → 走 else 的 ++x 得 x=0，正好落在选项 A.0 上。选项集合（0/3/6/7）与经典版一致，因此本题的标准答案应为 A.0，但取自卷面字面无法自洽，故按存疑题处理、不参与判分，请对照原卷核实是否漏印了 !。易错提醒：if((--a)) 与 if(!(--a)) 只差一个 !，一个把 0 当假、一个把 0 当真，执行路径完全相反；对照现有题库第 68 题（写作 if(!(--a))x--;）可见差别的来源。另外 a=1;b=2;x=0; 之前没有类型声明，属于原卷省略 int 定义，不影响判定。", "imgs": []}, {"id": "choice-363", "kind": "choice", "kind_name": "单选题", "num": 363, "stem": "void foo(int [][3]);\nmain()\n{\n    int a[3][3]={{1,2,3},{4,5,6},{7,8,9}};\n    foo(a);\n    printf(\"%d\",a[2][1]);\n}\nvoid foo(int b[][3])\n{\n    ++b;\n    b[1][1]=9;\n}\n这段程序的输出是（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "9"}, {"key": "C", "text": "7"}, {"key": "D", "text": "以上均不对"}], "answer": "B", "explain": "考点定位：本题考查二维数组名作参数时的类型退化、指针自增的行偏移以及数组下标映射。正确项依据：形参 b 实际类型是 int (*b)[3]（指向含 3 个 int 的数组的指针），实参数组名 a 退化为 &a[0]，所以调用后 b 指向第 0 行；++b 使 b 前移一行指向 a[1]，此时 b[1] 等价于 *(b+1)，指向 a[2]，b[1][1] 就是 a[2][1]，被赋值为 9；main 里再打印 a[2][1] 即输出 9，故选 B。干扰项分析：A 的 8 是 a[2][1] 的初值，忽略了对该元素的写入；C 的 7 是 a[2][0] 的初值，属于行偏移算错（少加一行）或把 b[1][1] 当成 a[1][1]；D 错，程序可正常编译运行，结果确定。易错提醒：b 是「数组指针」不是「二级指针」，++b 跳过的是整整一行 3 个 int（12 字节），不是 1 个 int；另外 foo 必须先声明再调用、函数体后置定义时形参只能写成 int b[][3]，写成 int 二级指针 b（int 加两个星号）会类型不匹配，这是本题的隐性考点。", "imgs": []}, {"id": "choice-364", "kind": "choice", "kind_name": "单选题", "num": 364, "stem": "假设执行语句 S 的时间为 t，则执行下列程序段的时间为（　）\nfor(i=1;i<=n;i++)\n    for(j=i;j<=n;j++)\n        S;", "options": [{"key": "A", "text": "n*t"}, {"key": "B", "text": "2n*t"}, {"key": "C", "text": "n*i*t"}, {"key": "D", "text": "n(n+1)*t/2"}], "answer": "D", "explain": "考点定位：本题考查由嵌套循环语句频度推导时间复杂度（语句记时法）。正确项依据：外层 i 从 1 到 n，内层 j 从 i 到 n，当 i=1 时 S 执行 n 次、i=2 时执行 n-1 次……i=n 时执行 1 次，总次数为 n+(n-1)+…+1=n(n+1)/2，每次耗时 t，故总时间为 n(n+1)*t/2，选 D；按大 O 记法则为 O(n^2)。干扰项分析：A 的 n*t 只算了外层循环次数，把内层当成与 i 无关的固定一趟；B 的 2n*t 仍与 i 无关，也不是等差数列求和；C 的 n*i*t 里带着循环变量 i，不是与 n 有关的闭式表达式，而且 i 本身随循环变化，无法作为最终答案。易错提醒：内层循环的初值含变量 i，形成的是等差求和而不是 n 乘 n；若内层写成 for(j=1;j<=n;j++) 才是 n(n)*t，若内层写成 for(j=1;j<=i;j++) 同样是 n(n+1)/2 但累加方向相反，两种写法的总次数相同，不要因为端点多算或少算一整行。", "imgs": []}, {"id": "choice-365", "kind": "choice", "kind_name": "单选题", "num": 365, "stem": "在嵌入式存储结构中，存储速度最快的是（　）", "options": [{"key": "A", "text": "内存"}, {"key": "B", "text": "寄存器组"}, {"key": "C", "text": "Flash"}, {"key": "D", "text": "Cache"}], "answer": "B", "explain": "考点定位：本题考查存储器层次结构中各级存储介质的访问速度排序。正确项依据：寄存器组位于 CPU 内核内部，由触发器构成，访问延迟通常只有 1 个时钟周期，是整个层次结构中最快的一级，故选 B。干扰项分析：A 的内存指主存 DRAM，访问需几十个时钟周期，慢于 Cache 和寄存器；C 的 Flash 属于非易失存储，读延迟在几十到上百纳秒量级，写还要先擦除、速度最慢，通常作为程序存储区；D 的 Cache 由 SRAM 构成，位于 CPU 与主存之间，访问约几个时钟周期，速度仅次于寄存器。易错提醒：存储器层次按速度由快到慢大致是 寄存器 → Cache(L1/L2/L3) → 主存 DRAM → Flash/磁盘；容量和速度成反比、价格和速度成正比。注意 STM32 这类 MCU 里常把 Flash 里的代码通过 ART 加速器取指，但那是取指缓存效果，介质本身的访问速度排序不变。", "imgs": []}, {"id": "choice-366", "kind": "choice", "kind_name": "单选题", "num": 366, "stem": "某嵌入式系统存储容量 1Mb，可存储（　）", "options": [{"key": "A", "text": "1000K 个 bit"}, {"key": "B", "text": "1024K 个 bit"}, {"key": "C", "text": "1000K 个 byte"}, {"key": "D", "text": "1024K 个 byte"}], "answer": "B", "explain": "考点定位：本题考查存储容量单位换算，关键在 Mb 中 b 的大小写含义与 2 的幂次换算。正确项依据：1Mb 读作 1 兆比特（megabit），b 代表 bit；1Mb=1024Kb=1024K 个 bit，故选 B。干扰项分析：A 的 1000K 用的是十进制 K（1000）而非二进制 K（1024），嵌入式与半导体容量口径一律按 1024 换算；C 的 1000K 个 byte 同时犯了两处错——既用 1000 又换成 byte；D 的 1024K 个 byte 数值倍数对、单位错，byte 是把 b 误读成 Byte 的结果。易错提醒：本题的唯一坑就是大小写——1Mb=1024K 个 bit，1MB=1024K 个 byte，两者相差 8 倍；同理 1KB=1024 Byte、1Kb=1024 bit。另外要区分口径：内存/Flash 容量、地址空间按 2 的幂（1K=1024）；而通信速率、硬盘厂商标称容量常按 10 的幂（1K=1000），例如 1Mbps=1000000 bit/s。考试若只给一个空，按题目写 Mb（小写 b）就必须落到 bit，不要被 D 的「整数倍」诱惑。", "imgs": []}, {"id": "choice-367", "kind": "choice", "kind_name": "单选题", "num": 367, "stem": "以下宏定义写法不推荐的是（　）", "options": [{"key": "A", "text": "#define ADD(a,b)    a+b"}, {"key": "B", "text": "#define ARR_SIZE(a) (sizeof((a)) / sizeof((a[0])))"}, {"key": "C", "text": "#define UPCASE(c) (((c) >= 'a' && (c) <= 'z') ? ((c) - 0x20) : (c))"}, {"key": "D", "text": "#define DO(a,b) do {a+b; a++; } while(0)"}], "answer": "A", "explain": "考点定位：本题考查带参宏的书写规范——参数与宏体都要加括号，多语句宏要用 do{...}while(0) 包成一条语句。正确项依据：不推荐的是 A。#define ADD(a,b) a+b 的宏体 a+b 整体没加括号、参数 a 与 b 也没加括号，展开后会被周围运算符重新结合：x = ADD(1,2)*3 会展开成 x = 1+2*3 = 7 而不是期望的 9；若参数写成带副作用的表达式（如 ADD(i++, j)）还会因参数在宏体里多次出现而被重复求值。规范写法是 #define ADD(a,b) ((a)+(b))，这正是《C 陷阱与缺陷》里当作反面的经典例子，故选 A。干扰项分析（为什么 B、C、D 相对可接受）：B 用 (sizeof((a)) / sizeof((a[0]))) 求数组元素个数，参数与整体都用括号包住，是社区通行写法（补充：它只能用于真数组，传入指针会退化成指针大小之比而失效）；C 把每个 c 和整个条件表达式都用括号包住，0x20 的位差也写清楚了，是安全的宏；D 采用 do { ... } while(0) 惯用法，能把多条语句包成一条，避免在 if/else 里展开时出现悬空 else 与分号问题，形式本身正是多语句宏的推荐写法（其分号与空格风格略随意、宏体里的 a+b 也没有实际作用，属风格可议，不构成选 D 的理由）。易错提醒：本题考的是「括号缺失导致结合性错误」，四个选项里只有 A 犯了这个错；判定这类题时先看宏体是否整体加括号、再看每个参数是否加括号，最后才看多语句包裹形式，顺序不要颠倒。", "imgs": []}, {"id": "choice-368", "kind": "choice", "kind_name": "单选题", "num": 368, "stem": "在单循环的嵌入式系统中，使用一个全局变量在中断函数和 main 函数之间传递数据，为了避免数据错误，可以采用如下做法（　）", "options": [{"key": "A", "text": "可以用 const 修饰此全局变量"}, {"key": "B", "text": "可以用 static 修饰此全局变量"}, {"key": "C", "text": "可以用 static const 修饰此全局变量"}, {"key": "D", "text": "可以用 volatile 修饰此全局变量"}], "answer": "D", "explain": "考点定位：本题考查 volatile 关键字在「中断与主循环共享变量」场景下的作用。正确项依据：编译器优化时会认为在 main 里没有其他写操作的变量不必重复读取，从而把它缓存在寄存器里，导致中断里改过的值主循环看不到；用 volatile 修饰该全局变量后，编译器保证每次访问都真读真写内存、且不调整访问顺序，从而让中断与主程序看到同一份最新值，故选 D。干扰项分析：A 错，const 表示「只读」，而本变量必须被中断修改，加 const 直接编译报错，且 const 与可见性无关；B 错，static 只改变链接属性与存储期（文件作用域可见、静态存储），全局变量本来就是静态存储期，加 static 既不解决可见性问题，反而把变量限制在本编译单元；C 错，static const 是 B 与 A 的组合，同样只读且同样与可见性无关。易错提醒：volatile 只保证「不优化、真读真写」，它并不保证原子性——若在 main 里对该变量做读改写（如 counter++）而中断也可能改写它，仍可能丢失更新，此时需要关中断/临界区、原子指令或读写各占独立的单字节标志位。这是面试高频追问点：volatile 不等于线程安全，也不用于多核同步。", "imgs": []}, {"id": "multi-369", "kind": "multi", "kind_name": "多选题", "num": 369, "stem": "关于 UART 总线，描述正确的有（　）", "options": [{"key": "A", "text": "UART 可以实现全双工通信"}, {"key": "B", "text": "常见的 UART 通信波特率有 1520 和 9600"}, {"key": "C", "text": "波特率是衡量传送速率的指标"}, {"key": "D", "text": "UART 通信格式包括起始位、数据位、停止位"}], "answer": "ACD", "explain": "考点定位：本题考查 UART 的通信方式、帧格式与波特率概念。逐项判断：A 对，UART 有独立的 TXD 发送线与 RXD 接收线，收发可以同时进行，属于全双工通信；B 错，常见标准波特率为 1200、2400、4800、9600、19200、38400、57600、115200 等，其中并没有 1520 这一档，原卷此处的 1520 应为 1200 的误写（或打字笔误），故 B 不正确；C 对，波特率是单位时间内传输的码元个数，在 UART 中每个码元承载 1 bit，所以用波特率衡量传送速率（bit/s）在此场景下成立；D 对，标准 UART 帧由起始位、若干数据位、可选校验位和停止位组成，一帧以起始位（逻辑 0）下降沿同步、以停止位（逻辑 1）收尾。故正确项为 A、C、D。易错提醒：判断 B 时不要被「9600」带偏——只要选项里出现一个不存在的波特率，整项即为错；另外 UART 是异步串行、无时钟线，收双方必须约定相同波特率，靠起始位重新对齐，若双方波特率偏差过大会出现帧错误。", "imgs": []}];
/* 错误可视化：不遮挡任何操作按钮（顶部横条，可关闭、自动消失） */
function showErrBox(msg, ln){
  try{
    var d=document.getElementById("__errbox");
    if(!d){
      d=document.createElement("div"); d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;font-size:12px;line-height:1.6;padding:8px 34px 8px 10px;z-index:999";
      var x=document.createElement("span");
      x.textContent="✕";
      x.style.cssText="position:absolute;right:6px;top:6px;font-size:14px;cursor:pointer;padding:2px 8px;";
      x.onclick=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
      d.appendChild(x);
      var t=document.createElement("span"); t.id="__errtext";
      d.appendChild(t);
      document.body.appendChild(d);
      setTimeout(function(){ try{ if(d.parentNode)d.parentNode.removeChild(d); }catch(_){} }, 12000);
    }
    var brief=String(msg||"");
    document.getElementById("__errtext").textContent = (brief.indexOf("Script error")>=0)
      ? "ℹ️ 检测到环境脚本提示（浏览器隐藏了详情，一般是微信/QQ 浏览器自身的提示，不影响使用）"
      : ("⚠ 页面提示："+brief+"（行 "+(ln||"?")+"）");
  }catch(e){}
}
window.onerror=function(msg,src,ln){
  try{
    var brief=String(msg||"");
    if(brief.indexOf("Script error")>=0){
      /* 脱敏错误：延迟检查——页面正常加载完成则忽略（环境注入脚本的噪音） */
      setTimeout(function(){ if(!window.__appReady) showErrBox(brief, ln); }, 700);
    }else{
      showErrBox(brief, ln);
    }
  }catch(e){}
};

function migrateProgress(){ let ch=false;

    if(r.in_wrong===undefined){ r.in_wrong=(r.ok===false); r.life=r.in_wrong?1:0; ch=true; }
    if(r.wrong_count===undefined){ r.wrong_count=0; ch=true; }
    if(!r.in_wrong && r.life){ r.life=0; ch=true; }
  }

/* ---------- 错题寿命机制 ----------

function bumpWrong(r){ r.wrong_count=(r.wrong_count||0)+1; const wc=r.wrong_count;

  if(wc===3||wc===5||wc===7||wc===9||wc>10) r.life=(r.life||1)+1; }
function lifeDec(r){ if(!r.in_wrong) return false;

function resumeIndex(){
  let last=-1;
  for(let i=0;i<BANK.length;i++){ if(isDone(BANK[i])) last=i; else break; }
  if(last>=0) return last;
  return Math.min(progress._last||0, Math.max(0,BANK.length-1));   // 尚未连续做题时回到上次浏览处
}

/* ---------- 渲染 ---------- */
function setMode(m){
  if(mode==="考试" && exam && exam.active && !exam.finished){ msg("考试中","考试进行中，不能切换到其他板块！"); return; }
  if(mode==="顺序" && m!=="顺序") seqSavedIdx=idx;    // 离开顺序板块：记住当前位置
  stopExamTimer(); mode=m;
  forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode===m); });
  if(m==="顺序") queue=BANK.slice();
  else if(m==="错题"){ queue=BANK.filter(x=>recGet(x.id).in_wrong); if(!queue.length){ msg("错题本","太棒了，当前没有错题！\n\n（错题需在「错题考试」中答对、寿命归零后才会移除）"); setMode("顺序"); return; } }
  else if(m==="考试"){ renderExamReady(); return; }
  // 顺序板块：首次进入（打开软件）跳到"连续完成题目的最后一题"，之后回到上次浏览位置
  if(m==="顺序"){
    idx = (seqSavedIdx===null) ? resumeIndex() : seqSavedIdx;
    idx = Math.max(0, Math.min(idx, Math.max(0,queue.length-1)));
  }else idx=0;
  renderQ();
}
function renderExamReady(){
  stopExamTimer();
  const cnt=progress._exam_count||0;
  const nc=BANK.filter(x=>x.kind==="choice"||x.kind==="multi").length;
  const nj=BANK.filter(x=>x.kind==="judge").length;
  const rc=Math.max(1,Math.ceil(nc/EXAM_CHOICE_NUM)), rj=Math.max(1,Math.ceil(nj/EXAM_JUDGE_NUM));
  $("#head").textContent=`📝 模拟考试 · 第 ${cnt+1} 次考试`;
  $("#stem").textContent=`考试说明：\n\n· 共 ${EXAM_NUM} 题（选择题 ${EXAM_CHOICE_NUM}（含多选）+ 判断 ${EXAM_JUDGE_NUM}），限时 ${EXAM_MIN} 分钟\n· 每题 ${EXAM_SCORE} 分，满分 ${EXAM_NUM*EXAM_SCORE} 分\n· 当前第 ${cnt+1} 次考试 · 已累计完成 ${cnt} 次\n· 环形抽题：同一场绝不重复；连续 ${rc} 场必覆盖全部选择题、连续 ${rj} 场必覆盖全部判断题\n· 考试中题干上方标注题型：单选题/多选题/判断题\n· 每题只能作答一次，答错自动进入错题库\n· 错题清除规则：只有「错题考试」答对才减少寿命，寿命归零后移除\n· 考试中可暂停/退出，强制关闭自动保存，下次打开继续\n· 考试中不能切换到其他板块，也不能打开笔记\n\n点击下方「开始考试」按钮开始。（错题考试在「错题」板块进入）`;
  $("#opts").innerHTML=""; hideFb();
  $("#qnav").style.display="none"; $("#qnav").innerHTML="";
  footerBtns([["开始考试","#1a5276",startExam]]);
  stat();
}
function pickPlanned(ids,orderKey,curKey,n){
  // 环形连续段算法：洗牌固定序列，每场沿环连续取 n 个。
  // 同一场绝不重复；连续 ceil(len/n)+1 场必覆盖全部题目（176 题每场 20 → 9 场全覆盖）。
  const plan=progress._exam_plan&&typeof progress._exam_plan==="object"?progress._exam_plan:{};
  let order=plan[orderKey];
  if(!Array.isArray(order)||order.length!==ids.length||ids.some(function(id){return order.indexOf(id)<0})){ order=shuffle(ids); plan[curKey]=0; }
  const m=order.length;
  n=Math.min(n,m);
  if(n<=0) return [];
  let cur=plan[curKey];
  if(typeof cur!=="number"||cur<0||cur>=m) cur=0;
  let picked;
  if(n>=m){ picked=order.slice(); cur=0; }
  else{
    const end=cur+n;
    picked=end<=m?order.slice(cur,end):order.slice(cur).concat(order.slice(0,end-m));
    cur=end%m;
  }
  plan[orderKey]=order; plan[curKey]=cur;
  progress._exam_plan=plan;
  return picked;
}
function startExam(kind){
  kind=kind||"normal";
  let qs;
  if(kind==="wrong"){
    const wIds=BANK.filter(x=>recGet(x.id).in_wrong).map(x=>x.id);
    if(!wIds.length){ msg("错题考试","当前没有错题，先去做题吧！"); return; }
    qs=shuffle(wIds).slice(0,Math.min(WEXAM_NUM,wIds.length));
  }else{
    const cIds=BANK.filter(x=>x.kind==="choice"||x.kind==="multi").map(x=>x.id);
    const jIds=BANK.filter(x=>x.kind==="judge").map(x=>x.id);
    qs=shuffle(pickPlanned(cIds,"c","cc",EXAM_CHOICE_NUM)
                     .concat(pickPlanned(jIds,"j","jc",EXAM_JUDGE_NUM)));
  }
  exam={active:true,finished:false,paused:false,kind:kind,ids:qs,idx:0,left:EXAM_MIN*60,answers:{}};
  progress.exam=exam; save();
  queue=qs.map(byId).filter(Boolean); idx=0; examLeft=EXAM_MIN*60;
  // 考试选项随机化：选择/多选题选项顺序打乱，答案 key 跟随内容（按原位置索引映射）
  const opts={};
  queue.filter(x=>x.kind==="choice"||x.kind==="multi").forEach(q=>{
    const src=(q.options||[]).map(function(o){ var c={}; for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) c[k]=o[k]; } return c; });
    const aKeys=String(q.answer||"").toUpperCase().trim();
    const ansIdx=src.map(function(o,i){return aKeys.indexOf(String(o.key||"").toUpperCase())>=0?i:-1}).filter(function(i){return i>=0});
    const sh=shuffle(src.map(function(o,i){return {o:o,i:i}}));
    const newKeys=[];
    sh.forEach(function(x,j){ x.o.key="ABCDE"[j]||"?"; if(ansIdx.indexOf(x.i)>=0) newKeys.push(x.o.key); });
    opts[q.id]={options:sh.map(x=>x.o), answer:newKeys.sort().join("")};
  });
  exam.opts=opts;
  examBarShow(); tick(); renderQ();
}
function examTitle(){ return (exam&&exam.kind==="wrong")?"错题考试":"模拟考试"; }
function startWrongExam(){
  if(mode==="考试"&&exam&&exam.active&&!exam.finished){ msg("考试中","考试进行中，不能开始新的考试！\n请先交卷或退出考试。"); return; }
  const w=BANK.filter(x=>recGet(x.id).in_wrong);
  if(!w.length){ msg("错题考试","当前没有错题，先去做题吧！"); return; }
  setMode("考试");
  startExam("wrong");
}
function tick(){
  if(mode!=="考试"||!exam||!exam.active||exam.finished||exam.paused){ examTimer=null; return; }
  if(examLeft<=0){ finishExam(); return; }
  examLeft--; exam.left=examLeft;
  const mm=pad2(Math.floor(examLeft/60)), ss=pad2(examLeft%60);
  const curQ=queue[idx]||{};
  $("#head").textContent=`⏱ ${examTitle()} · 剩余 ${mm}:${ss} · 第 ${idx+1}/${queue.length} 题${curQ.kind_name?" · "+curQ.kind_name:""}`;
  examTimer=setTimeout(tick,1000);
}
function stopExamTimer(){ if(examTimer){clearTimeout(examTimer);examTimer=null;} }
function examBarShow(){
  const b=$("#examBar"); b.style.display="flex"; b.innerHTML="";
  if(exam.paused){
    b.innerHTML+=`<button style="background:#1a5276" onclick="togglePause()">▶ 继续考试</button>`;
  }else{
    b.innerHTML+=`<button style="background:#b9770e" onclick="togglePause()">⏸ 暂停考试</button>`;
  }
  b.innerHTML+=`<button style="background:#c62828" onclick="quitExam()">🚪 退出考试</button>`;
}
function examBarHide(){ const b=$("#examBar"); b.style.display="none"; b.innerHTML=""; }
function showPaused(){
  examBarShow();
  $("#head").textContent=`⏸ ${examTitle()}已暂停`;
  $("#stem").textContent=`考试已暂停。\n\n剩余时间：${fmt(examLeft)}\n已完成 ${Object.keys(exam.answers).length}/${queue.length} 题\n\n点击顶部「▶ 继续考试」恢复答题。`;
  $("#opts").innerHTML=""; hideFb(); renderQnav();
}
function renderQnav(){
  const nv=$("#qnav"); nv.innerHTML="";
  if(mode!=="考试"||!exam||!exam.active){ nv.style.display="none"; return; }
  nv.style.display="flex";
  queue.forEach((q,i)=>{
    const b=document.createElement("button");
    b.textContent=i+1;
    const a=exam.answers?exam.answers[q.id]:undefined;
    if(a===undefined) b.className="un";
    else if(examIsOk(q,a)) b.className="ok";
    else b.className="no";
    b.onclick=()=>{
      idx=i;
      if(exam.finished){ reviewWrong(q.id); }
      else { exam.idx=i; renderQ(); }
    };
    nv.appendChild(b);
  });
}
function togglePause(){
  if(exam.paused){ exam.paused=false; progress.exam=exam; save(); examBarShow(); tick(); renderQ(); }
  else{ stopExamTimer(); exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); showPaused(); }
}
function quitExam(){
  confirm("退出考试","确定要退出考试吗？本次考试将作废。",()=>{
    stopExamTimer(); delete progress.exam; save(); exam=null; examBarHide(); setMode("顺序");
  });
}
function restartToReady(){
  // 重新考试：先回到待开始页（说明页），点「开始考试」才正式开考
  stopExamTimer(); exam=null;
  delete progress.exam; save(); examBarHide();
  renderExamReady();
}
function renderQ(){
  const it=queue[idx];
  if(!it){ $("#head").textContent="暂无题目"; $("#stem").textContent=""; $("#opts").innerHTML=""; return; }
  if(mode!=="考试"){ $("#head").textContent=`[${it.kind_name} ${it.num}]  ${idx+1}/${queue.length}`; }
  else{
    exam.idx=idx;
    const mm=pad2(Math.floor(examLeft/60)),ss=pad2(examLeft%60);
    $("#head").textContent=`⏱ ${mm}:${ss} · 第 ${idx+1}/${queue.length} 题 · ${it.kind_name||""}`;
  }
  const stemEl=$("#stem"); stemEl.textContent=it.stem||"";
  stemEl.style.animation="none"; void stemEl.offsetWidth; stemEl.style.animation="";
  sel="";
  const examSel=exam?exam.answers[it.id]:undefined;
  renderOpts(it,examSel);
  // 选项逐个进入动画
  forEachNode(document.querySelectorAll("#opts .opt,#opts .judgeBtns"), function(el,i){ el.style.animation="staggerIn .3s ease "+(i*0.06)+"s both"; });
  // 反馈:历史状态
  const r=rec(it.id);
  let txt="";
  if(r.ok===true)txt+="✅ 上次作答：正确\n"; else if(r.ok===false)txt+="❌ 上次作答：错误\n"; else txt+="未作答\n";
  if(r.wrong_count)txt+=`🔁 本题累计错误：${r.wrong_count} 次\n`;
  if(r.in_wrong)txt+=`📕 本题在错题集中：错题寿命 ${r.life}（在「错题考试」中答对 -1，归零后移除）\n`;
  if(mode==="错题"){
    const wn=BANK.filter(x=>recGet(x.id).in_wrong).length;
    txt+=`\n📚 错题共 ${wn} 道。点下方「📝 错题考试」随机抽题练习；答对减寿命，归零后移除。`;
  }
  showFb(txt);
  // 笔记弹窗跟随当前题（若打开）
  if(noteOpen){ noteQid=it.id; $("#nnote").value=rec(it.id).notes||""; }
  // 底部按钮
  if(mode==="考试"&&exam&&exam.active&&!exam.finished){
    footerBtns([["◀ 上一题","#1a5276",()=>nav(-1)],["确认答案","#27ae60",()=>checkAnswer()],["下一题 ▶","#1a5276",()=>nav(1)]]);
  }else{
    const fbtns=[["◀ 上一题","#1a5276",()=>nav(-1)],["确认答案","#27ae60",()=>checkAnswer()],["下一题 ▶","#1a5276",()=>nav(1)]];
    if(mode==="错题") fbtns.push(["📝 错题考试","#d35400",startWrongExam]);
    fbtns.push(["📝 笔记","#8e44ad",openNote],["重置","#c62828",()=>resetProgress()]);
    footerBtns(fbtns);
  }
  renderQnav();
  stat();
  if(mode==="顺序"){ progress._last=idx; save(); }      // 记忆最近浏览位置（备用回退）
}
function renderOpts(it,examSel){
  const o=$("#opts"); o.innerHTML="";
  (it.imgs||[]).forEach(function(src){
    const im=document.createElement("img"); im.className="qimg"; im.src=src;
    im.onclick=function(){ openImgView(src); };
    o.appendChild(im);
    const tip=document.createElement("div"); tip.className="qimg-tip";
    tip.textContent="🔍 看不清？点图片放大查看";
    o.appendChild(tip);
  });
  if(it.kind==="choice"||it.kind==="multi"){
    const oinfo=(mode==="考试"&&exam&&exam.opts)?exam.opts[it.id]:undefined;
    const ans=String((oinfo?oinfo.answer:it.answer)||"").toUpperCase().trim();
    const opts=(oinfo?oinfo.options:it.options)||[];
    if(examSel!==undefined){
      const ansSet=ans.split(""), selSet=String(examSel||"").split("");
      opts.forEach(op=>{
        const d=document.createElement("div");
        d.className="opt";
        d.textContent=op.key+". "+op.text;
        if(ansSet.indexOf(op.key)>=0)d.classList.add("right");
        else if(selSet.indexOf(op.key)>=0)d.classList.add("wrong");
        o.appendChild(d);
      });
      return;
    }
    if(it.kind==="multi"){
      const t=document.createElement("div");
      t.style.cssText="font-size:12px;color:#1a5276;font-weight:bold";
      t.textContent="本题为多选题（点击可多选、再点取消）";
      o.appendChild(t);
    }
    opts.forEach(op=>{
      const d=document.createElement("div");
      d.className="opt"; d.textContent=op.key+". "+op.text; d.dataset.k=op.key;
      d.onclick=()=>{
        if(it.kind==="multi"){
          d.classList.toggle("selected");
          d.style.animation="";
          sel=Array.prototype.map.call(document.querySelectorAll("#opts .opt.selected"), function(x){return x.dataset.k||"";}).sort().join("");
        }else{
          forEachNode(document.querySelectorAll("#opts .opt"), function(x){ x.classList.remove("selected"); });
          d.classList.add("selected"); d.style.animation=""; sel=op.key;
        }
      };
      o.appendChild(d);
    });
  }else if(it.kind==="judge"){
    if(examSel!==undefined){
      const ans=(it.answer||"").toUpperCase().trim();
      const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
      const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${examSel}`; d2.classList.add(examSel===ans?"right":"wrong"); o.appendChild(d2);
      return;
    }
    // 判断题：先点选（高亮），再点「确认答案」才判分
    const w=document.createElement("div"); w.className="judgeBtns";
    const mk=function(k,txt,cls){
      const b=document.createElement("button"); b.className=cls; b.textContent=txt;
      b.onclick=function(){
        forEachNode(document.querySelectorAll("#opts .judgeBtns button"), function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); b.style.animation=""; sel=k;
      };
      return b;
    };
    w.appendChild(mk("√","✔ 正确","t"));
    w.appendChild(mk("×","✘ 错误","f"));
    o.appendChild(w);
  }else{
    // qa 特殊题（存疑/写结果类）：展示原卷选项 + 查看答案与解析，可标记掌握程度
    (it.options||[]).forEach(op=>{
      const d=document.createElement("div"); d.className="opt";
      d.textContent=op.key+". "+op.text; o.appendChild(d);
    });
    const tip=document.createElement("div");
    tip.style.cssText="font-size:12px;color:#8e44ad;font-weight:bold";
    tip.textContent="本题无固定选项答案（存疑/写结果类），点下方按钮对照说明";
    o.appendChild(tip);
    const b=document.createElement("button"); b.className="chip";
    b.textContent="👀 查看答案与解析";
    b.onclick=()=>showFb(`<b>答案：</b>\n${it.answer||"（无）"}\n\n<b>解析：</b>\n${it.explain||"（无）"}`);
    o.appendChild(b);
    const b2=document.createElement("button"); b2.className="chip";
    b2.style.background="linear-gradient(135deg,#1a7f37,#27ae60)";
    b2.textContent="已掌握 ✔";
    b2.onclick=()=>{ rec(it.id).ok=true; save(); stat(); showFb("✅ 已标记为掌握"); };
    o.appendChild(b2);
    const b3=document.createElement("button"); b3.className="chip";
    b3.textContent="还需复习 ✘";
    b3.onclick=()=>{ const r=rec(it.id); r.ok=false; bumpWrong(r); save(); stat();
      showFb("📖 已标记为需复习\n📕 本题在错题集中：错题寿命 "+r.life+"（在「错题考试」中答对 -1）"); };
    o.appendChild(b3);
  }
}
function checkAnswer(){
  const it=queue[idx];
  if(!it)return;
  if(mode==="考试"){
    if(exam&&exam.active&&!exam.finished){
      if(!sel){ msg("提示","请先选择答案，再点确认"); return; }
      examAnswer(it,sel);
    }
    return;
  }
  if(it.kind==="qa"){ msg("提示","本题无固定选项答案，请点选项区按钮对照说明。"); return; }
  if(!sel){ msg("提示", it.kind==="choice"?"请先选择一个答案":(it.kind==="multi"?"请先选择答案（可多选）":"请先选择答案（正确/错误）")); return; }
  const ok=isOk(it,sel);
  record(it,sel,ok, mode==="错题"?"wrong":"seq"); showResult(it,sel,ok);
  if(noteOpen){ noteQid=it.id; $("#nnote").value=rec(it.id).notes||""; }
  stat();
}
function answerJudge(key){
  // 判断题选择：只高亮不判分，点「确认答案」后才生效
  var btns=document.querySelectorAll("#opts .judgeBtns button");
  forEachNode(btns, function(x){ x.classList.remove("sel"); });
  var target=Array.prototype.filter.call(btns, function(b){return b.dataset.k===key;})[0];
  if(target)target.classList.add("sel");
  sel=key;
}
function examAnswer(it,k){
  if(exam.answers[it.id]){ msg("提示","本题已作答，不能更改"); return; }
  const ok=examIsOk(it,k); exam.answers[it.id]=k; exam.left=examLeft; save();
  const ctx=(exam.kind==="wrong")?"wexam":"exam";
  const cleared=record(it,k,ok,ctx); renderQ();
  if(exam.kind==="wrong"){
    const fb=$("#fb");
    if(fb) fb.innerHTML+=(cleared?"\n🎉 错题寿命归零，已从错题集移除！"
                                :("\n📕 当前错题寿命："+(recGet(it.id).life||0)+"（答错时累计错误达 3/5/7/9/>10 会 +1）"));
  }
}
function record(it,ans,ok,ctx){
  const r=rec(it.id); r.ok=ok; let cleared=false;
  if(!ok) bumpWrong(r); else if(ctx==="wexam") cleared=lifeDec(r);
  save(); return cleared;
}
function showResult(it,ans,ok){
  const r=rec(it.id); let txt="";
  txt+= ok?`<span class="tag-ok">✅ 回答正确！</span>`:`<span class="tag-no">❌ 回答错误。正确答案：${it.answer}</span>`;
  if(r.wrong_count)txt+=`\n🔁 本题累计错误：${r.wrong_count} 次`;
  if(r.in_wrong)txt+=`\n📕 本题在错题集中：错题寿命 ${r.life}（在「错题考试」中答对 -1）`;
  if(it.explain)txt+="\n\n解析：\n"+it.explain;
  showFb(txt);
}
function nav(d){
  const ni=idx+d;
  if(ni<0){ msg("提示","已经是第一题"); return; }
  if(ni>=queue.length){
    if(mode==="考试"){ confirm("交卷","已到最后一题，确定交卷吗？",finishExam); }
    else msg("提示","已经是最后一题");
    return;
  }
  idx=ni; renderQ();
}
function finishExam(){
  stopExamTimer();
  if(!exam||!exam.active||exam.finished)return;
  exam.finished=true; exam.paused=false; exam.left=examLeft;
  if(exam.kind==="wrong") progress._wexam_count=(progress._wexam_count||0)+1;
  else progress._exam_count=(progress._exam_count||0)+1;   // 完成交卷才计入考试次数
  progress.exam=exam; save(); examBarHide();
  renderResult();
}
function renderResult(){
  if(!exam)return;
  const qs=queue, ans=exam.answers;
  let correct=0, wrong=[], un=0;
  qs.forEach(x=>{ if(ans[x.id]===undefined)un++; else if(examIsOk(x,ans[x.id]))correct++; else wrong.push(x); });
  const score=correct*EXAM_SCORE;
  const wrongKind=(exam.kind==="wrong");
  $("#head").textContent=`🏁 ${examTitle()}结束`;
  $("#stem").textContent=`🏆 ${examTitle()}成绩：${score} 分 / 满分 ${qs.length*EXAM_SCORE} 分\n\n✅ 答对 ${correct} 题 · ❌ 答错 ${wrong.length} 题 · ⭕ 未答 ${un} 题`;
  let fbTxt;
  if(wrongKind){
    const clearedN=qs.filter(x=>ans[x.id]!==undefined && examIsOk(x,ans[x.id]) && !recGet(x.id).in_wrong).length;
    const leftN=BANK.filter(x=>recGet(x.id).in_wrong).length;
    fbTxt=`得分：${score} 分（每题 ${EXAM_SCORE} 分）　答题进度：${Object.keys(ans).length}/${qs.length}\n\n🎉 本次清除 ${clearedN} 道错题（寿命归零）；答对寿命 -1，答错寿命不变。\n📕 剩余错题：${leftN} 道`;
  }else{
    fbTxt=`得分：${score} 分（每题 ${EXAM_SCORE} 分）　答题进度：${Object.keys(ans).length}/${qs.length}\n\n错题已自动进入「错题」板块；错题需在「错题考试」中答对、寿命归零才会移除。`;
  }
  showFb(fbTxt);
  const o=$("#opts"); o.innerHTML="";
  const scoreDiv=document.createElement("div");
  scoreDiv.className="opt"; scoreDiv.textContent=`🏆 成绩：${score} 分（答对 ${correct}/${qs.length}）`;
  scoreDiv.classList.add(score>=qs.length*EXAM_SCORE*0.6?"right":"wrong"); o.appendChild(scoreDiv);
  if(wrong.length){
    const t=document.createElement("div"); t.style.cssText="font-size:13px;color:#c62828;font-weight:bold;margin-top:6px";
    t.textContent="📌 点击错题号回顾："; o.appendChild(t);
    wrong.forEach(x=>{ const c=document.createElement("button"); c.className="chip";
      const ci=qs.indexOf(x)+1; c.textContent=`错题${x.num}#${ci}`;
      c.onclick=()=>reviewWrong(x.id); o.appendChild(c); });
  }else{
    const t=document.createElement("div"); t.className="opt"; t.textContent="🎉 全部答对，太棒了！"; t.classList.add("right"); o.appendChild(t);
  }
  footerBtns(wrongKind
    ? [["🔄 再考一次错题","#b9770e",()=>startExam("wrong")],["返回错题列表","#1a5276",()=>setMode("错题")],["返回顺序","#7f8c8d",()=>setMode("顺序")]]
    : [["🔄 重新考试","#b9770e",restartToReady],["返回顺序","#1a5276",()=>setMode("顺序")]]);
  renderQnav();
  stat();
}
function reviewWrong(qid){
  const it=byId(qid); if(!it)return;
  $("#head").textContent=`📖 错题回顾 · 第 ${it.num} 题`;
  $("#stem").textContent=it.stem||"";
  const o=$("#opts"); o.innerHTML="";
  (it.imgs||[]).forEach(function(src){
    const im=document.createElement("img"); im.className="qimg"; im.src=src;
    im.onclick=function(){ openImgView(src); };
    o.appendChild(im);
    const tip=document.createElement("div"); tip.className="qimg-tip";
    tip.textContent="🔍 看不清？点图片放大查看";
    o.appendChild(tip);
  });
  const oinfo=exam&&exam.opts?exam.opts[qid]:undefined;
  const ans=((oinfo?oinfo.answer:it.answer)||"").toUpperCase().trim(), your=exam.answers[qid];
  if(it.kind==="choice"||it.kind==="multi"){
    const ansSet=ans.split(""), yourSet=String(your||"").split("");
    ((oinfo?oinfo.options:it.options)||[]).forEach(op=>{ const d=document.createElement("div"); d.className="opt"; d.textContent=op.key+". "+op.text;
      if(ansSet.indexOf(op.key)>=0)d.classList.add("right"); else if(yourSet.indexOf(op.key)>=0)d.classList.add("wrong"); o.appendChild(d); });
  }else{
    const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
    const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${your}`; d2.classList.add(your===ans?"right":"wrong"); o.appendChild(d2);
  }
  if(it.explain){ const e=document.createElement("div"); e.style.cssText="font-size:13px;color:#555;margin-top:8px"; e.textContent="解析："+it.explain; o.appendChild(e); }
  showFb(`你的答案：${your||"未作答"}　正确答案：${it.answer}`);
  footerBtns([["⬅ 返回成绩","#1a5276",renderResult]]);
}

/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s)}
function forEachNode(nodes, fn){ for(var i=0;i<nodes.length;i++) fn(nodes[i], i); }
function toggleCls(el, cls, force){ if(force) el.classList.add(cls); else el.classList.remove(cls); }
function fmt(sec){ return pad2(Math.floor(sec/60))+":"+pad2(sec%60); }
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function showFb(html){ const f=$("#fb"); f.style.display="block"; f.innerHTML=html; }
function hideFb(){ $("#fb").style.display="none"; }
function footerBtns(btns){
  const f=$("#footer"); f.innerHTML="";
  btns.forEach(([t,c,fn])=>{ const b=document.createElement("button"); b.textContent=t; b.style.background=c; b.onclick=fn; f.appendChild(b); });
}
function stat(){
  const done=BANK.filter(x=>rec(x.id).ok!==null), okN=done.filter(x=>rec(x.id).ok===true).length;
  const rate=done.length?Math.round(okN/done.length*100):0;
  const wrong=BANK.filter(x=>recGet(x.id).in_wrong).length;
  $("#stat").textContent=`已做 ${done.length}/${BANK.length} · 正确率 ${rate}% · 错题 ${wrong}`;
}
/* ---------- 弹窗 ---------- */
let modalCb=null;
function msg(t,p){ $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#1a5276" onclick="closeModal()">确定</button></div>`; $("#modal").classList.add("show"); }
function confirm(t,p,cb){ modalCb=cb; $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#c62828" onclick="closeModal()">取消</button><button style="background:#1a5276" onclick="doConfirm()">确定</button></div>`; $("#modal").classList.add("show"); }
function doConfirm(){ closeModal(); if(modalCb)modalCb(); }
function closeModal(){ $("#modal").classList.remove("show"); }
/* ---------- 重置(3次确认) ---------- */
function resetProgress(){ resetStep(1); }function resetStep(n){
  if(n===1) confirm("重置进度（1/3）","确定要清除全部做题记录吗？\n此操作不可恢复！",()=>resetStep(2));
  else if(n===2) confirm("重置进度（2/3）","再次确认：将清空做题记录、错题次数、笔记和考试记录！",()=>resetStep(3));
  else if(n===3) confirm("重置进度（3/3）","最后一次确认：立即清空全部数据并重新开始！",()=>{ progress={}; save(); stopExamTimer(); exam=null; examBarHide(); seqSavedIdx=null; setMode("顺序"); msg("完成","🗑 已清除全部做题记录，重新开始！"); });
}
/* 考试中关页面自动保存 */
window.addEventListener("beforeunload",()=>{ if(mode==="考试"&&exam&&exam.active&&!exam.finished){ exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); } });
/* ---------- 配图全屏查看：可拖动 / 双指缩放 / 双击放大 ---------- */
var IV={s:1,x:0,y:0,natW:0,natH:0,minS:0.15,maxS:10,pointers:0,lastX:0,lastY:0,pinchDist:0,lastTap:0,dragging:false,manual:false};
function ivEl(){ return $("#imgView"); }
function ivImg(){ return $("#imgViewImg"); }
function ivView(){ var v=ivEl(); return {w:v.clientWidth||window.innerWidth, h:v.clientHeight||(window.innerHeight-58)}; }
function openImgView(src){
  IV.s=1; IV.x=0; IV.y=0; IV.pointers=0; IV.pinchDist=0; IV.manual=false;
  var im=ivImg();
  im.onload=function(){
    IV.natW=im.naturalWidth||im.width; IV.natH=im.naturalHeight||im.height;
    imgFit();
  };
  im.src=src;
  if(im.complete && im.naturalWidth){ IV.natW=im.naturalWidth; IV.natH=im.naturalHeight; imgFit(); }
  ivEl().classList.add("show");
  $("#imgBar").style.display="flex";
  $("#imgHint").style.display="block";
  /* 不修改 viewport meta：避免移动端重新布局，缩放完全由本查看器接管
     （遮罩已设 touch-action:none，会阻止浏览器自带手势） */
}
function ivDraw(){
  if(!IV.natW) return;
  var im=ivImg();
  im.style.width=IV.natW+"px"; im.style.height=IV.natH+"px";
  im.style.transform="translate("+IV.x+"px,"+IV.y+"px) scale("+IV.s+")";
}
function ivClamp(){
  var r=ivView(), w=IV.natW*IV.s, h=IV.natH*IV.s;
  IV.x = (w<=r.w) ? Math.round((r.w-w)/2) : Math.min(0, Math.max(r.w-w, IV.x));
  IV.y = (h<=r.h) ? Math.round((r.h-h)/2) : Math.min(0, Math.max(r.h-h, IV.y));
}
function ivZoomAt(f, cx, cy){
  var ns=Math.max(IV.minS, Math.min(IV.maxS, IV.s*f));
  var k=ns/IV.s;
  IV.x = cx - (cx - IV.x)*k;
  IV.y = cy - (cy - IV.y)*k;
  IV.s = ns;
  IV.manual = true;          /* 用户已手动缩放：窗口变化时不再自动适应 */
  ivClamp(); ivDraw();
}
function imgZoom(f){ var r=ivView(); ivZoomAt(f, r.w/2, r.h/2); }
function imgFit(){
  if(!IV.natW) return;
  var r=ivView();
  IV.s=Math.min(1, r.w/IV.natW, r.h/IV.natH);
  IV.manual=false;
  ivClamp(); ivDraw();
}
function imgOneToOne(){ var r=ivView(); ivZoomAt(1/IV.s, r.w/2, r.h/2); }
function closeImgView(){
  ivEl().classList.remove("show");
  $("#imgBar").style.display="none";
  $("#imgHint").style.display="none";
  ivImg().src="";
  IV.manual=false;
}
function ivLocalPos(clientX, clientY){
  var r=ivEl().getBoundingClientRect();
  return {x:clientX-r.left, y:clientY-r.top};
}
function ivDist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
function ivMid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }
(function ivBind(){
  var v=ivEl(); if(!v) return;
  v.addEventListener("touchstart", function(e){
    if(e.touches.length===1){
      IV.pointers=1; IV.lastX=e.touches[0].clientX; IV.lastY=e.touches[0].clientY;
    }else if(e.touches.length>=2){
      IV.pointers=2; IV.pinchDist=ivDist(e.touches);
    }
    e.preventDefault();
  }, {passive:false});
  v.addEventListener("touchmove", function(e){
    if(e.touches.length===1 && IV.pointers===1){
      var t=e.touches[0];
      IV.x += t.clientX-IV.lastX; IV.y += t.clientY-IV.lastY;
      IV.lastX=t.clientX; IV.lastY=t.clientY;
      ivClamp(); ivDraw();
    }else if(e.touches.length>=2){
      var d=ivDist(e.touches), m=ivMid(e.touches);
      if(IV.pinchDist>0){
        var p=ivLocalPos(m.x, m.y);
        ivZoomAt(d/IV.pinchDist, p.x, p.y);
      }
      IV.pinchDist=d;
    }
    e.preventDefault();
  }, {passive:false});
  v.addEventListener("touchend", function(e){
    if(e.touches.length===0){
      IV.pointers=0; IV.pinchDist=0;
      var now=Date.now();
      if(now-IV.lastTap<300 && e.changedTouches && e.changedTouches.length){
        var p=ivLocalPos(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        if(IV.s<1.6) ivZoomAt(2.2/IV.s, p.x, p.y); else imgFit();
      }
      IV.lastTap=now;
    }
  }, {passive:false});
  v.addEventListener("mousedown", function(e){ IV.dragging=true; IV.lastX=e.clientX; IV.lastY=e.clientY; e.preventDefault(); });
  v.addEventListener("mousemove", function(e){ if(!IV.dragging) return; IV.x+=e.clientX-IV.lastX; IV.y+=e.clientY-IV.lastY; IV.lastX=e.clientX; IV.lastY=e.clientY; ivClamp(); ivDraw(); });
  v.addEventListener("mouseup", function(){ IV.dragging=false; });
  v.addEventListener("mouseleave", function(){ IV.dragging=false; });
  v.addEventListener("wheel", function(e){ var p=ivLocalPos(e.clientX, e.clientY); ivZoomAt(e.deltaY<0?1.12:1/1.12, p.x, p.y); e.preventDefault(); }, {passive:false});
  v.addEventListener("click", function(e){ if(e.target===v && IV.s<=1.02) closeImgView(); });
  window.addEventListener("resize", function(){ if(ivEl().classList.contains("show")){ if(IV.manual){ ivClamp(); ivDraw(); } else { imgFit(); } } });
})();

/* 启动:恢复考试 */
forEachNode(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click",function(){ setMode(b.dataset.mode); });
});
function showInitError(e){
  window.__appReady = true;   /* 已自愈回顺序模式，避免环境噪音再报 */
  showErrBox("初始化失败（已自动清除本地旧数据，请刷新页面重试）："+((e&&e.message)?e.message:e), "");
}
(function init(){
  try{
    exam = progress.exam && typeof progress.exam==="object" ? progress.exam : null;
    if(exam&&exam.active){
      // 直接进入考试板块恢复（不走 renderExamReady，避免闪待开始页）
      mode="考试";
      forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode==="考试"); });
      queue=(exam.ids||[]).map(byId).filter(Boolean);
      if(!queue.length){ exam=null; delete progress.exam; throw new Error("考试会话数据异常"); }
      idx=Math.min(exam.idx||0, Math.max(0,queue.length-1));
      examLeft=exam.left;
      if(exam.finished){ renderResult(); }
      else if(exam.paused){ showPaused(); }        // 暂停态：停留，用户手动继续
      else { examBarShow(); tick(); renderQ(); }   // 运行中：恢复倒计时
    } else setMode("顺序");
    window.__appReady = true;
  }catch(e){
    // 初始化失败（多见于旧数据/浏览器兼容问题）：清除本地旧数据并回顺序模式，显示原因
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    progress={}; exam=null; mode="顺序"; idx=0;
    try{
      forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode==="顺序"); });
      examBarHide(); setMode("顺序");
    }catch(_){}
    showInitError(e);
  }
})();
