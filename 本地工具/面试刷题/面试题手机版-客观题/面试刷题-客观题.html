key": "B", "text": "评估工作量与依赖，同步负责人确认顺序"}, {"key": "C", "text": "全部并行推进"}, {"key": "D", "text": "只做最简单的任务"}], "answer": "B", "explain": "本题考查任务管理素养。多任务优先级相近时：先评估工作量与依赖关系，再与负责人同步确认优先级（B）；随机开始、全部并行、只做简单任务都不是专业做法。", "imgs": []}, {"id": "choice-180", "kind": "choice", "kind_name": "单选题", "num": 180, "stem": "若有说明：`int a=2，*p=&a，*q=p;`，则以下非法的赋值语句是（　）", "options": [{"key": "A", "text": "`p=q;`"}, {"key": "B", "text": "`*p=*q;`"}, {"key": "C", "text": "`a=*q;`"}, {"key": "D", "text": "`q=a;`"}], "answer": "D", "explain": "本题考查指针与整型的类型匹配。int a=2, *p=&a, *q=p：A：p=q（指针赋值）合法；B：*p=*q（值赋值）合法；C：a=*q（取值赋给 a）合法；D：q=a 把整型赋给指针，类型不匹配、非法。故选 D。", "imgs": []}, {"id": "choice-181", "kind": "choice", "kind_name": "单选题", "num": 181, "stem": "已有定义 `int a=2，*p1=&a，*p2=&a;` 下面不能正确执行的赋值语句是（　）", "options": [{"key": "A", "text": "`a=*p1+*p2;`"}, {"key": "B", "text": "`p1=a;`"}, {"key": "C", "text": "`p1=p2;`"}, {"key": "D", "text": "`a=*p1*(*p2);`"}], "answer": "B", "explain": "本题考查指针赋值规则。p1、p2 均指向 a：A：a=*p1+*p2 = 4 合法；B：p1=a 把整数 2 赋给指针 → 类型错误，不能正确执行；C：p1=p2（同类指针互赋）合法；D：a=*p1*(*p2) = 4 合法。故选 B。", "imgs": []}, {"id": "choice-182", "kind": "choice", "kind_name": "单选题", "num": 182, "stem": "Declare a pointer to the text string \"Hello\" called message.", "options": [{"key": "A", "text": "`char message = \"Hello\";`"}, {"key": "B", "text": "`*message = \"Hello\";`"}, {"key": "C", "text": "`char *message = \"Hello\";`"}, {"key": "D", "text": "`char message = 'Hello';`"}], "answer": "C", "explain": "本题考查字符串指针声明。指向字符串常量的指针：`char *message = \"Hello\";`（c）；a 是单字符赋值（类型错误）；b 缺类型且解引用未初始化指针；d 用单引号包多字符（非法）。", "imgs": []}, {"id": "choice-183", "kind": "choice", "kind_name": "单选题", "num": 183, "stem": "What is the output of the following program segment?\nint count = 10, *temp, sum = 0;\ntemp = &count;\n*temp = 20;\ntemp = &sum;\n*temp = count;\nprintf(\"count = %d, *temp = %d, sum = %d\\n\", count, *temp, sum );", "options": [{"key": "A", "text": "count = 2, *temp = 10, sum = 10"}, {"key": "B", "text": "count = 20, *temp = 20, sum = 20"}, {"key": "C", "text": "count = 10, *temp = 2, sum = 10"}, {"key": "D", "text": "count = 200, *temp = 0.2, sum = 1"}], "answer": "B", "explain": "本题考查指针间接赋值。temp=&count 后 *temp=20 → count=20；temp=&sum 后 *temp=count → sum=20；printf 时 temp 指向 sum。输出 count=20, *temp=20, sum=20（b）。", "imgs": []}, {"id": "choice-184", "kind": "choice", "kind_name": "单选题", "num": 184, "stem": "If data is defined as an array of int, which has 10 items: `int data[10];`. Which one CANNOT give the address of data[1]?", "options": [{"key": "A", "text": "`&data[0]+1`"}, {"key": "B", "text": "`&data[1]`"}, {"key": "C", "text": "`&data[0]++`"}, {"key": "D", "text": "`data+1`"}, {"key": "E", "text": "none of above"}], "answer": "C", "explain": "本题考查地址运算。a、b、d：&data[0]+1 与 data+1 都等于 &data[1]（指针算术按元素步长）；c 的 &data[0]++ 试图自增“取地址表达式”——它是常量表达式，不能自增，语法错误。故选 c。", "imgs": []}, {"id": "choice-185", "kind": "choice", "kind_name": "单选题", "num": 185, "stem": "A structure called record which holds an integer called loop, a character array of 5 elements called word, and a float called sum, looks like", "options": [{"key": "A", "text": "`struct record { int loop; char word[5]; float sum; };`"}, {"key": "B", "text": "`type structure record { loop : integer; word : array[0..4] of char; sum : real; };`"}, {"key": "C", "text": "`type record { integer loop; char word[4]; float sum; }`"}], "answer": "A", "explain": "本题考查 C 结构体定义语法。正确形式：`struct record { int loop; char word[5]; float sum; };`（a）；b 是 Pascal 风格、c 是伪代码风格，均非 C 语法。", "imgs": []}, {"id": "choice-186", "kind": "choice", "kind_name": "单选题", "num": 186, "stem": "What is the output of the following program segment?\nunsigned char v1, v2, v3, v4;\nv1 = 0x3;\nv2 = v1 ^ 0x76;\nv3 = ~0xa | (v2 << 2);\nv4 = v1 & (v3 >> 6);\nprintf(\"v1 = %d, v2 = %x, v3 = %d, v4 = %x\", v1, v2, v3, v4);", "options": [{"key": "A", "text": "v1 = 3, v2 = 117, v3 = 21, v4 = 0"}, {"key": "B", "text": "v1 = 3, v2 = 75, v3 = 33, v4 = 0"}, {"key": "C", "text": "v1 = 3, v2 = 75, v3 = 245, v4 = 3"}, {"key": "D", "text": "v1 = 3, v2 = 117, v3 = f5, v4 = 3"}], "answer": "C", "explain": "本题考查位运算顺序与截断。v2 = 3^0x76 = 0x75；v3 = (~0xA | (0x75<<2)) 截断 8 位：0x75<<2 低 8 位 = 0xD4，~0xA 截断 = 0xF5，0xF5|0xD4 = 0xF5 = 245；v4 = 3 & (0xF5>>6 = 3) = 3。结果 v1=3, v2=75, v3=245, v4=3（c）。注意 %x 下 v2 显示 75（十六进制）。", "imgs": []}, {"id": "choice-187", "kind": "choice", "kind_name": "单选题", "num": 187, "stem": "A structure of type machine contains two fields, an integer called name, and a char pointer called memory. Show what the definition of the structure looks like.", "options": [{"key": "A", "text": "`struct machine { int name; char memory; }`"}, {"key": "B", "text": "`machine { name : integer; memory : char *; };`"}, {"key": "C", "text": "`struct machine { int name; char *memory; };`"}], "answer": "C", "explain": "本题考查含指针成员的结构体定义。char 指针成员写作 `char *memory;`：`struct machine { int name; char *memory; };`（c）；a 的 memory 是 char 值（非指针）；b 是伪代码风格。", "imgs": []}, {"id": "choice-188", "kind": "choice", "kind_name": "单选题", "num": 188, "stem": "嵌入式开发中，用于硬件调试的典型工具是（　）。", "options": [{"key": "A", "text": "J-Link"}, {"key": "B", "text": "VSCode"}, {"key": "C", "text": "Excel"}, {"key": "D", "text": "Word"}], "answer": "A", "explain": "本题考查嵌入式调试工具。J-Link 是 SEGGER 的常用 JTAG/SWD 调试下载器，配合 Keil/IAR 等可给 STM32 等 MCU 下载与在线调试（A）；VSCode 是编辑器，Excel/Word 是办公软件。", "imgs": []}, {"id": "choice-189", "kind": "choice", "kind_name": "单选题", "num": 189, "stem": "在 Git 中，查看提交历史的命令是（　）。", "options": [{"key": "A", "text": "`git status`"}, {"key": "B", "text": "`git log`"}, {"key": "C", "text": "`git diff`"}, {"key": "D", "text": "`git branch`"}], "answer": "B", "explain": "本题考查 Git 常用命令。git log 查看提交历史（作者、时间、提交信息）（B）；git status 看工作区状态、git diff 看差异、git branch 管理分支。", "imgs": []}, {"id": "choice-190", "kind": "choice", "kind_name": "单选题", "num": 190, "stem": "USB HID 协议中，报告描述符（Report Descriptor）的作用是（　）。", "options": [{"key": "A", "text": "定义设备厂商 ID"}, {"key": "B", "text": "定义数据传输格式与用途"}, {"key": "C", "text": "定义电源管理策略"}, {"key": "D", "text": "定义物理连接端口"}], "answer": "B", "explain": "本题考查 USB HID 协议。报告描述符（Report Descriptor）用 HID 描述符语言定义设备上报/接收数据的格式与用途（按键、坐标、LED 等），主机据此解析报告（B）；厂商 ID 在设备描述符中，电源策略由配置描述符负责。", "imgs": []}, {"id": "choice-191", "kind": "choice", "kind_name": "单选题", "num": 191, "stem": "蓝牙协议栈中，负责设备配对与绑定的层是（　）。", "options": [{"key": "A", "text": "物理层"}, {"key": "B", "text": "链路层"}, {"key": "C", "text": "安全管理层"}, {"key": "D", "text": "应用层"}], "answer": "C", "explain": "本题考查 BLE 协议栈层次。配对（Pairing）与绑定（Bonding，保存密钥供下次免配对）由安全管理层（SM）实现（C）；物理层负责射频收发，链路层负责链路调度，应用层是用户业务。", "imgs": []}, {"id": "multi-192", "kind": "multi", "kind_name": "多选题", "num": 192, "stem": "以下哪种情况会导致触摸误触？（　）", "options": [{"key": "A", "text": "采样频率过高"}, {"key": "B", "text": "信号滤波不足"}, {"key": "C", "text": "使用高阻抗材料"}, {"key": "D", "text": "电源电压稳定"}], "answer": "BC", "explain": "本题考查触摸检测的干扰因素（多选）。B：信号滤波不足 → 噪声被误判为触摸；C：高阻抗材料 → 充放电时间变长、抗扰度差，易误触；合理的采样频率（A）与稳定电源（D）不是误触根因。故选 B、C。", "imgs": []}, {"id": "choice-193", "kind": "choice", "kind_name": "单选题", "num": 193, "stem": "C 语言中，防止变量被编译器优化的关键字是（　）。", "options": [{"key": "A", "text": "Volatile"}, {"key": "B", "text": "static"}, {"key": "C", "text": "const"}, {"key": "D", "text": "register"}], "answer": "A", "explain": "本题考查关键字作用。volatile 阻止编译器对该变量的访问做优化（不缓存、不删除、不重排）（A）；static 控制存储期/链接性、const 表示只读、register 只是寄存器建议。", "imgs": []}, {"id": "choice-194", "kind": "choice", "kind_name": "单选题", "num": 194, "stem": "嵌入式系统中，RTOS（实时操作系统）的核心作用是（　）。", "options": [{"key": "A", "text": "提供图形界面"}, {"key": "B", "text": "管理任务调度与资源分配"}, {"key": "C", "text": "替代 MCU 硬件"}, {"key": "D", "text": "优化电源功耗"}], "answer": "B", "explain": "本题考查 RTOS 的定位。RTOS 核心职责是任务调度与资源管理（任务、消息队列、信号量、时间管理），保证高优先级任务及时响应（B）；图形界面、电源优化是可选组件/上层功能，RTOS 更不替代硬件。", "imgs": []}, {"id": "choice-195", "kind": "choice", "kind_name": "单选题", "num": 195, "stem": "以下哪项不属于嵌入式开发基础环境？（　）", "options": [{"key": "A", "text": "MCU（如 STM32）"}, {"key": "B", "text": "RTOS（如 FreeRTOS）"}, {"key": "C", "text": "USB HID 协议栈"}, {"key": "D", "text": "Git 版本控制"}], "answer": "C", "explain": "本题考查嵌入式开发环境构成（选不属于项）。MCU（硬件平台）、RTOS（软件平台）、Git（版本管理）属通用基础环境；USB HID 协议栈是面向 USB 人机设备的专用组件，不属于“基础环境”。故选 C。", "imgs": []}, {"id": "choice-196", "kind": "choice", "kind_name": "单选题", "num": 196, "stem": "在 C 语言中，用于动态内存分配的函数是（　）。", "options": [{"key": "A", "text": "`malloc( )`"}, {"key": "B", "text": "`printf( )`"}, {"key": "C", "text": "`scanf( )`"}, {"key": "D", "text": "`memcpy( )`"}], "answer": "A", "explain": "本题考查常用库函数用途。malloc 动态分配堆内存（A）；printf/scanf 是输入输出、memcpy 是内存拷具，均不分配内存。", "imgs": []}, {"id": "choice-197", "kind": "choice", "kind_name": "单选题", "num": 197, "stem": "软件版本控制中，\"分支（Branch）\"的主要用途是（　）。", "options": [{"key": "A", "text": "备份代码"}, {"key": "B", "text": "并行开发不同功能"}, {"key": "C", "text": "压缩代码体积"}, {"key": "D", "text": "加密代码"}], "answer": "B", "explain": "本题考查版本控制概念。分支用于并行开发不同功能/修复，隔离变更、互不影响，完成后合并（B）；备份靠远程仓库/标签，压缩、加密不是分支的功能。", "imgs": []}, {"id": "choice-198", "kind": "choice", "kind_name": "单选题", "num": 198, "stem": "下面代码输出什么？（　）\nint a = 5;\nprintf(\"%d\", ++a);", "options": [{"key": "A", "text": "5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "7"}, {"key": "D", "text": "编译错误"}], "answer": "B", "explain": "本题考查前置自增。++a 先自增再取值：a 变为 6，printf 输出 6（B）。与后置 a++（输出 5）区分。", "imgs": []}, {"id": "choice-199", "kind": "choice", "kind_name": "单选题", "num": 199, "stem": "sizeof(char) 的值通常是？（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "4"}, {"key": "C", "text": "1"}, {"key": "D", "text": "与平台有关"}], "answer": "C", "explain": "本题考查 sizeof 的定义。C 标准明确规定 sizeof(char) ≡ 1（字节即 char 的宽度，其它类型以它为单位），与平台无关。故选 C。", "imgs": []}, {"id": "choice-200", "kind": "choice", "kind_name": "单选题", "num": 200, "stem": "`memset(buf, 0, sizeof(buf));` 的作用是？（　）", "options": [{"key": "A", "text": "分配内存"}, {"key": "B", "text": "清零缓冲区"}, {"key": "C", "text": "释放内存"}, {"key": "D", "text": "拷贝字符串"}], "answer": "B", "explain": "本题考查 memset 的用途。memset(buf, 0, sizeof(buf)) 把 buf 起 sizeof(buf) 字节全部写 0（清零）（B），常用于初始化缓冲区/结构体。注意它按字节操作：置 0 才安全，若置非 0 值（如 memset(a,1,…)）会得到 0x01010101 而非 1。", "imgs": []}, {"id": "choice-201", "kind": "choice", "kind_name": "单选题", "num": 201, "stem": "以下哪个是\"后进先出\"结构？（　）", "options": [{"key": "A", "text": "Queue"}, {"key": "B", "text": "Stack"}, {"key": "C", "text": "Array"}, {"key": "D", "text": "Tree"}], "answer": "B", "explain": "本题考查数据结构的进出顺序。栈（Stack）后进先出 LIFO（B）；队列 Queue 先进先出 FIFO；数组与树不定义 LIFO 语义。", "imgs": []}, {"id": "choice-202", "kind": "choice", "kind_name": "单选题", "num": 202, "stem": "malloc() 分配的内存位于？（　）", "options": [{"key": "A", "text": "栈"}, {"key": "B", "text": "堆"}, {"key": "C", "text": "寄存器"}, {"key": "D", "text": "Flash"}], "answer": "B", "explain": "本题考查内存分区。malloc/new 从堆区分配（B）；栈是函数局部变量自动区域，寄存器不存放被分配对象，Flash 只存放代码/常量。", "imgs": []}, {"id": "choice-203", "kind": "choice", "kind_name": "单选题", "num": 203, "stem": "const 的作用是什么？（　）", "options": [{"key": "A", "text": "变量可修改"}, {"key": "B", "text": "定义只读变量"}, {"key": "C", "text": "定义全局变量"}, {"key": "D", "text": "防止优化"}], "answer": "B", "explain": "本题考查 const 语义。const 定义只读变量（不可修改；编译器可据此优化并放入只读段）（B）；A 说反，C 是普通全局定义，D 是 volatile 的作用。", "imgs": []}, {"id": "choice-204", "kind": "choice", "kind_name": "单选题", "num": 204, "stem": "extern 的作用是什么？（　）", "options": [{"key": "A", "text": "定义静态变量"}, {"key": "B", "text": "声明外部变量"}, {"key": "C", "text": "防止优化"}, {"key": "D", "text": "定义局部变量"}], "answer": "B", "explain": "本题考查 extern 语义。extern 声明“变量/函数定义在其它编译单元”，链接时解析引用（B）；它不分配存储、不改作用域、不影响优化。", "imgs": []}, {"id": "choice-205", "kind": "choice", "kind_name": "单选题", "num": 205, "stem": "以下哪个函数通常不能在中断里长时间执行？（　）", "options": [{"key": "A", "text": "GPIO 翻转"}, {"key": "B", "text": "printf"}, {"key": "C", "text": "清中断标志"}, {"key": "D", "text": "读取寄存器"}], "answer": "B", "explain": "本题考查中断中应避免的操作。printf 内部可能阻塞（等待发送）、使用锁与缓冲、耗时长且不可重入，中断中禁用（B）；GPIO 翻转、清中断标志、读寄存器都是快速操作，适合中断内执行。", "imgs": []}, {"id": "choice-206", "kind": "choice", "kind_name": "单选题", "num": 206, "stem": "MCU 的 Flash 通常用于存放？（　）", "options": [{"key": "A", "text": "运行时栈"}, {"key": "B", "text": "程序代码"}, {"key": "C", "text": "DMA 缓存"}, {"key": "D", "text": "网络数据"}], "answer": "B", "explain": "本题考查 MCU 存储布局。Flash 存放程序代码与常量数据（掉电不丢）（B）；栈/堆在 SRAM；DMA 缓冲与网络数据也是运行期在 SRAM 中的数据。", "imgs": []}, {"id": "choice-207", "kind": "choice", "kind_name": "单选题", "num": 207, "stem": "UART 通信至少需要哪两根线？（　）", "options": [{"key": "A", "text": "TX、RX"}, {"key": "B", "text": "SCL、SDA"}, {"key": "C", "text": "MOSI、MISO"}, {"key": "D", "text": "VCC、GND"}], "answer": "A", "explain": "本题考查 UART 接线。UART 全双工最少需 TX（发送）、RX（接收）两根信号线（另需共地 GND）（A）；SCL/SDA 是 I2C、MOSI/MISO 是 SPI、VCC/GND 是电源线，不能通信。", "imgs": []}, {"id": "choice-208", "kind": "choice", "kind_name": "单选题", "num": 208, "stem": "static 局部变量的特点是？（　）", "options": [{"key": "A", "text": "每次重新创建"}, {"key": "B", "text": "生命周期贯穿程序运行期"}, {"key": "C", "text": "存放在栈"}, {"key": "D", "text": "只能在 main 使用"}], "answer": "B", "explain": "本题考查 static 局部变量。只初始化一次、生命周期贯穿程序（B），存于静态区而非栈（C 错）；不是每次重建（A 错）；与是否在 main 使用无关（D 错）。", "imgs": []}, {"id": "choice-209", "kind": "choice", "kind_name": "单选题", "num": 209, "stem": "下面代码输出什么？（　）\nchar str[] = \"abc\";\nprintf(\"%lu\", sizeof(str));", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": "B", "explain": "本题考查字符串数组大小。char str[]=\"abc\" 数组大小含结尾 '\\0'：3+1 = 4 字节（B）。sizeof 得数组长度 4；strlen(str) 才是 3（不含 '\\0'）。", "imgs": []}, {"id": "choice-210", "kind": "choice", "kind_name": "单选题", "num": 210, "stem": "判断字符类型变量 c 是否为大写字母的正确表达式是（　）", "options": [{"key": "A", "text": "`'A'<=c<='Z'`"}, {"key": "B", "text": "`(c>='A') & (c<='Z')`"}, {"key": "C", "text": "`(c>='A') && (c<='Z')`"}, {"key": "D", "text": "`('A'<=c) AND ('Z'>=c)`"}], "answer": "C", "explain": "本题考查布尔表达式写法。必须用逻辑与 &&：`(c>='A') && (c<='Z')`（C）；A 是数学连写，在 C 中语义为 (('A'<=c)<='Z')（比较结果为 0/1 再与 'Z' 比较）恒为真，错误；B 用了位与 &（数值运算，语义不对）；D 的 AND 不是 C 运算符。", "imgs": []}, {"id": "choice-211", "kind": "choice", "kind_name": "单选题", "num": 211, "stem": "malloc 返回值类型是？（　）", "options": [{"key": "A", "text": "void"}, {"key": "B", "text": "void*"}, {"key": "C", "text": "int*"}, {"key": "D", "text": "char*"}], "answer": "B", "explain": "本题考查 malloc 原型。`void *malloc(size_t size);` 返回 void*（B），需转换为目标指针类型使用；分配失败返回 NULL，使用前应判空、使用后配对 free。", "imgs": []}, {"id": "choice-212", "kind": "choice", "kind_name": "单选题", "num": 212, "stem": "以下代码输出？（　）\nchar *p = \"hello\";\nprintf(\"%c\", *p + 1);", "options": [{"key": "A", "text": "h"}, {"key": "B", "text": "i"}, {"key": "C", "text": "e"}, {"key": "D", "text": "o"}], "answer": "B", "explain": "本题考查字符指针取值与整型提升。char *p=\"hello\"：*p 取 'h'（104），+1 得 105，%c 输出 'i'（B）。注意 *p+1 是字符码值加 1，非指针移动（*(p+1) 才是 'e'）。", "imgs": []}, {"id": "choice-213", "kind": "choice", "kind_name": "单选题", "num": 213, "stem": "问：fp 可以怎么调用 add？（　）\nint add(int a, int b) {\n    return a + b;\n}\nint (*fp)(int, int);\nfp = add;", "options": [{"key": "A", "text": "`fp(1,2)`"}, {"key": "B", "text": "`*fp(1,2)`"}, {"key": "C", "text": "两者都可以"}, {"key": "D", "text": "不能调用"}], "answer": "C", "explain": "本题考查函数指针调用语法（存疑题）。C 标准规定 `fp(1,2)` 与先解引用再调用 `(*fp)(1,2)` 完全等价（C）。注意选项 B 若原卷为不带括号的 `*fp(1,2)`：因函数调用优先级高于解引用，会解析为 `*(fp(1,2))`（对 int 解引用）非法，此时只有 A 成立——请对照原卷确认 B 是否带括号。", "imgs": []}, {"id": "choice-214", "kind": "choice", "kind_name": "单选题", "num": 214, "stem": "下面关于关键字的描述及使用中，错误的是（　）", "options": [{"key": "A", "text": "volatile 可用于定义多线程应用中的共享变量"}, {"key": "B", "text": "const 可用于定义全局变量"}, {"key": "C", "text": "一个变量既可以是 const，同时也是 volatile"}, {"key": "D", "text": "register static int i = 0;"}], "answer": "D", "explain": "本题考查存储类说明符的互斥关系。C 语言规定一个声明中最多只能有一个存储类说明符，且 `register` 与 `static` 属于同类，二者不能同时出现，因此 `register static int i` 是语法错误（D 为错误描述，选 D）。A 正确：volatile 告知编译器每次从内存取值，多线程共享变量必须加它；B 正确：const 修饰全局变量表示只读，可放只读段；C 正确：只读状态寄存器就是典型——volatile 因为硬件可能改，const 因为程序不该改，两者并不冲突。易错点：把 register 当成\"存储位置\"而与 static 混用，register 只是建议放寄存器，不是另一维度的属性。", "imgs": []}, {"id": "choice-215", "kind": "choice", "kind_name": "单选题", "num": 215, "stem": "中断响应时间是指（　）", "options": [{"key": "A", "text": "从中断处理开始到中断处理结束"}, {"key": "B", "text": "从发出中断请求到中断处理结束"}, {"key": "C", "text": "从发出中断请求到进入中断处理"}, {"key": "D", "text": "从进入中断处理到中断处理结束"}], "answer": "C", "explain": "本题考查中断时序术语。中断响应时间＝从外部（或内部）发出中断请求，到 CPU 完成现场保护、跳入中断服务程序第一条指令所经历的时间，即\"请求→进入处理\"（C）。A、D 描述的是中断服务程序的执行时间（中断处理时间）；B 把响应时间与处理时间合并，成了\"请求到处理结束\"的全程时间。易错点：不要与\"中断延迟\"混淆——引入优先级更高中断或关中断时长的等待都算在响应时间内，但\"处理耗时\"不属于响应时间。", "imgs": []}, {"id": "choice-216", "kind": "choice", "kind_name": "单选题", "num": 216, "stem": "若 P、V 操作的信号量 S 初值为 1，当前值为 -2，则表示有（　）个等待此信号量的线程", "options": [{"key": "A", "text": "0 个"}, {"key": "B", "text": "1 个"}, {"key": "C", "text": "2 个"}, {"key": "D", "text": "3 个"}], "answer": "C", "explain": "本题考查信号量绝对值的语义。信号量 S 初值 1（表示有 1 个资源），当前 S=-2 表示资源已被占用且多出 2 个申请者，其绝对值就是阻塞在该信号量等待队列上的线程数 → 2 个（C）。规律：S>0 时其值＝可用资源数；S=0 表示无资源且无等待；S<0 时 |S|＝等待进程数。易错点：不要把初值 1 与当前值相加理解为\"1+2=3\"。", "imgs": []}, {"id": "choice-217", "kind": "choice", "kind_name": "单选题", "num": 217, "stem": "存储 16×16 点阵的一个汉字信息，需要的字节数为（　）", "options": [{"key": "A", "text": "32"}, {"key": "B", "text": "64"}, {"key": "C", "text": "128"}, {"key": "D", "text": "256"}], "answer": "A", "explain": "本题考查点阵字模容量计算。16×16 点阵共 256 个点，每点用 1 bit 表示（1 为黑、0 为白），合计 256 bit ÷ 8 = 32 Byte（A）。口诀：字节数＝水平点数×垂直点数÷8＝宽×高/8。易错点：把 256 个\"点\"当成 256 字节（选 D）；若字模带偏移、每行再补对齐，则可能略大，但标准 HZK16 字库就是 32 字节/字。", "imgs": []}, {"id": "choice-219", "kind": "choice", "kind_name": "单选题", "num": 219, "stem": "UCOSIII 操作系统不属于（　）", "options": [{"key": "A", "text": "RTOS"}, {"key": "B", "text": "抢占式实时操作系统"}, {"key": "C", "text": "非抢占式实时操作系统"}, {"key": "D", "text": "嵌入式实时操作系统"}], "answer": "C", "explain": "本题考查 µC/OS-III 的系统属性。µC/OS-III 是典型的嵌入式实时操作系统（D），采用基于优先级抢占式调度，支持同优先级时间片轮转，属于 RTOS（A、B）——因此\"非抢占式实时操作系统\"（C）不是它的属性，选 C。易错点：\"抢占式\"指高优先级任务就绪可立即剥夺当前任务；µC/OS-III 还可配置为不允许抢占（Round-Robin 或 OSTaskCreate 时指定），但默认与主流用法是抢占式。", "imgs": []}, {"id": "choice-220", "kind": "choice", "kind_name": "单选题", "num": 220, "stem": "在嵌入式芯片接口中，以下 ______ 是音频接口。", "options": [{"key": "A", "text": "IIC"}, {"key": "B", "text": "IIS"}, {"key": "C", "text": "PWM"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查常见外设接口用途。IIS/I2S（Inter-IC Sound）是专为数字音频设计的串行总线，由 BCK（位时钟）、WS（声道选择/帧同步）、SD（数据）组成，用于连接 Codec/DAC（B）。IIC 是两线低速控制总线（如配置 Codec 寄存器），PWM 可粗略驱动蜂鸣器但不是音频接口标准，故 A、C、D 错。易错点：I2S 与 I2C 名字相近、引脚都有 SCK/SCL，注意区分数据线数量与用途。", "imgs": []}, {"id": "choice-221", "kind": "choice", "kind_name": "单选题", "num": 221, "stem": "在启动代码中，在关键的初始化代码中，可以使用 ______ 语言。", "options": [{"key": "A", "text": "汇编"}, {"key": "B", "text": "C 语言"}, {"key": "C", "text": "汇编 + C 语言"}, {"key": "D", "text": "以上都不是"}], "answer": "A", "explain": "本题考查启动流程的语言选择。复位后立即执行的关键初始化代码（设置栈指针 SP、初始化时钟/PLL、配置中断向量表、跳转到 C 入口前）必须用汇编实现：此时 C 运行环境（栈、.bss/.data 段、堆）尚未建立，C 代码无法安全运行（A）。堆栈与 C 环境就绪后，才用 C 完成 SystemInit、外设初始化等主体工作。易错点：选 C 看似\"两者都用\"，但题眼是\"关键初始化代码\"这一阶段只能靠汇编。", "imgs": []}, {"id": "choice-222", "kind": "choice", "kind_name": "单选题", "num": 222, "stem": "在启动代码中，STM32 复位处理放在 ______。", "options": [{"key": "A", "text": "0x00000000"}, {"key": "B", "text": "0x00000004"}, {"key": "C", "text": "0x00000010"}, {"key": "D", "text": "0x00000014"}], "answer": "B", "explain": "本题考查 Cortex-M 异常向量表布局。复位后 CPU 从地址 0 处取初始 MSP（0x00000000），从 0x00000004 取复位向量（Reset_Handler 地址）并跳转执行（B）。0x00000008 为 NMI、0x0000000C 为 HardFault；0x00000010/0x14 是 MemManage/BusFault。易错点：向量表首字不是代码而是栈顶地址，真正的代码入口在第二个字；STM32 可通过 BOOT 引脚把 0x00000000 重映射到 Flash/系统存储器/SRAM。", "imgs": []}, {"id": "choice-224", "kind": "choice", "kind_name": "单选题", "num": 224, "stem": "Cortex-M4 提供的流水线是（　）", "options": [{"key": "A", "text": "2 级"}, {"key": "B", "text": "3 级"}, {"key": "C", "text": "5 级"}, {"key": "D", "text": "8 级"}], "answer": "B", "explain": "本题考查 Cortex-M 内核流水线级数。Cortex-M3/M4 采用经典三级流水线：取指（Fetch）→ 译码（Decode）→ 执行（Execute），故为 3 级（B）。对比：Cortex-M7 为六级（双发射）、ARM7 三级、ARM9 五级。易错点：三级流水线使分支跳转带来约 3 个周期的流水线填充，这也是\"跳转指令耗时略长\"\"需要预取指令\"的由来。", "imgs": []}, {"id": "choice-225", "kind": "choice", "kind_name": "单选题", "num": 225, "stem": "Cortex-M4 使用的存储器格式是（　）", "options": [{"key": "A", "text": "小端格式"}, {"key": "B", "text": "大端格式"}, {"key": "C", "text": "小端或大端格式"}, {"key": "D", "text": "没有正确答案"}], "answer": "A", "explain": "本题考查端序（Endianness）结论。Cortex-M4 的存储器取指与数据访问固定为小端（Little-endian）：低地址存放低字节（A）。虽然 ARMv7-M 的定义允许大端，但 Cortex-M 系列实现仅支持小端。易错点：0x12345678 存于 0x4000 时，小端布局依次为 78 56 34 12，大端为 12 34 56 78；网络字节序（大端）与 CPU 字节序不一致时需 __REV/htons 转换。", "imgs": []}, {"id": "choice-226", "kind": "choice", "kind_name": "单选题", "num": 226, "stem": "所有的 GPIO 引脚为（　）模式", "options": [{"key": "A", "text": "输入"}, {"key": "B", "text": "输出"}, {"key": "C", "text": "模拟"}, {"key": "D", "text": "以上都对"}], "answer": "D", "explain": "本题考查 GPIO 工作模式。STM32 每个 GPIO 均可通过 MODER/CRL/CRH 配置为输入（浮空/上拉/下拉）、输出（推挽/开漏）、复用功能或模拟模式，复位后默认为输入浮空（D）。易错点：ADC 采集引脚必须配置成模拟模式，否则数字输入缓冲器会引入额外功耗与误差；同一引脚不能既作 ADC 又作普通数字 IO。", "imgs": []}, {"id": "choice-227", "kind": "choice", "kind_name": "单选题", "num": 227, "stem": "每个 I/O 端口位可以自由的编程，尽管 I/O 端口寄存器必须以（　）的方式访问。", "options": [{"key": "A", "text": "16 位字"}, {"key": "B", "text": "16 位字节"}, {"key": "C", "text": "32 位字节"}, {"key": "D", "text": "32 位字"}], "answer": "D", "explain": "本题考查 GPIO 寄存器访问宽度。STM32 的 GPIO 属于 APB2 外设，其寄存器（MODER、OTYPER、BSRR 等）为 32 位，必须按 32 位字（word）访问（D）；官方固件库直接对其写 u32，才有\"原子置位/清零\"的 BSRR 用法。\"16 位字节\"\"32 位字节\"本身不是有效的存储器传输术语。易错点：按字节/半字访问外设寄存器可能触发总线错误或读到无效数据。", "imgs": []}, {"id": "choice-228", "kind": "choice", "kind_name": "单选题", "num": 228, "stem": "固件库中的功能状态（FunctionalState）类型被赋予以下两个值（　）", "options": [{"key": "A", "text": "ENABLE 或者 DISABLE"}, {"key": "B", "text": "SET 或者 RESET"}, {"key": "C", "text": "YES 或者 NO"}, {"key": "D", "text": "SUCCESS 或者 ERROR"}], "answer": "A", "explain": "本题考查固件库枚举类型。标准外设库中 `FunctionalState` 用于表示\"使能/失能\"配置意图，取值为 `ENABLE`/`DISABLE`（A）；`FlagStatus`（标志状态）与 `ITStatus` 才是 `SET`/`RESET`；`SUCCESS`/`ERROR` 用于函数返回值 `ErrorStatus`。易错点：`xxxCmd(ENABLE/DISABLE)` 与 `xxx_GetFlagStatus()==SET` 是两个不同枚举，别混用。", "imgs": []}, {"id": "choice-229", "kind": "choice", "kind_name": "单选题", "num": 229, "stem": "固件库中的标志状态（FlagStatus）类型被赋予以下两个值（　）", "options": [{"key": "A", "text": "ENABLE 或者 DISABLE"}, {"key": "B", "text": "SUCCESS 或者 ERROR"}, {"key": "C", "text": "SET 或者 RESET"}, {"key": "D", "text": "YES 或者 NO"}], "answer": "C", "explain": "本题考查固件库枚举类型。`FlagStatus`（读某个状态位/标志的结果）取值为 `SET`（置位/事件已发生）/`RESET`（未发生），故 C。`ENABLE/DISABLE` 属 `FunctionalState`（写入配置）；`SUCCESS/ERROR` 属 `ErrorStatus`（返回值）。易错点：`USART_GetFlagStatus(USART1, USART_FLAG_TC)==SET` 中的 SET 不能写成 ENABLE。", "imgs": []}, {"id": "choice-230", "kind": "choice", "kind_name": "单选题", "num": 230, "stem": "STM32F407 有（　）可屏蔽中断通道", "options": [{"key": "A", "text": "43"}, {"key": "B", "text": "51"}, {"key": "C", "text": "74"}, {"key": "D", "text": "82"}], "answer": "D", "explain": "本题考查 STM32F407 中断资源。STM32F407 共有 82 个可屏蔽中断（IRQ）通道（D），另有 10 个系统异常（NMI、HardFault、SysTick 等）。对比：F103 是 60 个，F405/407 由于外设更多达到 82。易错点：常把\"EXTI 16 条线\"\"NVIC 240 个 IRQ（内核上限）\"与本芯片实际通道数混淆。", "imgs": []}, {"id": "choice-231", "kind": "choice", "kind_name": "单选题", "num": 231, "stem": "STM32F407 采用（　）位来编辑中断的优先级", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "8"}, {"key": "C", "text": "16"}, {"key": "D", "text": "32"}], "answer": "A", "explain": "本题考查 NVIC 优先级位宽。Cortex-M4 的优先级寄存器为 8 位，但 ST 在 STM32F4 上只实现了高 4 位（低 4 位读回 0），因此实际可编程优先级为 16 级（A）。同理 F1 系列也是 4 位。易错点：把内核手册的 8 位当成实现值；也正因只有 4 位，`NVIC_PriorityGroupConfig` 才把 4 位拆成\"抢占:响应\"两段。", "imgs": []}, {"id": "choice-232", "kind": "choice", "kind_name": "单选题", "num": 232, "stem": "向量中断控制器最多可支持（　）个 IRQ 中断", "options": [{"key": "A", "text": "127"}, {"key": "B", "text": "128"}, {"key": "C", "text": "240"}, {"key": "D", "text": "255"}], "answer": "C", "explain": "本题考查 Cortex-M 内核 NVIC 的中断上限。Cortex-M3/M4 的 NVIC 理论上最多支持 240 个外部 IRQ（中断号 16~255）（C），其中编号 0~15 留给系统异常。具体芯片只实现其中一部分（如 F407 为 82 个）。易错点：240 是\"内核能力上限\"而非某颗芯片的实现数；255 是把编号范围当成数量。", "imgs": []}, {"id": "choice-233", "kind": "choice", "kind_name": "单选题", "num": 233, "stem": "系统控制寄存器 NVIC 和处理器内核接口紧密耦合，主要目的是（　）。", "options": [{"key": "A", "text": "结构更紧凑，减小芯片的尺寸"}, {"key": "B", "text": "连接更可靠，减小出错的概率"}, {"key": "C", "text": "减小延时，高效处理最近发生的中断"}, {"key": "D", "text": "无所谓，没有特别的意思，远一点也没有关系"}], "answer": "C", "explain": "本题考查 NVIC 紧密耦合的动机。NVIC 与内核紧耦合（而非挂在总线上）是为了配合流水线实现低延迟中断响应与高效的尾链（tail-chaining）/迟到（late-arriving）处理，从而缩短中断延迟、快速处理最新到来的更高优先级中断（C）。芯片面积、连线可靠性都不是设计要点；D 显然错误。", "imgs": []}, {"id": "choice-234", "kind": "choice", "kind_name": "单选题", "num": 234, "stem": "关于中断嵌套说法正确的是（　）。", "options": [{"key": "A", "text": "只要响应优先级不一样就有可能发生中断嵌套"}, {"key": "B", "text": "只要抢占式优先级不一样就有可能发生中断嵌套"}, {"key": "C", "text": "只有抢占式优先级和响应优先级都不一才有可能发生中断嵌套"}, {"key": "D", "text": "以上说法都不对"}], "answer": "B", "explain": "本题考查抢占优先级与响应（子）优先级的作用。抢占优先级决定能否嵌套：高抢占优先级的中断可以打断正在执行的低抢占优先级中断（B）。响应优先级只在\"多个中断同时挂起且抢占优先级相同\"时决定谁先被响应（排队顺序），它不会产生嵌套——若两中断抢占优先级相同，后到的只能等待前者执行完。易错点：A 把响应优先级误当成抢占。", "imgs": []}, {"id": "choice-235", "kind": "choice", "kind_name": "单选题", "num": 235, "stem": "在 STM32F407 向量中断控制器管理下，可将中断分为（　）组。", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "B", "explain": "本题考查中断优先级分组。STM32 的 NVIC 提供 5 种分组方式（Group 0~4），通过 `NVIC_PriorityGroupConfig()` 选择，把 4 个优先级位在\"抢占位数:响应位数\"间分配：0→(0,4)、1→(1,3)、2→(2,2)、3→(3,1)、4→(4,0)（B）。易错点：默认（不配置时）为 Group 0，\"分组 2\"是很多教程的习惯配置（抢占 4 级、响应 4 级）。", "imgs": []}, {"id": "choice-236", "kind": "choice", "kind_name": "单选题", "num": 236, "stem": "中断屏蔽器不能屏蔽（　）", "options": [{"key": "A", "text": "NMI 中断"}, {"key": "B", "text": "串口中断"}, {"key": "C", "text": "窗口看门狗中断"}, {"key": "D", "text": "外部中断"}], "answer": "A", "explain": "本题考查 NMI 的不可屏蔽特性。NMI（Non-Maskable Interrupt，不可屏蔽中断）不受 PRIMASK/BASEPRI 及 NVIC 使能位屏蔽，用于掉电、时钟失效等致命事件（A）；串口、窗口看门狗（EWI）、外部中断都是普通可屏蔽 IRQ，可用 BASEPRI/使能位屏蔽或清除。易错点：NMI 也无法被更高优先级\"抢占前\"门控，但可通过 NMI 处理程序内部逻辑处理；HardFault 同样不可屏蔽。", "imgs": []}, {"id": "choice-237", "kind": "choice", "kind_name": "单选题", "num": 237, "stem": "PWM 是（　）", "options": [{"key": "A", "text": "脉冲宽度调制"}, {"key": "B", "text": "脉冲频率调制"}, {"key": "C", "text": "脉冲幅度调制"}, {"key": "D", "text": "脉冲位置调制"}], "answer": "A", "explain": "本题考查缩写含义。PWM＝Pulse Width Modulation＝脉冲宽度调制（A）：周期（频率）固定，通过改变高电平占空比等效输出不同平均电压，用于调光、调速、DAC 滤波等。B 是 PFM（调频）、C 是 PAM（调幅）、D 是 PPM（脉位调制）。易错点：PWM 频率与占空比独立——频率由 ARR+PSC 决定，占空比由 CCR/ARR 决定。", "imgs": []}, {"id": "choice-238", "kind": "choice", "kind_name": "单选题", "num": 238, "stem": "当使用定时器 14 输出频率为 1000Hz 的脉冲，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseInitTypeDef TIM_TimeBaseStructure;\nRCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM14, ENABLE);\nTIM_TimeBaseStructure.TIM_Period        = ___________;\nTIM_TimeBaseStructure.TIM_Prescaler     = 8400-1;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM14, &TIM_TimeBaseStructure);", "options": [{"key": "A", "text": "1000"}, {"key": "B", "text": "10"}, {"key": "C", "text": "999"}, {"key": "D", "text": "9"}], "answer": "D", "explain": "本题考查定时器周期计算（F407：APB1 定时器时钟 84MHz）。计数时钟＝84MHz/8400＝10kHz；要 1000Hz 输出，周期计数应为 10kHz/1000Hz＝10 个计数，而 ARR 是\"重装载值\"，实际周期为 ARR+1，故 TIM_Period＝10-1＝9（D）。易错点：忘记 +1 会算成 10（B）；1000/999（A、C）是把 84MHz 当成计数时钟。", "imgs": []}, {"id": "choice-239", "kind": "choice", "kind_name": "单选题", "num": 239, "stem": "当使用定时器 1 输出频率为 100Hz 的脉冲，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseInitTypeDef TIM_TimeBaseStructure;\nRCC_APB2PeriphClockCmd(RCC_APB2Periph_TIM1, ENABLE);\nTIM_TimeBaseStructure.TIM_Period        = ___________;\nTIM_TimeBaseStructure.TIM_Prescaler     = 16800-1;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM1, &TIM_TimeBaseStructure);", "options": [{"key": "A", "text": "100"}, {"key": "B", "text": "200"}, {"key": "C", "text": "99"}, {"key": "D", "text": "199"}], "answer": "C", "explain": "本题考查定时器周期计算（F407：TIM1 挂在 APB2，定时器时钟 168MHz）。计数时钟＝168MHz/16800＝10kHz；100Hz 输出需要 10kHz/100Hz＝100 个计数，TIM_Period＝100-1＝99（C）。易错点：TIM1/TIM8 在 APB2 上跑 168MHz，TIM2~TIM7 等 APB1 定时器为 84MHz，两者预分频系数不同；仍要记得 ARR+1 才是周期。", "imgs": []}, {"id": "choice-240", "kind": "choice", "kind_name": "单选题", "num": 240, "stem": "以下对于 STM32 ADC 描述正确的是（　）", "options": [{"key": "A", "text": "STM32F407 ADC 是一个 12 位连续近似模拟到数字的转换器"}, {"key": "B", "text": "STM32F407 ADC 是一个 8 位连续近似模拟到数字的转换器"}, {"key": "C", "text": "STM32F407 ADC 是一个 12 位连续近似数字到模拟的转换器"}, {"key": "D", "text": "STM32F407 ADC 是一个 8 位连续近似数字到模拟的转换器"}], "answer": "A", "explain": "本题考查 ADC 分辨率与转换方向。STM32F4 片上 ADC 为逐次逼近型（SAR）12 位、把模拟量转成数字量（A/D），因此 A 正确。B、D 位数错；C、D 方向错（数字转模拟是 DAC）。易错点：\"连续近似\"是逐次逼近（successive approximation）的旧译，指内部用逐次比较试凑；12 位对应满量程 4096 级（0~4095）。", "imgs": []}, {"id": "choice-241", "kind": "choice", "kind_name": "单选题", "num": 241, "stem": "ADC 转换过程不含哪项（　）", "options": [{"key": "A", "text": "采样"}, {"key": "B", "text": "量化"}, {"key": "C", "text": "编码"}, {"key": "D", "text": "逆采样"}], "answer": "D", "explain": "本题考查 A/D 转换三大步骤。模拟到数字的转换依次为采样（Sample）→ 量化（Quantize）→ 编码（Encode），不含\"逆采样\"（D，属生造名词）。采样把时间轴离散化，量化把幅值离散化（引入量化误差，最大 ±1/2 LSB），编码把量化结果写成二进制码。易错点：采样定理要求 fs ≥ 2·fmax，否则混叠（Aliasing）。", "imgs": []}, {"id": "choice-242", "kind": "choice", "kind_name": "单选题", "num": 242, "stem": "ADC 转换过程正确的是（　）", "options": [{"key": "A", "text": "采样—量化—编码"}, {"key": "B", "text": "量化—采样—编码"}, {"key": "C", "text": "采样—编码—量化"}, {"key": "D", "text": "编码—采样—量化"}], "answer": "A", "explain": "本题考查 A/D 转换顺序。必须先\"采样\"取出瞬时值，再\"量化\"到有限电平档，最后\"编码\"成二进制，故为 A。B、C、D 把顺序打乱即违背物理过程：没有采样就没有样本可量化，没有量化结果就无法编码。易错点：牢记\"采样→量化→编码\"三步链，D/A 转换则是\"解码→重建（零阶保持）→滤波\"。", "imgs": []}, {"id": "choice-243", "kind": "choice", "kind_name": "单选题", "num": 243, "stem": "下列哪项不是 ADC 转换器的主要技术指标（　）", "options": [{"key": "A", "text": "分辨率"}, {"key": "B", "text": "频率"}, {"key": "C", "text": "转换速率"}, {"key": "D", "text": "量化误差"}], "answer": "B", "explain": "本题考查 ADC 指标。主要指标包括分辨率（位数/LSB）、转换时间或转换速率（sps）、量化误差、精度（INL/DNL）、信噪比等；\"频率\"一词笼统，不是标准指标名（B）——若指采样频率/输入带宽则会明确写\"采样率\"\"输入信号频率\"。易错点：不要把\"系统时钟频率\"当成 ADC 指标；采样率与转换时间互为倒数，需分清。", "imgs": []}, {"id": "choice-244", "kind": "choice", "kind_name": "单选题", "num": 244, "stem": "以下对 STM32F407 集成 A/D 的特性描述不正确的是（　）", "options": [{"key": "A", "text": "12 位精度"}, {"key": "B", "text": "单一转换模式"}, {"key": "C", "text": "按通道配置采样时间"}, {"key": "D", "text": "数据对齐方式与内建数据一致"}], "answer": "B", "explain": "本题考查 F4 ADC 特性。F4 ADC 支持单次/连续/扫描/间断、单通道/多通道 DMA 搬运等多种转换模式，\"单一转换模式\"说法错误（B 为应选项）。A 正确（12 位可配 6/8/10/12 位）；C 正确（每个规则通道可单独设 SMPR 采样周期）；D 正确（数据可按左/右对齐读出）。易错点：多通道扫描必须配合 DMA，否则只能循环读取同一规则通道。", "imgs": []}, {"id": "choice-245", "kind": "choice", "kind_name": "单选题", "num": 245, "stem": "以下对 STM32F407 集成 A/D 的特性描述正确的是（　）", "options": [{"key": "A", "text": "供电需求：2.6V 到 3.8V"}, {"key": "B", "text": "输入范围：VREF- ≤ VIN ≤ VREF+"}, {"key": "C", "text": "所有输入通道能够同时进行工作"}, {"key": "D", "text": "ADC 转换过程是：采样—编码—量化"}], "answer": "B", "explain": "本题考查 F4 ADC 规格。模拟输入电压必须在 VREF- 与 VREF+ 之间（通常 0~3.3V）才是有效量程（B）。A 错：VDDA 要求 1.8~3.6V（典型 3.3V），2.6~3.8V 不是手册值；C 错：F4 单个 ADC 内部只有一个SAR 转换核心，多通道靠轮流采样，不能真正同时转换（F3 才有双 ADC 交错）；D 错：次序应为采样—量化—编码。", "imgs": []}, {"id": "choice-246", "kind": "choice", "kind_name": "单选题", "num": 246, "stem": "SysTick 定时器是多少位的定时器（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "16"}, {"key": "C", "text": "32"}, {"key": "D", "text": "24"}], "answer": "D", "explain": "本题考查 SysTick 位宽。Cortex-M 内核自带的 SysTick 是 24 位递减计数器（D），时钟源可选内核时钟（F407 为 168MHz）或 HCLK/8，常用于 RTOS 时基与精确延时。易错点：24 位不能直接一次产生 1s 级延时——168MHz 下最大约 0.1s，需要软件计数或改用其他定时器；它也没有预分频（只有 /1、/8 两档）。", "imgs": []}, {"id": "choice-247", "kind": "choice", "kind_name": "单选题", "num": 247, "stem": "当前 SysTick 使用到的时钟源频率为 168MHz，则最大的定时时间约为（　）", "options": [{"key": "A", "text": "168ms"}, {"key": "B", "text": "168us"}, {"key": "C", "text": "84ms"}, {"key": "D", "text": "99ms"}], "answer": "D", "explain": "本题考查 SysTick 最大定时时间计算。24 位计数器最大计数值 2^24-1＝16,777,215，除以 168MHz ≈ 0.0998s ≈ 99ms（D）。易错点：把 2^24 当成 2^26；或误以为 32 位（则应是 25.6s）。工程做法：需要更长延时就记录溢出次数（如 SysTick_Handler 累加计数）来实现 ms 级 RTOS 时基。", "imgs": []}, {"id": "choice-248", "kind": "choice", "kind_name": "单选题", "num": 248, "stem": "当前 SysTick 使用到的时钟源频率为 168MHz，然后接着进行 8 分频，则最大的定时时间约为（　）", "options": [{"key": "A", "text": "1680ms"}, {"key": "B", "text": "99ms"}, {"key": "C", "text": "798ms"}, {"key": "D", "text": "990ms"}], "answer": "C", "explain": "本题考查 SysTick 分频后的最大定时。168MHz/8＝21MHz，24 位最大计数值 16,777,215 ÷ 21MHz ≈ 0.799s ≈ 798ms（C）。易错点：分频 8 后最大时间应是原来的 8 倍（99ms×8≈798ms），而不是 990ms（把 21MHz 记成 16.9MHz 的错算）。做法：`SysTick_Config(SystemCoreClock/8/1000)` 常用作 1ms 中断时基。", "imgs": []}, {"id": "choice-249", "kind": "choice", "kind_name": "单选题", "num": 249, "stem": "若按键连接了 STM32F407 的 PC6 GPIO，PC6 通用 IO 端口映射到外部中断事件线上是（　）", "options": [{"key": "A", "text": "EXTI 线 4"}, {"key": "B", "text": "EXTI 线 5"}, {"key": "C", "text": "EXTI 线 6"}, {"key": "D", "text": "EXTI 线 7"}], "answer": "C", "explain": "本题考查 EXTI 线编号规则。STM32 的 EXTI 线按引脚序号映射（与端口号无关）：PX0→EXTI0、PX1→EXTI1 …… 因此 PC6 → EXTI6（C），同时在 SYSCFG_EXTICR 中选择端口 C。易错点：ERROR 常见于把\"端口 C\"当成线号 2；同一线号的多个端口（PA6/PB6/PC6…）只能选一个，不能同时做外部中断。", "imgs": []}, {"id": "choice-250", "kind": "choice", "kind_name": "单选题", "num": 250, "stem": "上图中 WKUP 连接了 STM32F407 的 PA0 GPIO，PA0 通用 IO 端口映射到外部中断事件线上是（　）", "options": [{"key": "A", "text": "EXTI 线 0"}, {"key": "B", "text": "EXTI 线 1"}, {"key": "C", "text": "EXTI 线 2"}, {"key": "D", "text": "EXTI 线 3"}], "answer": "A", "explain": "本题考查 EXTI 线映射。引脚序号决定 EXTI 线号，PA0 → EXTI0（A）。PA0-WKUP 还是芯片的唤醒引脚：可在待机模式下用 WKUP 上升沿唤醒，其 EXTI0 中断同样可唤醒 STOP 模式。易错点：PA0 的线号是 0 而不是端口号 A（即 0）。", "imgs": []}, {"id": "choice-251", "kind": "choice", "kind_name": "单选题", "num": 251, "stem": "在 STM32F407 上的 I/O 脚的翻转速度可以为（　）。", "options": [{"key": "A", "text": "18MHz"}, {"key": "B", "text": "50MHz"}, {"key": "C", "text": "36MHz"}, {"key": "D", "text": "72MHz"}], "answer": "B", "explain": "本题考查 GPIO 输出速度选项。STM32F4 的 OSPEEDR 提供低/中/高/超高四档，F407 对应约 2/25/50/100MHz；四选项中最接近且属于标准档位的是 50MHz（B）——原卷答案即为 B。A（18MHz）是 F1 的档位，C、D（36/72MHz）不是 F4 手册给出的标称值。易错点：GPIO 翻转速度是\"摆率\"限制，配得越高 EMI 与功耗越大，够用即可。", "imgs": []}, {"id": "choice-252", "kind": "choice", "kind_name": "单选题", "num": 252, "stem": "ARM Cortex-M4 不可以通过（　）唤醒 CPU。", "options": [{"key": "A", "text": "I/O 端口"}, {"key": "B", "text": "RTC 闹钟"}, {"key": "C", "text": "USB 唤醒事件"}, {"key": "D", "text": "PLL"}], "answer": "D", "explain": "本题考查低功耗唤醒源。睡眠/停止/待机模式下可由外部中断（I/O 端口）、RTC 闹钟/唤醒中断、USB 唤醒事件、独立看门狗等唤醒；PLL 是时钟倍频器，只是被唤醒后重配时钟的对象，不是唤醒源（D）。易错点：待机模式只能由 WKUP 引脚、RTC、IWDG、NRST 唤醒；停止模式可被任意 EXTI 唤醒。", "imgs": []}, {"id": "choice-253", "kind": "choice", "kind_name": "单选题", "num": 253, "stem": "STM32 嵌套向量中断控制器（NVIC）具有（　）个可编程的优先等级。", "options": [{"key": "A", "text": "16"}, {"key": "B", "text": "43"}, {"key": "C", "text": "72"}, {"key": "D", "text": "36"}], "answer": "A", "explain": "本题考查优先级级数。STM32 的 NVIC 优先级寄存器实现 4 位 → 2^4＝16 个可编程优先级（0 最高、15 最低）（A），再按分组拆成抢占/响应两段。B（43）、C（72）、D（36）均非优先级数（43、51、74、82 是不同型号的中断通道数，容易混淆）。易错点：数字越小优先级越高，别写反。", "imgs": []}, {"id": "choice-254", "kind": "choice", "kind_name": "单选题", "num": 254, "stem": "STM32 的外部中断/事件控制器（EXTI）支持（　）个中断/事件请求。", "options": [{"key": "A", "text": "16"}, {"key": "B", "text": "23"}, {"key": "C", "text": "19"}, {"key": "D", "text": "36"}], "answer": "B", "explain": "本题考查 EXTI 通道数。F4 的 EXTI 共 23 条线：16 条对应 PX0~PX15，另有 PVD、RTC 闹钟、USB 唤醒/OTG_FS、以太网唤醒等（共 7 条），合计 23（B）。易错点：16（A）只是 IO 线；19（C）是 F1 的线数；EXTI 既可产生中断（进 NVIC）也可只产生事件（触发 ADC/DMA 等，不进中断）。", "imgs": []}, {"id": "choice-255", "kind": "choice", "kind_name": "单选题", "num": 255, "stem": "当使用定时器 8 的通道 1 输出频率为 50Hz，占空比为 20% 的脉冲，且 PWM 工作在模式 1，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseStructure.TIM_Period        = ______________;\nTIM_TimeBaseStructure.TIM_Prescaler     = ______________;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM8, &TIM_TimeBaseStructure);\nTIM_SetCompare1(TIM8, _______________);", "options": [{"key": "A", "text": "500，8400，20"}, {"key": "B", "text": "50，16800，20"}, {"key": "C", "text": "199，16799，20"}, {"key": "D", "text": "199，16799，40"}], "answer": "D", "explain": "本题考查 PWM 频率与占空比计算（TIM8 属 APB2，时钟 168MHz）。计数时钟＝168M/16800＝10kHz；50Hz 周期需 10k/50＝200 个计数 → ARR＝199。模式 1 下\"高电平有效\"，占空比＝CCR/(ARR+1)，要 20% → CCR＝200×20%＝40（D）。易错点：模式 1 时 CCR=40 得 20% 高电平；若填 20 则只有 10%。模式 2 极性相反（下一题）。", "imgs": []}, {"id": "choice-256", "kind": "choice", "kind_name": "单选题", "num": 256, "stem": "当使用定时器 8 的通道 1 输出频率为 50Hz，占空比为 20% 的脉冲，且 PWM 工作在模式 2，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseStructure.TIM_Period        = ______________;\nTIM_TimeBaseStructure.TIM_Prescaler     = ______________;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM8, &TIM_TimeBaseStructure);\nTIM_SetCompare1(TIM8, _______________);", "options": [{"key": "A", "text": "500，8400，20"}, {"key": "B", "text": "50，16800，20"}, {"key": "C", "text": "199，16799，20"}, {"key": "D", "text": "199，16799，160"}], "answer": "D", "explain": "本题考查 PWM 模式 2 的极性关系。TIM8 时钟 168MHz，PSC=16799 → 10kHz；50Hz → ARR=199；模式 2 是\"CNT<CCR 时输出无效电平（低）\"，即输出高电平的时间为 (ARR+1)-CCR。要得到 20% 高电平，就需要 80% 的低电平 → CCR＝200×80%＝160（D）。易错点：模式 1 与模式 2 的占空比互补，记不住就用\"模式2：CCR 越大高电平越少\"。", "imgs": []}, {"id": "choice-257", "kind": "choice", "kind_name": "单选题", "num": 257, "stem": "AT24C02 的 A0、A1、A2 引脚给予高电平，则读访问地址为（　）。", "options": [{"key": "A", "text": "0xA0"}, {"key": "B", "text": "0xA3"}, {"key": "C", "text": "0xAA"}, {"key": "D", "text": "以上都不是"}], "answer": "D", "explain": "本题考查 24C02 的 I2C 器件地址。AT24C02 的 7 位地址为 `1010 A2 A1 A0`，A2A1A0＝111 → 7 位地址 0x57，写成含读写位的 8 位形式：写 0xAE、读 0xAF，四个选项都不对，故选 D。易错点：常有人按\"1010+A2A1A0+0\"算成 1010 111 0＝0xAE，而读操作最低位应是 1；A0~A2 全高时读地址不是 0xAF 以外的任何选项。", "imgs": []}, {"id": "choice-258", "kind": "choice", "kind_name": "单选题", "num": 258, "stem": "AT24C02 一次最多进行编程（　）字节。", "options": [{"key": "A", "text": "256"}, {"key": "B", "text": "128"}, {"key": "C", "text": "8"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查 EEPROM 页写容量。AT24C02 总容量 2Kbit＝256Byte，但内部按页（page）组织，每页 8 字节，一页写操作不能跨页，否则地址回卷覆盖本页开头（C）。易错点：256 是总容量；跨页写必须拆成多次写并重发地址；每次写后需等待约 5ms 内部写周期才能响应下一个起始条件（应答轮询可检测）。", "imgs": []}, {"id": "choice-259", "kind": "choice", "kind_name": "单选题", "num": 259, "stem": "STM32F407ZE 内部 FLASH 容量是（　）。", "options": [{"key": "A", "text": "1MB"}, {"key": "B", "text": "512KB"}, {"key": "C", "text": "2MB"}, {"key": "D", "text": "192KB"}], "answer": "B", "explain": "本题考查型号编码规则。STM32F407ZE：Z 表示 144 引脚，E 表示 Flash 容量 512KB（B）；C=256KB、D=384KB、E=512KB、F=768KB、G=1MB、I=2MB。1MB 对应 F407ZG/IG。易错点：把\"E\"当成\"增强版\"而与容量无关，型号后缀字母表的容量对照是必背项。", "imgs": []}, {"id": "choice-260", "kind": "choice", "kind_name": "单选题", "num": 260, "stem": "STM32F407ZE 内部 FLASH 被全部擦除后，尝试读取其存储某地址字数据会是（　）。", "options": [{"key": "A", "text": "0x00000000"}, {"key": "B", "text": "0xFF"}, {"key": "C", "text": "0xFFFFFFFF"}, {"key": "D", "text": "0x00"}], "answer": "C", "explain": "本题考查 Flash 擦除后的状态。浮栅存储单元擦除后所有 bit 都是 1，按字（32 位）读取得 0xFFFFFFFF（C）（按字节读才是 0xFF，故 B 是干扰项）。这也解释了 Flash 编程只能把 1 写成 0、写前必须先擦除的原因。易错点：未初始化的 Flash 区域不等于 0，做空白检查要用 0xFFFFFFFF。", "imgs": []}, {"id": "choice-261", "kind": "choice", "kind_name": "单选题", "num": 261, "stem": "独立看门狗使用的时钟源可以是（　）。", "options": [{"key": "A", "text": "LSE"}, {"key": "B", "text": "LSI"}, {"key": "C", "text": "HSI"}, {"key": "D", "text": "PLL"}], "answer": "B", "explain": "本题考查 IWDG 时钟源。独立看门狗必须独立于主时钟，其时钟源只能是内部低速 RC LSI（约 32kHz）（B），即使主时钟失效也能复位。LSE 是外部 32.768kHz 晶振（给 RTC）；HSI/PLL 属主时钟链，不能给 IWDG。易错点：窗口看门狗（WWDG）则挂在 PCLK1 上、带时钟预分频，两者时钟源不同。", "imgs": []}, {"id": "choice-262", "kind": "choice", "kind_name": "单选题", "num": 262, "stem": "窗口看门狗计数初值为 100，窗口上限值为 80，窗口下限值为 64，窗口看门狗使能后，在计数值等于（　）时刻喂狗不会导致 CPU 复位。", "options": [{"key": "A", "text": "90"}, {"key": "B", "text": "70"}, {"key": "C", "text": "63"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查窗口看门狗喂狗时机。WWDG 的计数从初值递减，允许喂狗的窗口是 CFR < CNT < 窗口值（上限），即 80 与 64 之间（不含上下边界），因此只有计数值 70（B）落在窗口内；90 大于上限 80 → 喂狗过早，触发复位；63 已低于下限 0x40 → 计数值减到 0x3F 时本身就会复位。易错点：WWDG 是\"太早喂也不行\"的安全机制，与 IWDG 只要求\"别太晚\"不同。", "imgs": []}, {"id": "choice-263", "kind": "choice", "kind_name": "单选题", "num": 263, "stem": "STM32F407 的 VREF 引脚连接到 1.8V，读取到 A/D 转换后的数值为 4095，则测量出的电压值为（　）。", "options": [{"key": "A", "text": "3300mv"}, {"key": "B", "text": "1800mv"}, {"key": "C", "text": "0mv"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查 ADC 量程换算。12 位满码 4095 对应基准电压 VREF＝1.8V，故测量值 1800mV（B）。公式：Vin＝AD×VREF/4095（或用 4096 的近似口径，误差 <1LSB）。易错点：VREF 不一定是 3.3V，本题故意把 VREF 设为 1.8V；A 是按 3.3V 硬套的错选。", "imgs": []}, {"id": "choice-264", "kind": "choice", "kind_name": "单选题", "num": 264, "stem": "STM32F407 的 VREF 引脚连接到 3.3V，读取到 A/D 转换后的数值为 0，则测量出的电压值为（　）。", "options": [{"key": "A", "text": "3300mv"}, {"key": "B", "text": "1800mv"}, {"key": "C", "text": "0mv"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查 ADC 量程换算。数字量 0 对应输入电压为 0（相对 VREF-，通常接地），故为 0mV（C）。注意：代码 0 表示 Vin ≤ VREF-，实际可能是负电压被钳位或引脚未接信号；6 位/8 位精度下同样是 0。易错点：把 VREF 电压与转换结果混为一谈（A）。", "imgs": []}, {"id": "choice-265", "kind": "choice", "kind_name": "单选题", "num": 265, "stem": "默认使用中断优先级分组 2，配置串口中断的抢占优先级为 2，响应优先级为 3；配置定时器 1 中断的抢占优先级为（　），响应优先级为 3，就能抢占串口中断。", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查抢占优先级比较方向。抢占优先级数值越小级别越高；要抢占串口（抢占 2），定时器 1 的抢占值必须小于 2，即 1（C）。（此处\"响应优先级为 3\"是原题设定的干扰，响应优先级不影响抢占能力。）易错点：4 位优先级数值越小越高，与\"等级\"直觉相反；同抢占优先级时不存在抢占，只按响应优先级排队。", "imgs": []}, {"id": "choice-266", "kind": "choice", "kind_name": "单选题", "num": 266, "stem": "默认使用中断优先级分组 2，配置串口中断的抢占优先级为 2，响应优先级为 2；配置定时器 1 中断的抢占优先级为 2，响应优先级为（　），则当两个中断同时发生，定时器 1 中断优先执行。", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查响应优先级的作用。两中断抢占优先级相同（都是 2）时不会嵌套，此时由响应优先级决定同时挂起时谁先被响应，数值越小越优先，故要优于串口的 2 就取 1（C）。易错点：响应优先级相同（都 2）时，则按中断号（IRQ 编号小者优先）裁决——TIM1 的 IRQ 号是 25，USART1 是 37，TIM1 其实也会先执行；但题设要求\"通过配置达到\"目标，选 1 最稳妥。", "imgs": []}, {"id": "choice-267", "kind": "choice", "kind_name": "单选题", "num": 267, "stem": "在 SPI 通信中有以下 4 根信号引脚，（　）引脚用于读取从机的数据。", "options": [{"key": "A", "text": "MOSI"}, {"key": "B", "text": "MISO"}, {"key": "C", "text": "/SS"}, {"key": "D", "text": "SCLK"}], "answer": "B", "explain": "本题考查 SPI 引脚含义。MISO（Master In Slave Out）是主机的输入、从机的输出，主机正是通过它读从机数据（B）。MOSI 是主机输出（写数据给从机），/SS 是片选（选中从机），SCLK 是时钟（由主机产生）。易错点：记 MISO 的 \"MI\"＝Master In＝主入，即主机收数据。", "imgs": []}, {"id": "choice-268", "kind": "choice", "kind_name": "单选题", "num": 268, "stem": "在 SPI 通信中有以下 4 根信号引脚，（　）引脚用于输出时钟信号。", "options": [{"key": "A", "text": "MOSI"}, {"key": "B", "text": "MISO"}, {"key": "C", "text": "/SS"}, {"key": "D", "text": "SCLK"}], "answer": "D", "explain": "本题考查 SPI 时钟来源。SPI 是同步串行总线，时钟由主机产生并通过 SCLK（SCK）输出给从机（D）；从机不得驱动时钟。MOSI/MISO 传数据，/SS 选片。易错点：SCLK 是\"主机发出的时钟\"，这点与 I2C 的 SCL 类似但 I2C 多主；SPI 无应答、无地址，靠片选区分从机。", "imgs": []}, {"id": "choice-269", "kind": "choice", "kind_name": "单选题", "num": 269, "stem": "当串口 1 中断的抢占优先级为 2，响应优先级为 1；定时器 1 中断的抢占优先级 2，响应优先级为 1，以下描述正确的是：（　）", "options": [{"key": "A", "text": "当串口 1 中断在运行，定时器 1 能够抢占其优先执行。"}, {"key": "B", "text": "当定时器 1 中断在运行，串口 1 中断能够抢占其优先执行。"}, {"key": "C", "text": "当两个中断同时发生，定时器 1 优先执行。"}, {"key": "D", "text": "以上都不对。"}], "answer": "C", "explain": "本题考查优先级完全相同（都为 2/1）时的裁决。抢占优先级相同 → 不能互相抢占（A、B 错）；同时挂起时按中断向量号（IRQ 号）小者先得到响应，TIM1(25) < USART1(37)，因此定时器 1 优先执行（C）。易错点：C 的正确性依赖芯片实现的中断号顺序；若两者抢占/响应完全一样但 IRQ 号顺序相反，则结果相反。原卷标答为 C。", "imgs": []}, {"id": "choice-270", "kind": "choice", "kind_name": "单选题", "num": 270, "stem": "独立看门狗使用的时钟源为内部低速 RC 振荡电路，频率为 32KHz，部分初始化代码如下：\nIWDG_SetPrescaler(IWDG_Prescaler_256);\nIWDG_SetReload(125);\n则看门狗的喂狗超时时间为（　）", "options": [{"key": "A", "text": "125ms"}, {"key": "B", "text": "256ms"}, {"key": "C", "text": "1000ms"}, {"key": "D", "text": "以上都不对。"}], "answer": "C", "explain": "本题考查 IWDG 溢出（喂狗超时）时间计算。公式：T＝(RLR+1)×预分频值÷LSI（分频档位 IWDG_Prescaler_4~256 就是 4×2^PR）。本题 LSI≈32kHz、预分频 256 → 计数时钟 32kHz/256＝125Hz；重装载值 125 → 实际计数 125+1＝126 个周期，T＝126/125Hz≈1.008s≈1000ms（C）。易错点：①漏掉 +1（则算得约 992ms，选项里没有，可反向验证）；②把 32kHz 写成 32MHz（则得约 1ms，选 A）；③分频档位写错一位结果差一倍。", "imgs": []}, {"id": "choice-271", "kind": "choice", "kind_name": "单选题", "num": 271, "stem": "窗口看门狗在初始化的时候设置窗口的上限值为 80，则在其计数值在递减的过程中，执行喂狗会导致 CPU 复位为（　）", "options": [{"key": "A", "text": "63"}, {"key": "B", "text": "64"}, {"key": "C", "text": "65"}, {"key": "D", "text": "66"}], "answer": "A", "explain": "本题考查 WWDG 下限复位点。WWDG 计数器为 7 位，0x3F（63）是硬件规定的下限：当 CNT 从 0x40(64) 递减到 0x3F(63) 时，即使\"喂狗\"也会立即产生复位（A），因为此时已经越过了 T6 位清零的边界。B(64)、C(65)、D(66) 都还在允许区（只要小于窗口上限 80）。易错点：窗口上限（CFR）与下限（0x40-1）是两道不同的门；软件必须在 64~79 之间喂狗。", "imgs": []}, {"id": "choice-272", "kind": "choice", "kind_name": "单选题", "num": 272, "stem": "在 UCOSIII 创建了两个任务，而且该两个任务同时都是最高的优先级，printf 函数通过串口 1 打印输出，且波特率为 9600bps，这两个任务执行代码如下：\nvoid task1(void *parg) {\n    while (1) {\n        printf(\"task1 is running ...\\r\\n\");\n        OSTimeDlyHMSM(0,0,0,300,OS_OPT_TIME_HMSM_STRICT,&err);\n    }\n}\nvoid task2(void *parg) {\n    while (1) {\n        printf(\"task2 is running ...\\r\\n\");\n        OSTimeDlyHMSM(0,0,0,100,OS_OPT_TIME_HMSM_STRICT,&err);\n    }\n}\n以下描述正确的是（　）", "options": [{"key": "A", "text": "任务 1 一直执行，任务 2 不能执行"}, {"key": "B", "text": "任务 1 与任务 2 都不能执行"}, {"key": "C", "text": "任务 1 打印信息完整，任务 2 打印信息不完整"}, {"key": "D", "text": "以上都不对"}], "answer": "D", "explain": "本题考查同优先级任务的时间片轮转。两个任务优先级相同且都使能了时间片轮转，因此都能运行、并非\"一直执行/不能执行\"（A、B 错）；关键在于 printf 非可重入——两者在 9600bps 下都会调用同一串口发送函数，可能出现双方打印都残缺（互相打断、输出交叉）的情形，而不仅是\"任务 2 不完整\"（C 的表述不全面），故按原卷标答选 D。要点：多任务共用串口需加互斥信号量或用可重入的日志缓冲；1 个字符 10 位，9600bps≈960 字符/s，一条 22 字节消息就要 230ms，远超 100ms 的延时周期，冲突几乎必然发生。", "imgs": []}, {"id": "choice-273", "kind": "choice", "kind_name": "单选题", "num": 273, "stem": "若有说明 `int (*p)[3];` 以下叙述正确的是（　）", "options": [{"key": "A", "text": "p 是指针数组"}, {"key": "B", "text": "`(*p)[3]` 和 `*p[3]` 等价"}, {"key": "C", "text": "p 是指向一维数组中任何一个元素的指针"}, {"key": "D", "text": "p 是指向含有 3 个整型元素的一维数组的指针"}], "answer": "D", "explain": "本题考查数组指针与指针数组的区分（原卷标答为 C，属笔误，正确答案是 D）。`int (*p)[3]` 中括号让 `*` 先与 p 结合：p 是指针，指向\"含 3 个 int 的一维数组\"（D 对）；A 的\"指针数组\"应写成 `int *p[3]`；C 描述的是\"指向单个 int 的指针\"（`int *p`）的行为，不能带 [3]；B 中 `*p[3]` 因下标优先级高于 `*`，等于 `*(p[3])`，即\"取 p 数组第 4 个元素指向的值\"，与 `(*p)[3]` 语义完全不同，且此处 p 根本不是数组，`p[3]` 会越界。记忆法：名字先与谁结合——`(*p)[N]`→数组指针，`*p[N]`→指针数组。", "imgs": []}, {"id": "choice-274", "kind": "choice", "kind_name": "单选题", "num": 274, "stem": "在 C 程序中，表达式 5%2 的结果是（　）", "options": [{"key": "A", "text": "2.5"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "3"}], "answer": "C", "explain": "本题考查取余运算。`%` 是整型取余运算符，5÷2＝2 余 1，故结果为 1（C）。A 是 5.0/2.0 的浮点除结果（C 语言中整数相除 5/2 也只取整数部分 2，即 B 是 `5/2` 的结果）；D 是 (5+2)/2 之类的错算。易错点：`%` 只能用于整型（浮点取余要用 fmod）；负数取余结果符号随被除数（如 -5%2＝-1）。", "imgs": []}, {"id": "choice-275", "kind": "choice", "kind_name": "单选题", "num": 275, "stem": "若 `int x=2,y=3,z=4` 则表达式 `x<z?y:z` 的结果是（　）", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "3"}, {"key": "C", "text": "2"}, {"key": "D", "text": "0"}, {"key": "E", "text": "1"}], "answer": "B", "explain": "本题考查三目条件运算符。先算条件 `x<z`（2<4）为真，取冒号前的值 y＝3（B）。易错点：①三目运算的结合性是从右向左（A?B:C?D:E 等价 A?B:(C?D:E)）；②优先级低于关系/算术运算但高于赋值，所以 `k = a>b?a:b` 无需加括号；③条件表达式的类型会做隐式转换，若两分支类型不同（int/double）则整体提升为 double。", "imgs": []}, {"id": "choice-276", "kind": "choice", "kind_name": "单选题", "num": 276, "stem": "对以下循环体的执行次数是（　）\n#include <stdio.h>\nint main()\n{\n    int i,j;\n    for(i=0,j=3; i<j+5; i+=2,j--)\n        printf(\"%d \\n\",i);\n}", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "3"}, {"key": "C", "text": "2"}, {"key": "D", "text": "1"}], "answer": "B", "explain": "本题考查双变量 for 循环的执行次数（注意条件含 j 变化）。逐轮：初值 i=0,j=3；条件 i<j+5 → 0<8 真，执行后 i=2,j=2；2<7 真，i=4,j=1；4<6 真，i=6,j=0；再判 6<5 假，结束。共执行 3 次（输出 0、2、4）（B）。易错点：把条件里的 `j+5` 当成常量 8（则算成 4 次）；忘记 i 每轮 +2 而 j 每轮 −1，条件 `i<j+5` 会随两者相向变化而提前为假。", "imgs": []}, {"id": "choice-277", "kind": "choice", "kind_name": "单选题", "num": 277, "stem": "设数组 `a[5]={10,20,30,40,50};` 已知指针 p 指向 a[1]；则表达式 `*(++p)` 的值是（　）", "options": [{"key": "A", "text": "20"}, {"key": "B", "text": "21"}, {"key": "C", "text": "30"}, {"key": "D", "text": "31"}], "answer": "C", "explain": "本题考查前置 ++ 与指针解引用的优先级。p 初始指向 a[1]（值 20）；`++p` 先自增使 p 指向 a[2]，再解引用得 30（C）。对比：`(*p)++` 是把 a[1] 的值自增为 21（值仍指 a[1]）；`*p++` 因后缀 ++ 优先级高，等价 `*(p++)`，先取值 20 再让 p 后移。易错点：`*++p` 与 `*(++p)` 等价；B（21）对应 `(*p)++`、A（20）对应 `*p++`。", "imgs": []}, {"id": "choice-278", "kind": "choice", "kind_name": "单选题", "num": 278, "stem": "有以上程序段，执行后，mul 的值为（　）\nint a[]={1,3,5,7,9};\nint mul,*data,x;\nmul=1;\ndata=&a[1];\nfor(x=0;x<3;x++)\n    mul *= *(data+x);", "options": [{"key": "A", "text": "15"}, {"key": "B", "text": "105"}, {"key": "C", "text": "315"}, {"key": "D", "text": "945"}], "answer": "B", "explain": "本题考查指针偏移访问数组。data 指向 a[1]（值 3），循环 3 次取 `*(data+0)=3`、`*(data+1)=5`、`*(data+2)=7`，累乘 1×3×5×7＝105（B）。易错点：①误以为从 a[0] 开始（则得 1×3×5＝15，选 A）；②循环写成 x<4 会带上 9 得 945（D）；③`*(data+x)` 是\"指针加 x 再取值\"，与 `*data+x`（取 3 再加 x）完全不同。", "imgs": []}, {"id": "choice-279", "kind": "choice", "kind_name": "单选题", "num": 279, "stem": "以下语句不能正确赋值的是（　）", "options": [{"key": "A", "text": "`char s1[10]; s1=\"China\";`"}, {"key": "B", "text": "`char s2[]={'C','h','i','n','a'};`"}, {"key": "C", "text": "`char s3[20]=\"China\";`"}, {"key": "D", "text": "`char *s=\"China\";`"}], "answer": "A", "explain": "本题考查字符数组与字符串赋值的区别。数组名是常量地址，不能用 `=` 整体赋值（A 错，应改用 strcpy(s1,\"China\") 或在定义时初始化）。B 用字符初始化列表逐个赋初值，合法（注意末尾无 '\\0'，它只是字符数组不是字符串）；C 定义时用字符串字面量初始化数组，合法且自动补 '\\0'；D 让指针指向字符串字面量（存于只读区），合法但不可修改内容。易错点：只有定义时可以 `char s3[]=\"...\"`，定义之后再赋字符串必须用 strcpy。", "imgs": []}, {"id": "choice-280", "kind": "choice", "kind_name": "单选题", "num": 280, "stem": "C 语言中，定义 PI 为一个符号常量，正确的是（　）", "options": [{"key": "A", "text": "`#define PI 3.14`"}, {"key": "B", "text": "`define PI 3.14`"}, {"key": "C", "text": "`#include PI 3.14`"}, {"key": "D", "text": "`include PI 3.14`"}], "answer": "A", "explain": "本题考查宏定义语法。符号常量用预处理指令 `#define 名称 值`，必须以 `#` 开头（A 对）。B、D 缺少 `#` 且 define/include 不是语句；C 的 include 用于包含头文件（如 `#include <stdio.h>`），不能定义常量。补充写法：`const double PI = 3.14;` 也可（有类型检查，能进符号表便于调试）；宏只是文本替换，无类型、无作用域、不检查参数。", "imgs": []}, {"id": "choice-281", "kind": "choice", "kind_name": "单选题", "num": 281, "stem": "有以下程序，该程序的输出结果为（　）\n#include <stdio.h>\n#define N 3\n#define M N+2\n#define NUM 2*M+1\nint main()\n{\n    int i;\n    i=NUM;\n    printf(\"%d\\n\",i);\n}", "options": [{"key": "A", "text": "11"}, {"key": "B", "text": "9"}, {"key": "C", "text": "7"}, {"key": "D", "text": "5"}], "answer": "B", "explain": "本题考查宏的纯文本替换与括号陷阱。NUM 展开为 `2*M+1` → `2*N+2+1` → `2*3+2+1`＝9（B，与卷面注释一致）。注意这里是\"先替换成 2*M+1，再替换 M\"的展开顺序，因 M 定义为不带括号的 `N+2`，所以得到 2*3+2+1，而非 2*(3+2)+1＝11（A 是\"把 M 当整体加括号\"的错算）。修正做法：`#define M (N+2)`、`#define NUM (2*(M)+1)`。易错点：宏无优先级保护，任何表达式都要加括号。", "imgs": []}, {"id": "choice-282", "kind": "choice", "kind_name": "单选题", "num": 282, "stem": "有以下程序，该程序的输出结果为（　）\n#include <stdio.h>\n#include <string.h>\nint main()\n{\n    char *p=\"abcde\\0fghjk\\0\";\n    printf(\"%d\\n\",strlen(p));\n}", "options": [{"key": "A", "text": "12"}, {"key": "B", "text": "15"}, {"key": "C", "text": "6"}, {"key": "D", "text": "5"}], "answer": "D", "explain": "本题考查转义字符与 strlen 的终止条件。字符串字面量中 `\\0` 是空字符（占 1 个字节、值为 0），strlen 遇到第一个 '\\0' 即停止计数，故长度为 \"abcde\" ＝ 5（D）。干扰项分析：C（6）是把 `\\0` 误当成反斜杠加字符 '0' 两个字符来数；A（12）、B（15）是把 `\\0` 后面的内容或字符总数算进来的结果（整个字面量共 13 字节：abcde(5)+1+fghjk(5)+1+隐式结尾 1）。易错点：strlen 不含结尾 '\\0'；sizeof 才是编译期算出的存储大小（对指针 sizeof(p) 恒为 4/8，与所指内容长度无关）。", "imgs": []}, {"id": "choice-283", "kind": "choice", "kind_name": "单选题", "num": 283, "stem": "为了比较两个字符串 s1 和 s2 是否相等，应当使用（　）", "options": [{"key": "A", "text": "`if (s1=s2)`"}, {"key": "B", "text": "`if (s1==s2)`"}, {"key": "C", "text": "`if (strcmp(s1,s2)==0)`"}, {"key": "D", "text": "`if (strcmp(&s1,&s2)==0)`"}], "answer": "C", "explain": "本题考查字符串比较方法。字符串不能用 `==` 比较内容（B 比较的是两个地址，数组名还会退化为指针；若是字符数组则几乎恒为假），也不能用 `=`（A 是赋值，且数组名不可赋值）。正确做法是调用 `strcmp` 并判断返回值是否为 0（C）。D 传的是\"数组的地址\"类型（指向数组的指针），与 strcmp 的 `const char*` 形参不匹配，属错误写法。易错点：strcmp 返回 0 表示相等、正数表示 s1>s2、负数表示 s1<s2。", "imgs": []}, {"id": "choice-284", "kind": "choice", "kind_name": "单选题", "num": 284, "stem": "设有如下结构定义，若用 `printf(\"%s\\n\",……)` 访问结构体中 name 值的正确方法是（　）\nstruct student\n{\n    int  num;\n    char name[20];\n    char sex;\n    int  age;\n    char addr[30];\n} stud;", "options": [{"key": "A", "text": "`stud->name`"}, {"key": "B", "text": "`&stud.name`"}, {"key": "C", "text": "`stud.&name`"}, {"key": "D", "text": "`stud.name`"}], "answer": "D", "explain": "本题考查结构体成员的两种访问语法。stud 是结构体变量（不是指针），成员访问用 `.`，而 name 是字符数组本身即为地址，所以 `printf(\"%s\", stud.name)` 直接可用（D 对）。A 的 `->` 只能用于结构体指针（如 `struct student *ps=&stud; ps->name`）；B 的 `&stud.name` 取的是\"整个数组的地址\"（类型为 char(*)[20]，值虽相同但类型不匹配，会告警）；C 的写法语法错误。易错点：`->` 与 `.` 的混用是高频错误；若要用 & 取地址则应写 `&stud.name[0]`。", "imgs": []}, {"id": "choice-285", "kind": "choice", "kind_name": "单选题", "num": 285, "stem": "想对一个文本文件的尾部追加，应在 fopen 语句中使用的文件操作方式指示符号为（　）", "options": [{"key": "A", "text": "w"}, {"key": "B", "text": "r"}, {"key": "C", "text": "wb"}, {"key": "D", "text": "a"}], "answer": "D", "explain": "本题考查 fopen 的打开模式。a（append）以\"写入、定位到文件尾、不存在则创建\"的方式打开，正是追加所需（D）。A 的 w 会清空原文件（这是最常见的错误，导致数据丢失）；B 的 r 只读，不能写；C 的 wb 是二进制写且同样清空。补充：`a+` 可读写且定位在尾；打开二进制追加用 `ab`；用完必须 fclose，否则缓冲区内容可能没真正落盘。", "imgs": []}, {"id": "choice-286", "kind": "choice", "kind_name": "单选题", "num": 286, "stem": "有以下程序，该程序的输出结果为（　）\n#include <stdio.h>\n#include <string.h>\nint main()\n{\n    char s[10]=\"121\";\n    int k=0,a=0,b=0;\n    do\n    {\n        k++;\n        if(k%2==0)\n        {\n            a=a+s[k]-'0';\n            continue;\n        }\n        b=b+(s[k]-'0');\n        a=a+s[k]-'0';\n    }while(s[k+1]);\n    printf(\"k=%d a=%d b=%d\\n\",k,a,b);\n    return 0;\n}", "options": [{"key": "A", "text": "k=3 a=2 b=3"}, {"key": "B", "text": "k=3 a=3 b=2"}, {"key": "C", "text": "k=2 a=3 b=2"}, {"key": "D", "text": "k=2 a=2 b=3"}], "answer": "C", "explain": "本题考查 do-while、取模分支与 continue 的综合执行。s=\"121\"，s[0]='1',s[1]='2',s[2]='1',s[3]=0。第 1 轮：k=1（奇数）→ 跳过 if，b += 2 得 b=2、a += 2 得 a=2；判 s[2]='1' 非 0 → 继续。第 2 轮：k=2（偶数）→ a += s[2]-'0'＝1，a=3，continue 跳过后面两句（b 不再累加）；判 s[3]＝0 → 循环结束。故 k=2, a=3, b=2（C）。易错点：①continue 在 do-while 中仍会执行 while 条件判断，不会死循环；②`s[k]-'0'` 是把数字字符转成数值的惯用法；③s[k+1] 为 0 时条件为假——它检测的是\"下一个字符是否为 '\\0'\"，等价于\"是否已到串尾\"。", "imgs": []}, {"id": "choice-287", "kind": "choice", "kind_name": "单选题", "num": 287, "stem": "四个数在内存中的存储情况如下（按地址从低到高列出字节），其中数值最大的是哪一个？数值为多少？（　）", "options": [{"key": "A", "text": "Big-endian：12 34 56 78"}, {"key": "B", "text": "Big-endian：56 78 12 34"}, {"key": "C", "text": "Little-endian：34 56 78 12"}, {"key": "D", "text": "Little-endian：78 12 34 56"}], "answer": "B", "explain": "本题考查大小端字节序的还原。按\"大端＝高字节在低地址、小端＝低字节在低地址\"把字节序列还原为整数：A 大端 12 34 56 78 → 0x12345678；B 大端 56 78 12 34 → 0x56781234；C 小端 34 56 78 12 → 0x12785634；D 小端 78 12 34 56 → 0x56341278。比较得 B 最大，数值 0x56781234。易错点：小端还原要\"倒着读\"（最后出现的字节才是最高字节）；D 虽然首字节也是 56，但第二字节 34 < 78，故仍小于 B。", "imgs": []}, {"id": "choice-288", "kind": "choice", "kind_name": "单选题", "num": 288, "stem": "下列表达式中与表达式 `(~A)||(~B)` 等效的是（　）（基础题）", "options": [{"key": "A", "text": "`~(A&&B)`"}, {"key": "B", "text": "`~(A&B)`"}, {"key": "C", "text": "`~(A||B)`"}, {"key": "D", "text": "`~(A|B)`"}], "answer": "A", "explain": "本题考查德摩根律以及逻辑运算与位运算的区别。按布尔代数有 ¬A∨¬B ≡ ¬(A∧B)，即\"非 A 或 非 B\"等价于\"非(A 且 B)\" → `~(A&&B)`（A）。C 是 ¬(A∨B) ≡ (¬A)∧(¬B)，把\"或\"变成了\"与\"，方向相反；B、D 用的是按位与，属于另一种运算。易错点：①`&&`/`||` 是逻辑运算、`&`/`|` 是按位运算，本考点按布尔表达式（德摩根律）作答；②顺带了解 C 语言陷阱——`~` 是按位取反，`~0` 得 -1（非零仍为\"真\"），若严格按 C 求值 `(~A)||(~B)` 恒为真。", "imgs": []}, {"id": "choice-289", "kind": "choice", "kind_name": "单选题", "num": 289, "stem": "定义了 `#define MAX(a,b) ((a)>(b)?(a):(b))`，下面代码片段的输出是（　）（基础题）\nint x = 5, y = 8, z = 10;\nz = MAX(x++, y++);\nprintf(\"x=%d, y=%d, z=%d\", x, y, z);", "options": [{"key": "A", "text": "x=6, y=10, z=9"}, {"key": "B", "text": "x=6, y=9, z=10"}, {"key": "C", "text": "x=6, y=9, z=9"}, {"key": "D", "text": "x=6, y=10, z=10"}], "answer": "A", "explain": "本题考查宏参数被多次求值的副作用。展开后为 `z = ((x++)>(y++)?(x++):(y++));`：比较 `x++`（取值 5，x 自增为 6）与 `y++`（取值 8，y 自增为 9），5>8 为假 → 走 `(y++)` 分支，z 取 y 自增前的值 9，y 再自增为 10 ⇒ x=6, y=10, z=9（A）。宏参数在原式中各出现两次，比较与分支各求值一次，自增共发生两次——这是\"宏是文本替换、参数可能被多次求值\"的教科书案例（改写成 `static inline` 函数即可消除）。易错点：误以为\"先各自自增一次再比较\"，会错选 B。", "imgs": []}, {"id": "choice-290", "kind": "choice", "kind_name": "单选题", "num": 290, "stem": "下列程序片段中 for 循环会执行多少次（　）（基础题）\nint a[5], i;\nfor(i=1; i<=5; i++) {\n    a[i] = 0;\n}", "options": [{"key": "A", "text": "6"}, {"key": "B", "text": "5"}, {"key": "C", "text": "4"}, {"key": "D", "text": "不确定"}], "answer": "B", "explain": "本题考查循环次数与数组下标范围。i 依次取 1、2、3、4、5，`i<=5` 共成立 5 次（B）。本题真正的坑：`int a[5]` 的合法下标是 0~4，最后一次循环 `a[5]=0` 越界写，属未定义行为——循环次数本身是确定的 5 次，但代码有缺陷；若题目问\"会不会有问题/输出什么\"，应回答\"越界、结果不确定，可能破坏相邻内存\"。易错点：把\"循环 5 次\"与\"访问了 6 个位置（含越界）\"混为一谈。", "imgs": []}, {"id": "choice-291", "kind": "choice", "kind_name": "单选题", "num": 291, "stem": "在某机器上整型值占 4 字节、char 类型占 1 字节、起始地址能被 4 整除，结构体定义如下，使用 sizeof 计算其大小时返回的值是（　）（基础题）\nstruct MStar {\n    char STB:1;\n    char FAE2:1;\n};", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "4"}, {"key": "D", "text": "8"}], "answer": "A", "explain": "本题考查位域存储与结构体对齐。两个 1 位宽、类型为 char 的位域共 2 bit，char 的存储单元是 1 字节，两者能放进同一个 1 字节里；结构体的对齐单位取自其成员（最大 1 字节），无需补齐 → `sizeof` 返回 1（A）。补充规则：位域按声明类型分配存储单元，宽度超出时会另开新单元（如 `char a:5; char b:4;` 需 2 字节）；若成员换成 `int b:1`，对齐单位变 4 字节，结构体就会被补齐到 4。易错点：被\"起始地址能被 4 整除\"误导而选 C——那是成员里出现 int 等 4 字节类型时才会发生的对齐效果。", "imgs": []}, {"id": "choice-292", "kind": "choice", "kind_name": "单选题", "num": 292, "stem": "根据 `int two_dim[][5]={{0,1,2},{1,11},{2,21,22,23}};` 可以推断出最左维（第一维）的值为（　）（中等难度）", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "3"}, {"key": "D", "text": "5"}], "answer": "C", "explain": "本题考查二维数组初始化的维度推断。初始化列表里有 3 组花括号（3 行），第二维 [5] 已显式给出，编译器据此把第一维补齐为 3（C）；每行不足 5 个元素的位置自动补 0，即第一行为 `{0,1,2,0,0}`。易错点：①把\"最左维\"误看成第二维 5（选 D）——最左维是最外层行数；②按元素总数 9 去整除 5，算不出整行数，仍以初始化行数为准。", "imgs": []}, {"id": "choice-293", "kind": "choice", "kind_name": "单选题", "num": 293, "stem": "下面对二维数组的定义中正确的是（　）（基础题）", "options": [{"key": "A", "text": "`int m[2][] = {1,2,3,4,5,6};`"}, {"key": "B", "text": "`int m[][4];`"}, {"key": "C", "text": "`int m[][3] = {1,2,3,4,5,6};`"}, {"key": "D", "text": "`int m[][] = {{1,2,3},{4,5,6}};`"}], "answer": "C", "explain": "本题考查二维数组定义的维度省略规则——只能省略第一维（行数），且必须能由初始化列表推断出来；第二维（列数）永远不能省。C 给出第二维 3，共 6 个初始化元素，可推断出第一维为 2，合法（C）。A 省掉了第二维，编译器无法确定每行长度；B 虽有第二维但没有任何初始化列表，第一维无从推断；D 两维都省，非法。易错点：记住口诀\"内层列数必须写，外层行数可推断\"。", "imgs": []}, {"id": "choice-294", "kind": "choice", "kind_name": "单选题", "num": 294, "stem": "假设 `char *m=\"\\namstar\";`，则指针变量 m 指向的字符串所占的字节数是（　）（基础题）", "options": [{"key": "A", "text": "12"}, {"key": "B", "text": "11"}, {"key": "C", "text": "8"}, {"key": "D", "text": "3"}], "answer": "C", "explain": "本题考查转义字符与字符串结尾符。串内容为 `\\n`（1 个字节）+ `amstar`（6 个字节）= 7 个字符，字符串常量末尾还要存放 `'\\0'`，共 8 字节（C）。易错点：①把 `\\n` 当两个字符（`\\` 和 `n`）会多算成 9；②漏掉结尾符会答 7（不在选项中）；③题目问\"字符串所占字节数\"（含 '\\0'）而非 strlen——strlen(m) 得 7（不含 '\\0'），sizeof(m) 则是指针本身的大小（32 位 4、64 位 8）。", "imgs": []}, {"id": "choice-295", "kind": "choice", "kind_name": "单选题", "num": 295, "stem": "在单链表中，已知指针 p 指向某个结点（p 不是尾结点）。若要在 p 之后插入一个新结点、以及删除 p 的直接后继结点，这两个操作的时间复杂度分别是（　）（基础题）", "options": [{"key": "A", "text": "均为 O(1)"}, {"key": "B", "text": "均为 O(n)"}, {"key": "C", "text": "插入为 O(1)，删除为 O(n)"}, {"key": "D", "text": "插入为 O(n)，删除为 O(1)"}], "answer": "A", "explain": "本题考查单链表在\"结点位置已知\"时插入与删除的代价。正确项依据：已知前驱 p 时，插入只需两步指针操作 `s->next = p->next; p->next = s;`；删除 p 的直接后继也只是 `q = p->next; p->next = q->next;` 加一次 `free`，两者都只改动常数个指针，与表长无关，故均为 O(1)（A）。干扰项分析：B 把\"链表不能随机访问\"的代价错算到本操作上——O(n) 对应的是按序号或按值查找第 i 个结点及其前驱的过程；C 认为删除 p 的后继仍需重新定位前驱（O(n)），忽略了删除所依赖的前驱恰恰就是已知的 p；D 反过来认为插入前要先查找插入位置（O(n)），而插入位置已由 p 直接给定。易错提醒：判断复杂度先问\"前驱是否已知\"——已知前驱是 O(1)；只给出待删结点本身、又必须找其前驱时才会退化为 O(n)，这是链表题的经典陷阱。", "imgs": []}, {"id": "choice-296", "kind": "choice", "kind_name": "单选题", "num": 296, "stem": "判断一个单链表中是否存在环，下列做法中最优（不依赖额外存储空间）的是（　）（中等难度）", "options": [{"key": "A", "text": "用一个哈希表记录已访问过的结点，若再次访问到同一结点则说明有环"}, {"key": "B", "text": "用快慢指针：慢指针每次走 1 步、快指针每次走 2 步，若两指针相遇则说明有环"}, {"key": "C", "text": "遍历链表并统计结点个数，若总数超过链表的预分配长度则说明有环"}, {"key": "D", "text": "把链表反转后再与原链表比较，若完全相同则说明有环"}], "answer": "B", "explain": "本题考查单链表判环的经典解法——快慢指针（Floyd 判圈算法）。正确项依据：快指针速度是慢指针的两倍，若存在环，两指针进入环后相对速度为 1 步每轮，构成追击问题，必然在环内相遇；若不存在环，快指针先到达链尾 NULL，算法结束。全程只用两个指针变量，额外空间 O(1)、时间 O(n)，是空间最优解（B）。干扰项分析：A 的哈希表法时间同为 O(n)，但需要额外 O(n) 的存储来记录访问痕迹，不满足\"不依赖额外空间\"；C 的前提不成立——链表长度事先未知、也无\"预分配长度\"可比，有环时遍历本身还永远不会结束；D 的方案不可行——有环时反转操作会陷入死循环，且\"反转后比较\"无法区分有环与无环的情形。易错提醒：①相遇只能说明有环，求环入口需从表头与相遇点各放一个指针同步前进，重合处才是环的入口；②快慢指针还可求链表中点（快指针到尾时慢指针恰在中点），是链表题的高频工具。", "imgs": []}, {"id": "choice-297", "kind": "choice", "kind_name": "单选题", "num": 297, "stem": "将单链表整体反转，下列实现思路中错误的是（　）（中等难度）", "options": [{"key": "A", "text": "用三个指针 pre、cur、next 迭代：先保存 cur 的后继，再令 cur->next 指向 pre，随后整体向后推进"}, {"key": "B", "text": "新建一条空链表，依次取原链表的首结点用头插法插入新表，最后返回新表"}, {"key": "C", "text": "依次把原链表结点从链上摘下，用头插法重新插入到表头结点之后"}, {"key": "D", "text": "从表尾结点开始向前逐个修改 next 指针，使其指向前驱结点"}], "answer": "D", "explain": "本题考查单链表反转的两种常规实现（迭代改链与头插法），以及\"单链表只能单向遍历\"这一结构限制。正确项依据：本题要求选出错误的方案，D 不可行——单链表结点只保存指向后继的 next 指针、没有指向前驱的指针，从表尾无法反向走到表头，不借助栈等辅助结构连第一步都做不了，故 D 就是错误项。其余三项均可行：A 的三指针 pre、cur、next 迭代是标准写法，每轮先存后继再改指针（`next = cur->next; cur->next = pre; pre = cur; cur = next;`），时间 O(n)、空间 O(1)；B 新建空表并把原表结点逐个头插进新表，头插自动产生逆序；C 就地摘下结点用头插法重插回头结点之后，同样是正确的原地反转。易错提醒：①迭代实现必须先保存 cur->next 再改写它，否则后半段链表丢失；②头插法要把结点逐个摘下再插，整条链直接挂到表头只会得到旋转而不是反转；③本题选\"错误\"，先圈出题干限定词再逐项验证。", "imgs": []}, {"id": "choice-298", "kind": "choice", "kind_name": "单选题", "num": 298, "stem": "带头结点的单链表 head，指针 p 指向头结点。要在第一个数据结点之前插入指针 s 指向的新结点，正确的语句序列是（　）（基础题）", "options": [{"key": "A", "text": "`s->next = p->next; p->next = s;`"}, {"key": "B", "text": "`p->next = s; s->next = p->next;`"}, {"key": "C", "text": "`s->next = p; p->next = s;`"}, {"key": "D", "text": "`p->next = s; s->next = NULL;`"}], "answer": "A", "explain": "本题考查带头结点单链表头部插入的指针操作顺序（先连新链、后改旧链）。正确项依据：A 先把 s 的后继接到原第一个数据结点（`s->next = p->next`），再让头结点指向 s（`p->next = s`），执行后结构为\"头结点 → s → 原首结点 → …\"，完全正确。干扰项分析：B 语句顺序颠倒——先执行 `p->next = s` 后原首结点地址无人引用，随后 `s->next = p->next` 使 s 指向自身，形成自环并丢失全部原有结点；C 把 s 接到头结点之前（`s->next = p`），破坏\"头结点永在最前\"的约定，头结点被绕过，链上还会出现 p 与 s 互指的循环；D 插入后把 `s->next` 置空，等于丢弃原有的全部数据结点。易错提醒：插入操作口诀是\"先改新结点的指针、再改前驱结点的指针\"，次序颠倒必丢链；无头结点版本头部插入需先接链再移动表头（`s->next = head; head = s;`），别忘了更新 head 本身。", "imgs": []}, {"id": "choice-299", "kind": "choice", "kind_name": "单选题", "num": 299, "stem": "元素 1、2、3、4 依次入栈（允许在入栈过程中随时出栈），下列出栈序列中不可能出现的是（　）（中等难度）", "options": [{"key": "A", "text": "4 3 2 1"}, {"key": "B", "text": "1 2 3 4"}, {"key": "C", "text": "3 1 4 2"}, {"key": "D", "text": "3 4 2 1"}], "answer": "C", "explain": "本题考查栈的后进先出（LIFO）特性对出栈序列的约束。正确项依据：用反证法——要让 3 最先出栈，须先依次入栈 1、2、3 再弹出 3，此时栈内自底向上为 1、2、3（3 已弹出后栈内剩 1、2），栈顶为 2；下一次出栈只能弹出 2（或继续入栈 4），绝不可能越过 2 先弹出 1，因此序列 3 1 4 2 不可能（C）。干扰项分析：A 可行——1、2、3、4 全部入栈后依次弹出即得 4 3 2 1；B 可行——每入栈一个立即弹出，得 1 2 3 4；D 可行——入 1、2、3 弹 3，入 4 弹 4，最后弹 2、1。易错提醒：验证任意出栈序列用模拟法最稳——按目标序列逐位匹配，所需元素不是栈顶就继续入栈，中途既无可入元素、栈顶又不符即判非法；另外 4 个元素全部合法出栈序列共 14 种（卡特兰数 C(4)=14），并非 4! = 24 种都可行。", "imgs": []}, {"id": "choice-300", "kind": "choice", "kind_name": "单选题", "num": 300, "stem": "循环队列用数组存储，容量为 N（下标 0~N-1），front 指向队头元素、rear 指向队尾元素的下一个位置（牺牲一个空位方案），则队列满的条件是（　）（基础题）", "options": [{"key": "A", "text": "`rear == front`"}, {"key": "B", "text": "`(rear + 1) % N == front`"}, {"key": "C", "text": "`(front + 1) % N == rear`"}, {"key": "D", "text": "`rear - front == N`"}], "answer": "B", "explain": "本题考查循环队列\"牺牲一个存储单元\"方案下判空与判满的配套公式。正确项依据：rear 指向队尾元素的后一位置，入队时先在 rear 处存元素再 `rear = (rear + 1) % N`；当 rear 再前进一步（模 N 意义下）就要与 front 重合时队列满，即 `(rear + 1) % N == front`（B），此时队列实际最多存放 N-1 个元素，空出的一个单元专门用于区分队空与队满。干扰项分析：A `rear == front` 是队空条件，恰好是靠\"牺牲单元\"与队满区分开来的另一半约定；C 把 front、rear 的角色写反，语义上相当于队头去追队尾，不成立；D 未取模也未处理回绕——回绕后 rear 小于 front，差值甚至为负，该式恒不成立，何况牺牲方案下元素数永远到不了 N。易错提醒：①务必先审题看清指针约定——front 指向队头元素、rear 指向队尾后一位时，队空 `rear == front`、队满 `(rear + 1) % N == front` 成对出现；②不想牺牲空位可增设 size 计数器或标志位，即可存满 N 个元素，但要多维护一个变量。", "imgs": []}, {"id": "choice-301", "kind": "choice", "kind_name": "单选题", "num": 301, "stem": "循环队列用数组 `Q[0..N-1]` 存储，front 指向队头元素、rear 指向队尾元素的下一个位置，则当前队列中元素个数的计算公式是（　）（基础题）", "options": [{"key": "A", "text": "`rear - front`"}, {"key": "B", "text": "`front - rear`"}, {"key": "C", "text": "`(rear - front + N) % N`"}, {"key": "D", "text": "`(front - rear + N) % N`"}], "answer": "C", "explain": "本题考查循环队列的计数公式——必须用模运算处理回绕。正确项依据：元素个数等于从 front 沿环形方向前进到 rear 的距离，公式 `(rear - front + N) % N`（C）在无回绕（rear ≥ front）与已回绕（rear < front）两种情形下都成立；例如 N=8、front=6、rear=2，则 (2 - 6 + 8) % 8 = 4 个元素，正确。干扰项分析：A 在回绕后得负数（如 2-6=-4），必须补加 N 再取模才正确；B 与 D 把 front、rear 的位置关系写反，算出的是从 rear 到 front 的反方向距离。易错提醒：①该公式与\"牺牲一个空位\"的判满方案配套使用，元素个数范围是 0 到 N-1；②若约定 rear 指向队尾元素本身，元素个数应为 `(rear - front + N) % N + 1`，公式随约定变化；③公式中 \"+ N\" 正是为防止减法结果为负，取模后得到环形距离。", "imgs": []}, {"id": "choice-302", "kind": "choice", "kind_name": "单选题", "num": 302, "stem": "一棵二叉树中有 10 个度为 1 的结点、30 个叶结点（度为 0 的结点），则该树中度为 2 的结点个数为（　）（中等难度）", "options": [{"key": "A", "text": "29"}, {"key": "B", "text": "30"}, {"key": "C", "text": "31"}, {"key": "D", "text": "无法确定"}], "answer": "A", "explain": "本题考查二叉树的核心性质：叶结点数 n0 与度为 2 的结点数 n2 满足 n0 = n2 + 1，与度为 1 的结点数无关。推导：设结点总数 n = n0 + n1 + n2（n1 为度 1 的结点数）；除根以外每个结点恰有一条来自父结点的边，故分支数（边数）= n - 1，另一方面分支数 = n1 + 2n2，联立得 n0 + n1 + n2 - 1 = n1 + 2n2，化简即 n0 = n2 + 1。代入 n0 = 30 得 n2 = 30 - 1 = 29（A），n1 = 10 在推导中被消去、不影响结果。干扰项分析：B 直接把叶结点数当答案，忽略了\"多 1\"关系；C 把公式记反成 n2 = n0 + 1；D 误以为缺条件——n1 根本不参与结论，30 个叶结点已唯一确定 n2。易错提醒：该性质对任意二叉树都成立（不限于完全二叉树或满二叉树）；\"叶结点总比度为 2 的结点多一个\"可作快速验算口诀。", "imgs": []}, {"id": "choice-303", "kind": "choice", "kind_name": "单选题", "num": 303, "stem": "对含 n 个结点的完全二叉树按层编号（根为 1 号结点，同层自左向右），则编号为 i 的结点若存在左孩子，其左孩子的编号是（　）（基础题）", "options": [{"key": "A", "text": "`2i`"}, {"key": "B", "text": "`2i + 1`"}, {"key": "C", "text": "`⌊i / 2⌋`"}, {"key": "D", "text": "`i + 1`"}], "answer": "A", "explain": "本题考查完全二叉树的顺序存储编号规律（父子下标关系）。正确项依据：从 1 开始编号时，编号 i 的结点左孩子编号为 2i、右孩子编号为 2i+1；可验证——根 1 的左孩子是 2、右孩子是 3，结点 2 的左孩子是 4、右孩子是 5，完全符合 2i、2i+1 的规律（A）。干扰项分析：B `2i + 1` 是右孩子的编号；C 的 ⌊i/2⌋ 是父结点的编号，父子方向恰好弄反；D `i + 1` 只是同层相邻的右兄弟编号，与父子关系无关。易错提醒：①必须先记清前提\"从 1 开始编号\"；若从 0 开始编号，则左孩子为 2i+1、右孩子为 2i+2、父结点为 ⌊(i-1)/2⌋，两套公式不可混用；②编号 i 存在左孩子的条件是 2i ≤ n，存在右孩子的条件是 2i+1 ≤ n。", "imgs": []}, {"id": "choice-304", "kind": "choice", "kind_name": "单选题", "num": 304, "stem": "在二叉搜索树（二叉排序树）中查找一个元素，其平均时间复杂度和最坏时间复杂度分别是（　）（中等难度）", "options": [{"key": "A", "text": "O(log n) 和 O(log n)"}, {"key": "B", "text": "O(log n) 和 O(n)"}, {"key": "C", "text": "O(n) 和 O(n)"}, {"key": "D", "text": "O(1) 和 O(log n)"}], "answer": "B", "explain": "本题考查二叉搜索树（BST）查找代价与树高之间的关系。BST 查找从根出发，逐层与结点比较决定向左或向右，比较次数与根到目标结点的路径长度同阶：随机形态的 BST 期望高度为 O(log n)，平均查找复杂度为 O(log n)；但若插入序列基本有序，BST 会退化成单支树（形如链表），高度升至 n，查找退化为顺序查找，最坏为 O(n)（B）。干扰项分析：A \"平均和最坏都是 O(log n)\"只对平衡二叉搜索树（AVL 树、红黑树）成立，普通 BST 没有这个保证；C 的 O(n) 是单支退化时的最坏值，不能代表平均；D 的 O(1) 是哈希表理想查找的代价，BST 必须从根开始逐层比较，不可能常数时间命中。易错提醒：①\"平均 O(log n)、最坏 O(n)\"是普通 BST 的标准结论，也是最常被考查的一组对比；②要保证最坏仍为 O(log n)，需使用自平衡结构（AVL、红黑树）或 B+ 树、跳表等。", "imgs": []}, {"id": "choice-305", "kind": "choice", "kind_name": "单选题", "num": 305, "stem": "已知一棵二叉树的前序遍历序列和中序遍历序列，能否唯一确定这棵二叉树？下列判断和理由都正确的是（　）（中等难度）", "options": [{"key": "A", "text": "能；前序序列首元素是根，中序序列区分左右子树，递归划分即可唯一还原"}, {"key": "B", "text": "能；但还必须结合后序序列才能保证唯一，仅前序加中序不够"}, {"key": "C", "text": "不能；还需要补充各结点所在的层次信息才能唯一确定"}, {"key": "D", "text": "不能；遍历序列只反映访问先后顺序，无法确定树的具体形态"}], "answer": "A", "explain": "本题考查遍历序列还原二叉树的理论依据。正确项依据：前序序列的第一个元素是整棵树的根；在中序序列中定位该根元素，其左侧全部元素属于左子树、右侧全部元素属于右子树；再由左右子树的元素个数在前序序列中切分出各自的子序列，对两棵子树递归执行同样操作，整棵树被唯一还原（A）。干扰项分析：B 理由错误——\"前序 + 中序\"与\"后序 + 中序\"都能唯一确定，\"前序 + 后序\"反而不能（无法判断只有一个孩子的子树是左还是右）；C 的层次信息并不需要，中序序列的左右划分已提供全部结构信息；D 结论错误，在给定序列组合下树的形态是一一对应的。易错提醒：①判定口诀——必须含中序才能唯一还原（中序+前序、中序+后序、中序+层序均可，前序+后序不可）；②递归切分序列时先算左右子树结点数，防止下标错位；③中序序列同时是二叉搜索树的递增序列，BST 相关题目常从这里切入。", "imgs": []}, {"id": "choice-306", "kind": "choice", "kind_name": "单选题", "num": 306, "stem": "下列排序算法中，属于稳定排序的是（　）（基础题）", "options": [{"key": "A", "text": "快速排序"}, {"key": "B", "text": "堆排序"}, {"key": "C", "text": "直接选择排序"}, {"key": "D", "text": "归并排序"}], "answer": "D", "explain": "本题考查排序算法的稳定性——关键字相等时，排序前后元素的相对次序保持不变才算稳定。正确项依据：归并排序在合并两个有序段时遇到相等元素优先取前段（左段）元素，能让原本靠前的相等元素保持在前，因此是稳定排序（D）；常见的稳定算法还有直接插入排序、冒泡排序、基数排序。干扰项分析：A 快速排序在分区交换中会把相等元素甩到枢轴的任一侧，相对次序被破坏；B 堆排序中\"堆顶与末尾交换加向下调整\"的长距离移动会打乱相等元素的原序；C 直接选择排序每趟把最小元素与待定位交换，可能与后面出现的相等元素越位互换，同样不稳定。易错提醒：①稳定性只在存在相等关键字、且要求等值保序时才有意义；②一句话记忆——选择、快排、堆排、希尔（\"选、快、堆、希\"）都不稳定；③题目若同时要求\"较快且稳定\"，常见答案是归并排序。", "imgs": []}, {"id": "choice-307", "kind": "choice", "kind_name": "单选题", "num": 307, "stem": "下列排序算法中，平均时间复杂度为 O(n log n)、最坏时间复杂度也为 O(n log n)、且额外空间为 O(1)（原地排序）的是（　）（中等难度）", "options": [{"key": "A", "text": "快速排序"}, {"key": "B", "text": "归并排序"}, {"key": "C", "text": "堆排序"}, {"key": "D", "text": "冒泡排序"}], "answer": "C", "explain": "本题考查常用排序算法\"时间加空间\"的综合指标，条件是平均、最坏均 O(n log n) 且原地。正确项依据：堆排序先建堆（O(n)），再做 n 次\"堆顶元素与末尾元素交换加向下调整\"（每次 O(log n)），平均与最坏均为 O(n log n)，且只需常数个临时变量，额外空间 O(1)（C）。干扰项分析：A 快速排序平均 O(n log n)，但最坏会退化为 O(n²)，且递归栈还需 O(log n) 空间，两条都不满足；B 归并排序平均、最坏都是 O(n log n)，但合并需要 O(n) 辅助数组，不满足原地要求；D 冒泡排序平均和最坏都是 O(n²)（仅基本有序且带提前退出优化时最好为 O(n)），量级不符。易错提醒：①\"平均与最坏均为 O(n log n) 的原地排序\"这个组合常被考查，答案就是堆排序；②归并排序虽不原地，但稳定、适合外排序与链表排序；③O(1) 额外空间的要求会把快排的递归栈、归并的辅助数组都排除掉。", "imgs": []}, {"id": "choice-308", "kind": "choice", "kind_name": "单选题", "num": 308, "stem": "快速排序在下列哪种情况下最容易被触发最坏时间复杂度 O(n²)（　）（中等难度）", "options": [{"key": "A", "text": "待排序列已经基本有序，且每次都取第一个元素作为枢轴"}, {"key": "B", "text": "待排序列随机分布，且每次取中间位置的元素作为枢轴"}, {"key": "C", "text": "待排序列完全逆序，且使用随机化枢轴选择"}, {"key": "D", "text": "待排序列元素两两不同，且每次枢轴恰好取到当前子序列的中位数"}], "answer": "A", "explain": "本题考查快速排序最坏情形的触发条件——根源是\"划分极不平衡\"：每次划分后一侧子序列为空、另一侧有 n-1 个元素，递归深度达到 n，总代价 O(n²)。正确项依据：序列基本有序时，固定取第一个元素作枢轴，枢轴往往恰是当前区间的最小值，划分后左侧为空、右侧几乎保留全部元素，逐层退化为单支递归，触发 O(n²)（A）。干扰项分析：B 随机分布加中间位置枢轴，划分接近平均，期望 O(n log n)；C 随机化枢轴正是针对\"有序输入退化\"的防御手段，期望仍为 O(n log n)，并非最坏触发场景；D 每层枢轴取到中位数是划分最均衡的理想情况，代价 O(n log n)（最好情况）。易错提醒：①触发快排退化的是\"划分不平衡\"，并非\"数据有序\"本身——只要枢轴选取不当，有序或逆序输入都会退化，而随机化/三数取中能让这类输入重新接近平均；②工程防御手段：随机化枢轴、三数取中、三路划分、小区间改用插入排序；③快排平均常数最小、实际最快，但\"平均快\"与\"最坏稳\"要分开评估。", "imgs": []}, {"id": "choice-309", "kind": "choice", "kind_name": "单选题", "num": 309, "stem": "对已经基本有序的序列进行排序，从效率角度最适合选用的算法是（　）（基础题）", "options": [{"key": "A", "text": "直接插入排序"}, {"key": "B", "text": "快速排序"}, {"key": "C", "text": "直接选择排序"}, {"key": "D", "text": "堆排序"}], "answer": "A", "explain": "本题考查各排序算法对\"基本有序\"输入的适应性。正确项依据：直接插入排序在序列基本有序时，每个元素只需与前面少数元素比较、做很少的移动即可归位，完全有序时退化为单趟扫描，最好时间复杂度为 O(n)，是\"小规模加基本有序\"场景的首选（A）；冒泡排序加提前退出优化后同样能利用有序性，但元素移动次数一般多于插入排序。干扰项分析：B 快速排序对基本有序序列反而危险——固定取端点作枢轴时容易退化为 O(n²)，至少不比插入排序更优；C 直接选择排序无论数据是否有序都要做约 n(n-1)/2 次比较，恒为 O(n²)，完全用不上\"有序\"这一优势；D 堆排序平均 O(n log n)，但建堆过程会打乱现有顺序，对基本有序数据没有额外优势。易错提醒：①\"最好情况 O(n)\"的常见算法只有少数几个：插入排序、冒泡排序（带提前退出优化）；②注意区分题设限定词——问\"基本有序最适合\"选插入排序，问\"平均最快\"选快速排序，问\"最坏 O(n log n) 且原地\"选堆排序。", "imgs": []}, {"id": "choice-310", "kind": "choice", "kind_name": "单选题", "num": 310, "stem": "二分查找（折半查找）对存储结构的要求和它的平均时间复杂度是（　）（基础题）", "options": [{"key": "A", "text": "顺序存储的有序表；O(log n)"}, {"key": "B", "text": "链式存储的有序表；O(log n)"}, {"key": "C", "text": "顺序存储的有序表；O(n)"}, {"key": "D", "text": "任意存储结构；O(1)"}], "answer": "A", "explain": "本题考查二分查找的两个前提与复杂度结论。正确项依据：二分查找每次取中间位置元素进行比较，要求线性表既\"有序\"又\"顺序存储\"（只有顺序存储才能通过下标在 O(1) 时间内直接定位中点）；每比较一次把查找区间缩小一半，平均与最坏时间复杂度均为 O(log n)（A）。干扰项分析：B 的典型误区是\"有序就能二分\"——链式存储无法按下标直接定位中点，沿链找到中点要 O(n)，二分反而比顺序查找更差，故不正确；C 的存储前提对，但 O(n) 是顺序查找（线性查找）的复杂度，张冠李戴；D \"任意存储结构 O(1)\"是哈希查找的理想特性，与二分查找无关。易错提醒：①\"有序\"和\"顺序存储\"两个条件缺一不可；②二分查找适合静态查找表，若表频繁插入删除，维护有序性的代价高，应改用二叉搜索树或哈希表；③n 个元素的判定树高度为 ⌈log₂(n+1)⌉，最多比较次数即该高度。", "imgs": []}, {"id": "choice-311", "kind": "choice", "kind_name": "单选题", "num": 311, "stem": "对长度为 n 的有序表进行二分查找，最多需要比较的次数是（　）（中等难度）", "options": [{"key": "A", "text": "⌈log₂(n+1)⌉"}, {"key": "B", "text": "⌊log₂ n⌋"}, {"key": "C", "text": "n / 2"}, {"key": "D", "text": "n - 1"}], "answer": "A", "explain": "本题考查二分查找最坏比较次数与判定树高度之间的关系。推导：二分查找的判定树形态接近满二叉树，第 h 层最多容纳 2^(h-1) 个结点，h 层全满共 2^h - 1 个结点；要让 n 个结点全部能挂上，需满足 2^h - 1 ≥ n，解得 h ≥ log₂(n+1)，取最小整数得 h = ⌈log₂(n+1)⌉，最坏比较次数即该高度（A）。验证：n=7 时 ⌈log₂8⌉ = 3，7 个元素最多比较 3 次；n=8 时 ⌈log₂9⌉ = 4，最多比较 4 次，均符合实际划分过程。干扰项分析：B ⌊log₂ n⌋ 数值偏小——n=7 时得 2，而实际需要 3 次；C 的 n/2 是顺序查找的平均比较次数，对象张冠李戴；D 的 n-1 是顺序查找的最坏比较次数，量级不符。易错提醒：①上取整与下取整不要混用，可用 n=7、n=8 等特殊值代入验证；②注意区分\"最多比较次数\"（判定树高度）与\"平均查找长度 ASL\"两个不同指标；③比较次数上界 ⌈log₂(n+1)⌉ 也是\"二分查找在任何情况下都不超过该次数\"的保证。", "imgs": []}, {"id": "choice-312", "kind": "choice", "kind_name": "单选题", "num": 312, "stem": "关于哈希表冲突处理方法，下列说法正确的是（　）（中等难度）", "options": [{"key": "A", "text": "开放定址法发生冲突时，把冲突元素挂到同一地址的单链表上"}, {"key": "B", "text": "链地址法（拉链法）把散列到同一地址的同义词元素存放在同一条线性链表中"}, {"key": "C", "text": "线性探测再散列不会产生堆积（聚集）现象"}, {"key": "D", "text": "再哈希法（双散列）不能消除二次聚集问题"}], "answer": "B", "explain": "本题考查两类冲突处理策略的原理对比：开放定址法在同一散列表内部按探测序列寻找空位；链地址法把同义词链接成表。正确项依据：链地址法将散列地址相同的所有元素组织成一条链表，各链表的表头挂在散列表的相应槽位，查找、插入、删除都简便，且装填因子可以大于 1（B）。干扰项分析：A 描述的其实是链地址法——开放定址法不会为某个地址单独建链，它在表内换位置探测；C 说反了——线性探测的探测序列是连续相邻位置，冲突元素相互挤压、越聚越密，正是\"堆积（一次聚集）\"的典型来源；D 也说反了——二次聚集源于\"探测序列只由初始散列地址决定\"，而再哈希法（双散列）的探测步长由第二个散列函数按关键字计算，不同关键字即使初始地址相同、步长也往往不同，正是为消除二次聚集而设计的。易错提醒：①开放定址法删除元素不能直接置空（会截断探测链），必须设置删除标记（墓碑）；②线性探测易堆积，二次探测可减轻一次聚集但仍有二次聚集，双散列进一步消除二次聚集；③装填因子越大冲突越多、平均查找长度越大，计算 ASL 类题目先看 α。", "imgs": []}, {"id": "choice-313", "kind": "choice", "kind_name": "单选题", "num": 313, "stem": "对有向图进行拓扑排序，其适用的图类型与排序结果的特点分别是（　）（基础题）", "options": [{"key": "A", "text": "无向连通图；结果唯一"}, {"key": "B", "text": "有向无环图（DAG）；若输出的顶点数等于总顶点数则说明图中无环"}, {"key": "C", "text": "任意有向图都能得到完整的拓扑序列；结果唯一"}, {"key": "D", "text": "有向带权图；结果必须按权值递增"}], "answer": "B", "explain": "本题考查拓扑排序的适用对象与\"有环判定\"功能。正确项依据：拓扑排序针对有向无环图（DAG），过程为反复选出当前入度为 0 的顶点输出、并删除其全部出边；若处理结束时输出的顶点数恰好等于图中顶点总数，说明所有顶点都能被安排，图中无环、排序成功；若还有顶点无法输出（剩下顶点入度均不为 0），则说明存在环，拓扑排序无法完成（B）。干扰项分析：A 无向图没有入度、出度与边的方向概念，谈不上拓扑序；C 有环图不存在拓扑序（环上顶点的入度永远降不到 0），且 DAG 的拓扑序列一般不唯一（某一步有多个入度为 0 的顶点时可任意选择）；D 拓扑排序只依据边的指向关系，与边权无关，带权图上的\"按权值\"属于最短路径等另一类问题。易错提醒：①拓扑排序也可用 DFS 实现——按各顶点完成时间逆序输出，若搜索过程中遇到回边则说明有环；②\"是否存在拓扑序\"等价于\"图是否为 DAG\"；③拓扑序列唯一当且仅当每一步入度为 0 的顶点都恰好只有一个。", "imgs": []}, {"id": "choice-314", "kind": "choice", "kind_name": "单选题", "num": 314, "stem": "下列复杂度函数按数量级从小到大（增长速度从慢到快）排列，正确的是（　）（基础题）", "options": [{"key": "A", "text": "O(1) < O(log n) < O(n) < O(n log n) < O(n²)"}, {"key": "B", "text": "O(1) < O(n) < O(log n) < O(n log n) < O(n²)"}, {"key": "C", "text": "O(1) < O(log n) < O(n log n) < O(n) < O(n²)"}, {"key": "D", "text": "O(log n) < O(1) < O(n) < O(n²) < O(n log n)"}], "answer": "A", "explain": "本题考查常见复杂度函数的增长速度比较。正确项依据：常数级 O(1) 与 n 无关、增长最慢；对数级 O(log n) 次之；n 增大时 log n < n，且 n < n log n；平方级 O(n²) 增长快于前三者，标准次序为 O(1) < O(log n) < O(n) < O(n log n) < O(n²)（A）。干扰项分析：B 把 O(n) 排在 O(log n) 之前——n/log n 随 n 增大趋于无穷，n 增长更快，次序颠倒；C 把 O(n log n) 排在 O(n) 之前——n 稍大即 n log n > n（个别小值巧合不能作量级依据），量级比较以渐进行为准；D 把 O(log n) 排到 O(1) 之前（常数才是最小量级），又把 O(n log n) 排到 O(n²) 之后，两处都错。易错提醒：①比较量级看 n 趋向无穷的极限，不要用个别小数值样例下结论；②更完整的链条：O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(n³) < O(2ⁿ) < O(n!)；③同量级内再比常数因子（如 2n 与 1000n 同为 O(n)）。", "imgs": []}, {"id": "choice-315", "kind": "choice", "kind_name": "单选题", "num": 315, "stem": "下列关于 C 语言的叙述中，正确的是（　）。", "options": [{"key": "A", "text": "C 语言是一种编译型语言"}, {"key": "B", "text": "C 语言是一种解释型语言"}, {"key": "C", "text": "C 语言不能直接操作硬件"}, {"key": "D", "text": "C 语言不能用于嵌入式系统开发"}], "answer": "A", "explain": "本题考查 C 语言的基本定位。C 是编译型语言：源代码经预处理、编译、汇编、链接生成机器码后直接由 CPU 执行（A 对）；它不被解释器逐行解释执行（B 错）。C 能通过指针直接读写地址与寄存器，天然适合直接操作硬件、也是嵌入式和操作系统开发的主流语言（C、D 均错）。干扰项依据：B 是 Python 等解释型语言的执行方式；C、D 描述与事实相反。易错提醒：个别环境把 C 脚本当“脚本”跑只是外壳工具链，本质仍是编译执行。", "imgs": []}, {"id": "choice-316", "kind": "choice", "kind_name": "单选题", "num": 316, "stem": "在嵌入式系统中，通常使用哪种类型的内存管理（　）。", "options": [{"key": "A", "text": "静态内存管理"}, {"key": "B", "text": "动态内存管理"}, {"key": "C", "text": "栈内存管理"}, {"key": "D", "text": "堆内存管理"}], "answer": "A", "explain": "嵌入式系统以静态分配为主：全局/静态变量与栈在编译期或启动期确定，运行中不产生碎片、分配时间可预测，最符合实时性与可靠性要求（A）。动态分配（B，堆上 malloc/内存池）在 RTOS 中也有使用（消息、缓冲区等），但需要防碎片与分配失败，属于“必要时谨慎使用”。C 栈、D 堆都只是具体的存储区，不是“通常的内存管理方式”。口径说明：本题多种教材有不同表述（部分资料把动态内存池管理算作嵌入式“通常”手段），按主流观点取 A（存疑，请对照原卷口径）。", "imgs": []}, {"id": "choice-317", "kind": "choice", "kind_name": "单选题", "num": 317, "stem": "在嵌入式系统中，以下哪个协议通常用于设备间通信（　）。", "options": [{"key": "A", "text": "TCP/IP"}, {"key": "B", "text": "HTTP"}, {"key": "C", "text": "SPI"}, {"key": "D", "text": "I2C"}], "answer": "C", "explain": "设备间（板级芯片/器件之间）通信的常用串行总线是 SPI 与 I2C：SPI 全双工、高速，四线（SCLK/MOSI/MISO/CS）；I2C 两线（SCL/SDA）、带器件地址、可挂多设备。TCP/IP（A）与 HTTP（B）是网络协议栈/应用层方向，用于联网通信而非板级设备间通信，排除。本题为单选题，取 C（SPI，嵌入式最常用的设备间高速同步总线）；注：I2C（D）同样是设备间总线，若按多选口径 C、D 均可（存疑，请对照原卷）。易错提醒：区分“设备间总线（SPI/I2C/UART）”与“网络协议（TCP/IP、HTTP）”。", "imgs": []}, {"id": "choice-318", "kind": "choice", "kind_name": "单选题", "num": 318, "stem": "下列哪个不是中断服务程序（ISR）的特点（　）。", "options": [{"key": "A", "text": "应该尽可能短小"}, {"key": "B", "text": "可以包含延时操作"}, {"key": "C", "text": "应该及时清除中断标志"}, {"key": "D", "text": "应该避免使用堆动态分配内存"}], "answer": "B", "explain": "ISR 的核心原则是“快进快出”：尽可能短小（A 是其特点，只做必要处理、耗时工作放主循环/任务）；进入后及时清除中断标志，防止重复触发（C 是其特点）；中断上下文不能阻塞、不宜 malloc 等动态分配（不可重入、可能睡眠）且易碎片化（D 是其特点）。包含延时操作（delay/忙等/阻塞等待）会长时间占用 CPU 并阻塞同级与低优先级中断，是典型禁忌，故 B 不是 ISR 的特点。与第 126 题（中断编程规范：禁止 delay_ms、printf）同源，可对照复习。", "imgs": []}, {"id": "choice-319", "kind": "choice", "kind_name": "单选题", "num": 319, "stem": "a=0xf; printf(\"%x\", a); 打印结果是什么（　）", "options": [{"key": "A", "text": "15"}, {"key": "B", "text": "16"}, {"key": "C", "text": "e"}, {"key": "D", "text": "f"}], "answer": "D", "explain": "考点定位：本题考查整型常量的进制写法与 printf 格式符的对应关系。正确项依据：0xf 是十六进制整型常量（前缀 0x），其十进制值是 15；格式符 %x 要求把参数按十六进制无符号形式输出，且转换说明本身不打印前缀，所以 15 被输出成小写的 f，选 D。干扰项分析：A 的 15 是十进制的值，那是 %d 的输出；B 的 16 既不是 0xf 的值也不是任何格式符的输出，是把十六进制位权算成了 16；C 的 e 是 0xe 的输出，与本题给出的常量无关。易错提醒：%x 输出小写、%X 输出大写、%o 输出八进制（0xf 会输出 17）、%% 才输出一个百分号；另外 0xf 与 15 是同一个值的两种写法，不要把它们当成两个不同的数。", "imgs": []}, {"id": "choice-320", "kind": "choice", "kind_name": "单选题", "num": 320, "stem": "a=3; printf(\"%d\", a++); 打印结果是什么（　）", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "3"}, {"key": "C", "text": "4"}, {"key": "D", "text": "5"}], "answer": "B", "explain": "考点定位：本题考查后缀自增运算符的取值时机。正确项依据：a++ 是后缀形式，语义是先取出 a 的当前值 3 参与表达式（也就是作为 printf 的实参），然后再把 a 自增为 4，所以打印的是 3，选 B。干扰项分析：A 的 2 相当于把 a 先自减或把 a++ 当成 --a；C 的 4 是自增之后的新值，那是 printf(\"%d\", ++a) 或先自增再打印才会得到的结果；D 的 5 与本题无关，没有任何运算会得到 5。易错提醒：分清 a++（先取值后加）与 ++a（先加后取值），以及 (a++)+(a++) 这类在同一个表达式里多次修改同一对象的写法是未定义行为，不要拿它去推断结果；本题语句结束后 a 的值是 4，但打印出来的是 3，两个数字要分开记。", "imgs": []}, {"id": "choice-321", "kind": "choice", "kind_name": "单选题", "num": 321, "stem": "若 x 是整型变量，pb 是基类型为整型的指针变量，则正确的赋值表达式是（　）", "options": [{"key": "A", "text": "pb=&x;"}, {"key": "B", "text": "pb=x;"}, {"key": "C", "text": "*pb=&x;"}, {"key": "D", "text": "*pb=*x"}], "answer": "A", "explain": "考点定位：本题考查指针变量的赋值：只有同类型的地址才能赋给指针，取地址运算符 & 用于取得变量的地址。正确项依据：&x 的类型是 int *，与 pb 的类型完全一致，所以 pb=&x; 合法，执行后 pb 指向变量 x，选 A。干扰项分析：B 把 int 型变量 x 的值当作地址赋给指针，类型不匹配，编译报错（x 里存的是整数，不是地址）；C 的 *pb 是 pb 所指对象（一个 int 左值），而 &x 是地址，把地址赋给 int 对象类型不匹配，并且 pb 此刻还未初始化；D 中 *x 要求 x 是指针或数组，x 是整型变量，对非指针使用一元 * 是编译错误，另外该选项末尾缺分号，即使修正也不成立。易错提醒：*p 与 &x 分属两侧——*p 表示指针指向的对象、可以当左值，p 本身才是指针、要用于接收地址；声明里的 int *pb 中星号属于声明符，不要在表达式中把 *pb 与 pb 混为一谈。", "imgs": []}, {"id": "qa-322", "kind": "qa", "kind_name": "特殊题", "num": 322, "stem": "下列语句应将小写字母转换为大写字母，其中正确的是（　）", "options": [{"key": "A", "text": "if(ch>='a'&&ch<='z') ch=ch-32;"}, {"key": "B", "text": "if(ch>='a'&&ch<='z')ch=ch-32;"}, {"key": "C", "text": "ch=(ch>='a'&&ch<='z')?ch-32:'';"}, {"key": "D", "text": "ch=(ch>'a'&&ch<'z')?ch-32:ch;kl;l;k"}], "answer": "存疑：A（A、B 内容完全相同，本题无唯一答案，若要选最规范的一项则取 A，即题干要求的存疑写法）", "explain": "考点定位：本题考查 ASCII 码表中小写字母与大写字母相差 32、字符判定的边界条件，以及条件运算符的赋值写法。正确项依据：A 与 B 的内容完全一致（只差一个空格），都是先判断 ch 是否落在 a~z 闭区间内，若是则执行 ch=ch-32 把小写转成大写；'a' 与 'A' 的 ASCII 码分别是 97 与 65，差值正好 32，所以这一行本身就是正确的转换语句。干扰项分析：C 用三目运算符算出了大写字符，但没有把结果赋回 ch（表达式结果被丢弃，ch 不变），而且分支之一写成两个单引号构成的空字符串（在 C 里两个单引号之间必须有字符，写成空串是非法字符常量），与另一分支的 char 类型也不匹配；D 的判断条件写成 ch>'a' && ch<'z'，用的是开区间，'a' 与 'z' 自身不会被转换，转换不完整，并且行尾还混入了 kl;l;k 的杂字（原卷手写/污迹残留，不属于语句）。存疑说明：原卷 A、B 两个选项内容完全相同（A 在 if 后多一个空格），题面因此没有唯一答案；最合理解释是原卷 A 项本意应为 ch=(ch>='a'&&ch<='z')?ch-32:ch; 而印刷时漏印，两个选项被印成了同一句话，故本条按存疑处理并给出 A。此外原卷选项的排列顺序是 B、A、D、C 的乱序，本文件统一按 A→D 正序整理，文字未改。易错提醒：转换必须把结果写回 ch，仅用三目算出值而不赋值等于白算；三目的两个分支类型必须相容；标准库的 toupper/islower（需 #include <ctype.h>）更稳妥，但考试要按题意使用 ASCII 差值；另要注意 'A'~'Z' 与 'a'~'z' 之间还夹着 6 个非字母字符，判断必须写成区间而不能只用单个比较。", "imgs": []}, {"id": "choice-323", "kind": "choice", "kind_name"
