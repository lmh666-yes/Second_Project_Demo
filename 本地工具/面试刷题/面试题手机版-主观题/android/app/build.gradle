plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cquiz.app'
    compileSdk 35

    defaultConfig {
        // 独立包名：与客观题版（com.cquiz.app）区分，两个应用可同时安装
        applicationId "com.cquiz.subj"
        // minSdk 24 = Android 7.0: WebView fully supports the modern JS syntax used by the app
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
