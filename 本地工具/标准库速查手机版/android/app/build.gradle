plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stmlookup.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.stmlookup.app"
        // minSdk 24 = Android 7.0: WebView fully supports the modern JS syntax used by the app
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
