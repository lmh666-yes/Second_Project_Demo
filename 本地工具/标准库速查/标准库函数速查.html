}

function renderGuide(f) {
  const box = document.createElement("div");
  box.className = "guide-wrap";
  const steps = f.f || [];
  const key = cmdKey(f);
  if (!DB.prog[key]) DB.prog[key] = {};
  const done = DB.prog[key];
  const doneSet = new Set(Object.keys(done).map(Number));

  if (f.g) {
    const g = document.createElement("div");
    g.className = "ret";
    g.textContent = f.g;
    box.appendChild(g);
  }

  const prog = document.createElement("div");
  prog.className = "guide-progress";
  const ptxt = document.createElement("div"); ptxt.className = "txt";
  const pbar = document.createElement("div"); pbar.className = "bar";
  const pfill = document.createElement("i"); pbar.appendChild(pfill);
  const phint = document.createElement("div"); phint.className = "hint";
  phint.innerHTML = "点每一步的标题展开详情；做完一步点「标记完成」。进度会自动保存在本机（刷新不丢）。";
  prog.append(ptxt, pbar, phint);
  box.appendChild(prog);

  if (f.e) {
    const det = document.createElement("details");
    det.style.margin = "0 0 15px 0";
    const sm = document.createElement("summary");
    sm.textContent = "▼ 想直接抄？点开看全部 " + steps.length + " 步拼好的完整代码";
    sm.style.cssText = "cursor:pointer;font-size:var(--fs-md);color:var(--accent);font-weight:700;padding:9px 0";
    det.appendChild(sm);
    det.appendChild(makeCodeBox(f.e, "复制完整代码"));
    box.appendChild(det);
  }

  const nodes = [];
  steps.forEach((st, i) => {
    const arr = Array.isArray(st) ? st : [String(st)];
    const [title, why, todo, code, verify, pitfall, rel] = arr;
    const d = document.createElement("div");
    d.className = "gstep";
    d.dataset.i = i;

    const hd = document.createElement("div"); hd.className = "hd";
    const num = document.createElement("div"); num.className = "num"; num.textContent = String(i + 1);
    const ttl = document.createElement("div"); ttl.className = "ttl"; ttl.textContent = title || ("第 " + (i + 1) + " 步");
    const ar = document.createElement("div"); ar.className = "arrow"; ar.textContent = "▸";
    hd.append(num, ttl, ar);

    const bd = document.createElement("div"); bd.className = "bd";
    const L = (cls, txt, boxCls) => {
      if (!txt) return;
      const l = document.createElement("div"); l.className = "lbl" + (cls ? " " + cls : ""); l.textContent = txt;
      bd.appendChild(l);
    };
    if (why) { L("", "为什么要这一步"); const t = document.createElement("div"); t.className = "txt"; t.textContent = why; bd.appendChild(t); }
    if (todo) { L("", "这一步做什么"); const t = document.createElement("div"); t.className = "txt"; t.textContent = todo; bd.appendChild(t); }
    if (code) { L("", "本步代码（可直接复制）"); bd.appendChild(makeCodeBox(code)); }
    if (verify) { L("ok", "怎么验证这一步成功"); const t = document.createElement("div"); t.className = "txt okbox"; t.textContent = verify; bd.appendChild(t); }
    if (pitfall) { L("warn", "常见问题 / 注意"); const t = document.createElement("div"); t.className = "txt warnbox"; t.textContent = pitfall; bd.appendChild(t); }
    if (rel) bd.appendChild(makeRelLine(rel));

    const btns = document.createElement("div"); btns.className = "mkbtns";
    const bDone = document.createElement("button"); bDone.className = "pri";
    const bNext = document.createElement("button"); bNext.textContent = "下一步 ▸";
    btns.append(bDone, bNext);
    bd.appendChild(btns);

    d.append(hd, bd);
    box.appendChild(d);
    nodes.push({ d, bDone, bNext, num, ar });

    hd.onclick = () => {
      const open = d.classList.toggle("open");
      ar.textContent = open ? "▾" : "▸";
    };
    bDone.onclick = () => {
      if (doneSet.has(i)) { doneSet.delete(i); delete done[i]; }
      else { doneSet.add(i); done[i] = 1; }
      dbSave();
      syncGuide();
    };
    bNext.onclick = () => {
      const nx = nodes[i + 1];
      if (nx) {
        d.classList.remove("open"); ar.textContent = "▸";
        nx.d.classList.add("open"); nx.ar.textContent = "▾";
        nx.d.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    };
  });

  function syncGuide() {
    let n = 0;
    nodes.forEach((o, i) => {
      const isDone = doneSet.has(i);
      if (isDone) n++;
      o.d.classList.toggle("done", isDone);
      o.num.textContent = isDone ? "✓" : String(i + 1);
      o.bDone.textContent = isDone ? "已标记完成（点此撤销）" : "标记完成";
      o.bDone.classList.toggle("done", isDone);
    });
    const pct = steps.length ? Math.round(n / steps.length * 100) : 0;
    pfill.style.width = pct + "%";
    ptxt.textContent = "第 " + n + " / " + steps.length + " 步完成（" + pct + "%）" +
      (n === steps.length && steps.length ? "　🎉 全部完成，可以去编译验收了" : "");
  }
  syncGuide();

  if (nodes.length) {
    const firstOpen = nodes.findIndex(o => !doneSet.has(o.d.dataset.i * 1));
    const idx = firstOpen >= 0 ? firstOpen : 0;
    nodes[idx].d.classList.add("open");
    nodes[idx].ar.textContent = "▾";
  }
  return box;
}

/* ============================================================
 *  复制
 * ============================================================ */
function copy(text, btn) {
  const orig = btn ? btn.textContent : "";
  const done = () => { if (btn) { btn.textContent = "已复制 ✓"; setTimeout(() => btn.textContent = orig || "复制", 1300); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
qEl.addEventListener("input", () => {
  searchwrapEl.classList.toggle("hasq", !!qEl.value);
  renderList();
});
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); const first = listEl.querySelector(".item, .gcard"); if (first) first.click(); }
});
$("clearq").onclick = () => { qEl.value = ""; searchwrapEl.classList.remove("hasq"); renderList(); qEl.focus(); };

modSel.addEventListener("change", () => { DB.mod[SEC] = modSel.value; dbSave(); renderList(); });
projSel.addEventListener("change", () => {
  buildProj = parseInt(projSel.value, 10) || 0;
  current = null;
  detailEl.innerHTML = "<div class='empty'>点选左侧阶段开始 →</div>";
  renderBuildList();
});

document.querySelectorAll("#tabs button").forEach(b => {
  b.addEventListener("click", () => setSection(b.dataset.sec));
});

$("btnTheme").onclick = cycleTheme;
$("btnFav").onclick = () => openPanel("fav");
$("btnRecent").onclick = () => openPanel("recent");
$("btnHelp").onclick = () => $("panelHelp").classList.add("show");
$("favClear").onclick = () => { DB.fav = []; dbSave(); syncFavBadge(); refreshFavMarks(); renderFavPanel(); toast("收藏已清空"); };

document.querySelectorAll(".panel").forEach(pn => {
  pn.addEventListener("click", (e) => { if (e.target === pn) closePanels(); });
});
document.querySelectorAll("[data-close]").forEach(b => {
  b.onclick = () => $(b.dataset.close).classList.remove("show");
});

/* 回到顶部 */
const totop = $("totop");
totop.onclick = () => detailEl.scrollTo({ top: 0, behavior: "smooth" });
detailEl.addEventListener("scroll", () => {
  totop.classList.toggle("show", detailEl.scrollTop > 400);
}, { passive: true });

/* ---------- 键盘导航 ---------- */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const inField = tag === "input" || tag === "select" || tag === "textarea";
  const ctrl = e.ctrlKey || e.metaKey;

  /* 手机版没有键盘：跳过全部快捷键（含 ? 快捷键面板、Ctrl+B/H/J/D、/、方向键） */
  if (window.__MOBILE__) return;

  if (ctrl && (e.key === "b" || e.key === "B")) { e.preventDefault(); openPanel("fav"); return; }
  if (ctrl && (e.key === "h" || e.key === "H")) { e.preventDefault(); openPanel("recent"); return; }
  if (ctrl && (e.key === "j" || e.key === "J")) { e.preventDefault(); cycleTheme(); return; }
  if (ctrl && (e.key === "d" || e.key === "D")) {
    e.preventDefault();
    if (current !== null && ALL[current]) { toggleFav(ALL[current].n); showDetail(current); }
    return;
  }
  if (e.key === "?" && !inField) { e.preventDefault(); $("panelHelp").classList.toggle("show"); return; }
  if (e.key === "/" && !inField) { e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if (e.key === "Escape") {
    const open = document.querySelector(".panel.show");
    if (open) { closePanels(); return; }
    if (document.body.classList.contains("show-detail")) {
      if (listEl.querySelectorAll(".item.active, .gcard.active").length) { goBackToList(); return; }
    }
    if (qEl.value) { qEl.value = ""; searchwrapEl.classList.remove("hasq"); renderList(); return; }
    if (document.activeElement === qEl) qEl.blur();
    return;
  }
  if (inField) return;

  const rows = [...listEl.querySelectorAll(".item, .gcard")];
  if (!rows.length) return;

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    let idx = rows.findIndex(r => r.classList.contains("active"));
    idx = e.key === "ArrowDown" ? (idx < 0 ? 0 : Math.min(rows.length - 1, idx + 1))
                                : (idx < 0 ? 0 : Math.max(0, idx - 1));
    const target = rows[idx];
    /* 若目标在折叠的分组里，先展开 */
    const grp = target.closest('[data-group]');
    if (grp && grp.style.display === "none") {
      grp.style.display = "";
      const gh = listEl.querySelector('.grouphead[data-key="' + grp.dataset.group + '"]')
              || [...listEl.querySelectorAll(".grouphead")].find(h => h.textContent.indexOf(String(grp.dataset.group)) >= 0);
      if (gh) gh.classList.remove("collapsed");
    }
    rows.forEach(r => r.classList.remove("active"));
    target.classList.add("active");
    target.scrollIntoView({ block: "nearest" });
    return;
  }
  if (e.key === "Enter") {
    const cur = rows.find(r => r.classList.contains("active"));
    if (cur) { e.preventDefault(); cur.click(); }
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const order = ["ref", "guide", "build"];
    const i = order.indexOf(SEC);
    const ni = e.key === "ArrowRight" ? (i + 1) % 3 : (i + 2) % 3;
    setSection(order[ni]);
  }
});

/* ============================================================
 *  初始化
 * ============================================================ */
function initCounts() {
  const ref = ALL.filter(f => !f._b && f._t !== "guide" && f._t !== "flow").length;
  const gd = ALL.filter(f => !f._b && (f._t === "guide" || f._t === "flow")).length;
  const bd = ALL.filter(f => f._b).length;
  $("cntRef").textContent = ref;
  $("cntGuide").textContent = gd;
  $("cntBuild").textContent = bd;
}

function boot() {
  dbLoad();
  applyTheme();
  syncFavBadge();
  /* 手机提示缩短 */
  if (isNarrow()) qEl.placeholder = "搜功能词 / 函数名 / 宏名";

  /* 从 URL hash 恢复（含板块与条目） */
  const hashIdx = restoreFromHash();

  setSection(SEC || "ref", true);
  if (DB.mod && DB.mod[SEC]) { modSel.value = DB.mod[SEC]; renderList(); }
  buildProj = Math.max(0, Math.min((typeof STD_BUILD_PROJ !== "undefined" ? STD_BUILD_PROJ.length : 1) - 1, buildProj));
  projSel.value = String(buildProj);

  initCounts();

  if (hashIdx !== null && hashIdx !== undefined) showDetail(hashIdx);
  else if (DB.last && !isNarrow() && DB.recent.length && false) { /* 预留：可自动打开上次条目 */ }
}
boot();
</script>
<!-- ============================================================
     手机版专用脚本（只对手机版生效）
     ------------------------------------------------------------
     只做网页版不需要、手机上才有意义的事：字号三档按钮。
     桌面浏览器打开时 data-platform 不是 mobile，这里直接返回，不产生任何影响。
     ============================================================ -->
<script>
(function () {
  var H = document.documentElement;
  if (H.getAttribute('data-platform') !== 'mobile') return;

  var SCALES = ['s', 'm', 'l'];
  var NAME = { s: '小', m: '中', l: '大' };
  var cur = 'm';
  try { var saved = localStorage.getItem('stm32.fs'); if (SCALES.indexOf(saved) >= 0) cur = saved; } catch (e) {}

  var btn = document.createElement('button');
  btn.className = 'iconbtn';
  btn.id = 'btnFs';
  btn.title = '字号（小 / 中 / 大）';

  function apply(v) {
    cur = v;
    H.setAttribute('data-fs', v);
    btn.textContent = NAME[v];
    try { localStorage.setItem('stm32.fs', v); } catch (e) {}
  }
  btn.onclick = function () {
    apply(SCALES[(SCALES.indexOf(cur) + 1) % SCALES.length]);
  };

  var bar = document.querySelector('.toolbar');
  if (bar) bar.insertBefore(btn, bar.firstChild); else document.body.appendChild(btn);

  /* 手机上没有键盘：把所有 title 里的快捷键提示抹掉
     （例：收藏夹（Ctrl+B）→ 收藏夹、清空（Esc）→ 清空、主题：深色（Ctrl+J 切换）→ 主题：深色）。
     一条正则收掉全部情况，免得以后又冒出一个带 Ctrl 的按钮。 */
  var KEYRE = /（[^）]*(?:Ctrl|Esc|Shift|Alt|Enter|↑|↓|←|→|\?)[^）]*）/g;
  var titled = document.querySelectorAll('[title]');
  for (var i = 0; i < titled.length; i++) {
    var t = titled[i].getAttribute('title');
    if (!t) continue;
    var n = t.replace(KEYRE, '').trim();
    if (n !== t) titled[i].setAttribute('title', n);
  }

  apply(cur);
})();

/* H2：页脚「数据版本 + 导出时间」——内容来自 rebuild 链写出的 data_build_info.js
   （由 tools/export_json.js 生成：版本 = 条目数 + 数据内容摘要，时间 = 导出时刻）。
   文件在时显示它，手机上一眼能看出手上这份要不要重传；文件缺（没走重建链）时给出提示。
   这段不在任何函数里、又在引擎脚本块末尾，网页版 / 手机版 / APK 三端都会跑到。 */
(function () {
  var box = document.getElementById("buildstamp");
  if (!box) return;
  var bi = (typeof window !== "undefined" && window.__BUILD_INFO__) ? window.__BUILD_INFO__ : null;
  box.textContent = bi
    ? ("数据版本 " + bi.version + "　导出 " + bi.time)
    : "数据版本未标注（未走 rebuild 链）";
})();
</script>
