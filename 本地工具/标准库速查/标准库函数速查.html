<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1419">
<title>STM32F4 标准库函数速查</title>
<style>
/* ============================================================
 *  主题系统
 *  ------------------------------------------------------------
 *  深色优先（默认），支持：
 *    · 自动跟随系统（prefers-color-scheme）
 *    · 手动切换： 深色 / 浅色 / 自动
 *  所有颜色走 CSS 变量，切换只改 <html data-theme>，不重排。
 * ============================================================ */
:root {
  /* ---- 深色主题（默认）---- */
  --bg:            #0f1419;
  --bg-elev:       #161c23;
  --bg-elev-2:     #1c242e;
  --bg-hover:      #222c38;
  --bg-active:     #26333f;
  --bg-code:       #10161d;
  --bg-inset:      #131a21;

  --border:        #2a3540;
  --border-soft:   #212a33;
  --border-strong: #3a4956;

  --fg:            #e3e9ef;
  --fg-strong:     #ffffff;
  --fg-dim:        #9dabb8;
  --fg-faint:      #6b7a88;

  --accent:        #4fa3e3;
  --accent-strong: #6fb8f0;
  --accent-dim:    #2d6a9e;
  --accent-bg:     #16324a;
  --accent-fg:     #cfe6fa;

  --ok:            #4ec97a;
  --ok-bg:         #16301f;
  --ok-border:     #2b5c3a;
  --warn:          #e8a33d;
  --warn-bg:       #33260f;
  --warn-border:   #6b4f22;
  --danger:        #e56a6a;
  --danger-bg:     #33191b;
  --danger-border: #6e3033;
  --info:          #4fc3c9;
  --info-bg:       #123033;
  --info-border:   #2a5f63;
  --violet:        #a98ae0;
  --violet-bg:     #251d38;
  --violet-border: #4b3a70;

  --code-fg:       #d8c9a8;
  --mark-bg:       #7a5a12;
  --mark-fg:       #ffe9a8;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
  --shadow-md: 0 4px 14px rgba(0,0,0,.5);
  --shadow-lg: 0 10px 34px rgba(0,0,0,.6);
  --ring: 0 0 0 3px rgba(79,163,227,.32);

  --radius:    8px;
  --radius-sm: 6px;
  --radius-lg: 12px;

  --fs-xs:  11.5px;
  --fs-sm:  12.5px;
  --fs-md:  13.5px;
  --fs-base:14px;
  --fs-lg:  16px;
  --fs-xl:  19px;
  --fs-2xl: 23px;

  --mono: "Cascadia Mono", Consolas, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  --sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;

  --aside-w: 330px;
}

/* ---- 浅色主题 ---- */
html[data-theme="light"] {
  --bg:            #f4f6f9;
  --bg-elev:       #ffffff;
  --bg-elev-2:     #fafbfd;
  --bg-hover:      #eef3f9;
  --bg-active:     #e2edf8;
  --bg-code:       #f2f5f9;
  --bg-inset:      #f7f9fb;

  --border:        #d8dee6;
  --border-soft:   #e8ecf1;
  --border-strong: #c2ccd8;

  --fg:            #26313d;
  --fg-strong:     #0f1a24;
  --fg-dim:        #64717f;
  --fg-faint:      #8c98a5;

  --accent:        #1f6fb8;
  --accent-strong: #185a97;
  --accent-dim:    #5a9bd0;
  --accent-bg:     #e4f0fb;
  --accent-fg:     #123f68;

  --ok:            #227a45;
  --ok-bg:         #eaf7ee;
  --ok-border:     #b7dfc3;
  --warn:          #a5670c;
  --warn-bg:       #fdf5e6;
  --warn-border:   #edd9ac;
  --danger:        #b83b3b;
  --danger-bg:     #fdeeee;
  --danger-border: #f0c4c4;
  --info:          #10646f;
  --info-bg:       #e2f3f5;
  --info-border:   #b3dde1;
  --violet:        #5a3f91;
  --violet-bg:     #efeaf9;
  --violet-border: #d3c6ee;

  --code-fg:       #7a4a1e;
  --mark-bg:       #ffe9a8;
  --mark-fg:       #4a3400;

  --shadow-sm: 0 1px 2px rgba(24,40,60,.07);
  --shadow-md: 0 4px 14px rgba(24,40,60,.1);
  --shadow-lg: 0 10px 34px rgba(24,40,60,.15);
  --ring: 0 0 0 3px rgba(31,111,184,.22);
}

/* ============================================================
 *  基础
 * ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: var(--fs-base);
  color: var(--fg);
  background: var(--bg);
  display: flex; flex-direction: column;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }

/* ============================================================
 *  顶栏
 * ============================================================ */
header {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  flex: none;
  position: relative;
  z-index: 20;
}
.hrow { display: flex; align-items: center; gap: 12px; padding: 9px 14px; flex-wrap: wrap; }
.hrow + .hrow { padding-top: 0; }

.brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.brand .logo {
  width: 27px; height: 27px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; color: #fff; letter-spacing: -.5px;
  box-shadow: var(--shadow-sm);
}
.brand h1 { font-size: var(--fs-lg); font-weight: 700; color: var(--fg-strong); letter-spacing: -.2px; }
.brand h1 small { font-size: var(--fs-xs); font-weight: 500; color: var(--fg-faint); margin-left: 6px; }

/* 板块切换 */
.tabs { display: inline-flex; gap: 3px; background: var(--bg-inset); padding: 3px; border-radius: var(--radius);
  border: 1px solid var(--border-soft); }
.tabs button {
  border: 0; background: transparent; color: var(--fg-dim);
  font-size: var(--fs-md); font-weight: 600; padding: 6px 14px; border-radius: var(--radius-sm);
  cursor: pointer; white-space: nowrap; transition: background .13s, color .13s;
  display: inline-flex; align-items: center; gap: 6px;
}
.tabs button:hover { background: var(--bg-hover); color: var(--fg); }
.tabs button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.tabs button .tcount {
  font-size: var(--fs-xs); font-weight: 600; opacity: .7;
  background: rgba(255,255,255,.16); border-radius: 8px; padding: 0 5px; min-width: 17px; text-align: center;
}
.tabs button:not(.active) .tcount { background: var(--bg-hover); }

.hspace { flex: 1; min-width: 4px; }

/* 工具栏按钮 */
.toolbar { display: flex; align-items: center; gap: 6px; }
.iconbtn {
  border: 1px solid var(--border); background: var(--bg-elev-2); color: var(--fg-dim);
  width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
  transition: background .13s, color .13s, border-color .13s; flex: none;
}
.iconbtn:hover { background: var(--bg-hover); color: var(--fg-strong); border-color: var(--border-strong); }
.iconbtn.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-dim); }
.iconbtn .bdg {
  position: absolute; transform: translate(13px,-11px);
  background: var(--warn); color: #201400; border-radius: 8px;
  font-size: 10px; font-weight: 800; padding: 0 4px; min-width: 14px; text-align: center; line-height: 14px;
}
.iconbtn { position: relative; }

/* 搜索行 */
.searchwrap { position: relative; flex: 1; min-width: 240px; display: flex; align-items: center; }
.searchwrap .sicon { position: absolute; left: 11px; color: var(--fg-faint); font-size: 14px; pointer-events: none; }
#q {
  width: 100%; padding: 9px 34px 9px 32px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: var(--fs-base); background: var(--bg-inset); color: var(--fg);
  transition: border-color .13s, box-shadow .13s;
}
#q::placeholder { color: var(--fg-faint); }
#q:focus { border-color: var(--accent); box-shadow: var(--ring); background: var(--bg-elev-2); }
#clearq {
  position: absolute; right: 7px; border: 0; background: transparent; color: var(--fg-faint);
  cursor: pointer; font-size: 17px; line-height: 1; padding: 4px 6px; border-radius: 5px; display: none;
}
#clearq:hover { background: var(--bg-hover); color: var(--fg); }
.searchwrap.hasq #clearq { display: block; }

/* 下拉 */
.selectwrap { position: relative; display: inline-flex; align-items: center; }
.selectwrap > .slab { font-size: var(--fs-xs); color: var(--fg-faint); margin-right: 5px; white-space: nowrap; }
select {
  padding: 8px 30px 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: var(--fs-md); background: var(--bg-inset); color: var(--fg); cursor: pointer;
  appearance: none; max-width: 210px; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-faint) 50%), linear-gradient(135deg, var(--fg-faint) 50%, transparent 50%);
  background-position: calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
select:focus { border-color: var(--accent); box-shadow: var(--ring); }

/* 计数 */
#count { font-size: var(--fs-sm); color: var(--fg-dim); white-space: nowrap; }
#count b { color: var(--accent); font-weight: 700; }

/* ============================================================
 *  落地页（未搜索时的「从这里开始」）
 * ============================================================ */
.hero { padding: 14px 13px 15px; border-bottom: 2px solid var(--border); background: var(--bg-elev-2); }
.hero-t { font-size: var(--fs-lg); font-weight: 800; color: var(--fg-strong); display: flex; align-items: center; gap: 7px; }
.hero-s { font-size: var(--fs-sm); color: var(--fg-dim); line-height: 1.8; margin: 7px 0 13px; }
.heropaths { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.herocard {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev);
  cursor: pointer; transition: border-color .13s, background .13s, transform .1s;
}
.herocard:hover { border-color: var(--accent); background: var(--bg-hover); transform: translateX(2px); }
.herocard .hic { font-size: 19px; flex: none; line-height: 1.3; }
.herocard .hct { font-size: var(--fs-md); font-weight: 700; color: var(--accent); line-height: 1.55; }
.herocard .hcd { font-size: var(--fs-sm); color: var(--fg-dim); line-height: 1.7; margin-top: 2px; }
.herochips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.herochips .chip {
  border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--fg);
  border-radius: 14px; padding: 3px 11px; cursor: pointer; font-size: var(--fs-sm); white-space: nowrap;
  transition: background .13s, border-color .13s, color .13s;
}
.herochips .chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.heromods { display: flex; flex-wrap: wrap; gap: 5px; }
.heromods .modchip {
  font-family: var(--mono); font-size: var(--fs-sm); color: var(--fg-dim);
  border: 1px solid var(--border); background: var(--bg-elev); border-radius: var(--radius-sm);
  padding: 2px 8px; cursor: pointer; transition: background .13s, color .13s, border-color .13s;
}
.heromods .modchip:hover { background: var(--bg-active); color: var(--accent); border-color: var(--accent-dim); }
.heromods .modchip i { font-style: normal; color: var(--fg-faint); font-size: var(--fs-xs); margin-left: 4px; }

/* ============================================================
 *  主区
 * ============================================================ */
main { flex: 1; display: flex; min-height: 0; }

aside {
  width: var(--aside-w); flex: none; background: var(--bg-elev);
  border-right: 1px solid var(--border); overflow-y: auto; overscroll-behavior: contain;
}

/* 列表项 */
.item {
  padding: 9px 13px; border-bottom: 1px solid var(--border-soft);
  cursor: pointer; transition: background .1s; position: relative;
}
.item:hover { background: var(--bg-hover); }
.item.active { background: var(--bg-active); }
.item.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
}
.item .fn {
  font-family: var(--mono); font-size: var(--fs-md); color: var(--fg-strong);
  font-weight: 600; line-height: 1.55; word-break: break-word;
}
.item .fd {
  font-size: var(--fs-sm); color: var(--fg-dim); margin-top: 3px; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item.fav-on .fn::after { content: " ★"; color: var(--warn); }

/* 徽章 */
.badge {
  display: inline-block; font-size: var(--fs-xs); background: var(--bg-inset);
  color: var(--fg-dim); border: 1px solid var(--border-soft);
  border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px;
  font-family: var(--sans); font-weight: 600; white-space: nowrap;
}
.badge.btype { background: var(--violet-bg); color: var(--violet); border-color: var(--violet-border); }
.badge.btype.raw { background: var(--bg-inset); color: var(--fg-faint); border-color: var(--border-soft); }
.badge.btype.flow { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.badge.btype.guide { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); font-weight: 700; }
.badge.btype.datasheet { background: var(--info-bg); color: var(--info); border-color: var(--info-border); font-weight: 700; }

/* 搜索高亮 */
mark.hl { background: var(--mark-bg); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; font-weight: 700; }

/* 命中原因条 */
.hitreason {
  font-size: var(--fs-xs); color: var(--fg-faint); margin-top: 4px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.hitreason .rtag {
  background: var(--accent-bg); color: var(--accent-fg); border-radius: 3px; padding: 0 5px;
  font-weight: 700; border: 1px solid var(--accent-dim);
}
.hitreason .rtag.lvl2 { background: var(--bg-inset); color: var(--fg-faint); border-color: var(--border-soft); }

/* ============================================================
 *  详情
 * ============================================================ */
section { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 30px 60px; overscroll-behavior: contain; position: relative; }
.detail { max-width: 1080px; }

.detail .dhead { position: sticky; top: -22px; z-index: 8; background: var(--bg);
  padding: 8px 0 12px; margin: -8px 0 4px; border-bottom: 1px solid var(--border-soft); }
.detail h2 {
  font-family: var(--mono); font-size: var(--fs-2xl); color: var(--fg-strong);
  line-height: 1.35; word-break: break-word; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.detail h2 .title { font-family: var(--mono); }
.dh-actions { position: absolute; right: 0; top: 10px; display: flex; gap: 6px; }

.detail .purpose { font-size: var(--fs-base); color: var(--fg); margin: 14px 0 6px; line-height: 1.8; }
.detail h3 {
  font-size: var(--fs-md); color: var(--accent); margin: 20px 0 9px;
  padding-left: 9px; border-left: 3px solid var(--accent);
  display: flex; align-items: center; gap: 7px;
}
.detail h3 .h3ic { font-size: var(--fs-md); }

/* 目录（长内容锚点） */
.toc {
  position: sticky; top: 62px; z-index: 7; float: right; width: 172px;
  margin: 0 0 14px 18px; background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px;
  font-size: var(--fs-sm); box-shadow: var(--shadow-sm); max-height: 60vh; overflow-y: auto;
}
.toc .tt { font-size: var(--fs-xs); font-weight: 700; color: var(--fg-faint); letter-spacing: .5px;
  text-transform: uppercase; margin-bottom: 6px; }
.toc a { display: block; color: var(--fg-dim); text-decoration: none; padding: 3px 6px; border-radius: 4px;
  line-height: 1.5; cursor: pointer; border-left: 2px solid transparent; }
.toc a:hover { background: var(--bg-hover); color: var(--accent); }
.toc a.on { color: var(--accent); border-left-color: var(--accent); background: var(--bg-hover); font-weight: 600; }

/* 代码块 */
pre.code {
  background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 11px 13px; font-family: var(--mono); font-size: var(--fs-sm);
  line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--code-fg);
  overflow-x: auto; position: relative;
}
.codewrap { position: relative; }
.codewrap:hover .copybtn { opacity: 1; }
.copybtn {
  border: 1px solid var(--border-strong); background: var(--bg-elev-2); color: var(--fg-dim);
  border-radius: var(--radius-sm); font-size: var(--fs-xs); padding: 3px 9px; cursor: pointer;
  position: absolute; right: 8px; top: 8px; opacity: 0; transition: opacity .15s, background .13s;
  backdrop-filter: blur(4px);
}
.copybtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.copybtn.always { opacity: 1; }

/* 表格 */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table.params { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
table.params th, table.params td {
  border-bottom: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft);
  padding: 8px 10px; text-align: left; vertical-align: top; line-height: 1.65;
}
table.params tr:last-child td { border-bottom: 0; }
table.params th:last-child, table.params td:last-child { border-right: 0; }
table.params thead th { background: var(--bg-elev-2); color: var(--accent); font-weight: 700;
  position: sticky; top: 0; z-index: 2; white-space: nowrap; }
table.params tbody tr:hover { background: var(--bg-hover); }
table.params td.pname { font-family: var(--mono); color: var(--danger); white-space: nowrap; font-weight: 600; }
table.params td.pval { font-family: var(--mono); color: var(--ok); font-size: var(--fs-sm); word-break: break-word; }

/* 各种盒子 */
.ret { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius-sm);
  padding: 10px 13px; font-size: var(--fs-md); line-height: 1.8; }
.usebox { background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 13px; font-size: var(--fs-md); }
.useitem { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; flex-wrap: wrap; }
.usetag { display: inline-block; min-width: 60px; text-align: center; border-radius: 4px;
  padding: 1px 7px; font-size: var(--fs-xs); color: #fff; font-weight: 600; flex: none; }
.usetag.t-proj { background: var(--ok); }
.usetag.t-ref { background: var(--fg-faint); }
.usekind { display: inline-block; border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 0 6px; font-size: var(--fs-xs); color: var(--fg-dim); }
.usekind.k-call { border-color: var(--ok-border); color: var(--ok); background: var(--ok-bg); }
.usekind.k-def { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-bg); }
.usepath { font-family: var(--mono); color: var(--accent); font-size: var(--fs-sm); }
.usenote { font-size: var(--fs-sm); color: var(--fg-faint); margin-top: 7px; line-height: 1.7; }
.relbox { background: var(--ok-bg); border: 1px solid var(--ok-border); border-radius: var(--radius-sm);
  padding: 10px 13px; font-size: var(--fs-md); line-height: 2; }
.jumplink { color: var(--accent); font-family: var(--mono); font-weight: 600; cursor: pointer;
  text-decoration: none; border-bottom: 1px dashed var(--accent-dim); }
.jumplink:hover { color: var(--accent-strong); border-bottom-style: solid; }
.empty { color: var(--fg-faint); text-align: center; padding: 50px 20px; line-height: 2; font-size: var(--fs-md); }
.footer-note { font-size: var(--fs-sm); color: var(--fg-faint); margin-top: 26px; line-height: 1.9;
  border-top: 1px dashed var(--border); padding-top: 12px; }
kbd { background: var(--bg-inset); border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 1px 6px; font-size: var(--fs-xs); font-family: var(--mono); color: var(--fg-dim);
  box-shadow: 0 1px 0 var(--border); }

/* ============================================================
 *  引导向导
 * ============================================================ */
.guide-wrap { max-width: 1080px; }
.guide-progress {
  position: sticky; top: -22px; z-index: 5; background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 15px; margin-bottom: 15px;
  box-shadow: var(--shadow-sm);
}
.guide-progress .bar { height: 7px; background: var(--bg-inset); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.guide-progress .bar > i { display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--warn), var(--ok)); transition: width .3s; }
.guide-progress .txt { font-size: var(--fs-md); color: var(--accent); font-weight: 700; }
.guide-progress .hint { font-size: var(--fs-sm); color: var(--fg-faint); margin-top: 6px; }

.gstep { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px;
  background: var(--bg-elev); overflow: hidden; }
.gstep > .hd { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; cursor: pointer; }
.gstep > .hd:hover { background: var(--bg-hover); }
.gstep.done > .hd { background: var(--ok-bg); }
.gstep.done > .hd .num { background: var(--ok); }
.gstep > .hd .num {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-dim);
  color: #fff; font-size: var(--fs-sm); font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.gstep > .hd .ttl { flex: 1; font-size: var(--fs-md); font-weight: 700; color: var(--fg-strong); line-height: 1.55; }
.gstep.done > .hd .ttl { color: var(--ok); }
.gstep > .hd .arrow { flex: none; color: var(--fg-faint); font-size: var(--fs-sm); padding-top: 4px;
  transition: transform .18s; }
.gstep.open > .hd .arrow { transform: rotate(90deg); }
.gstep > .bd { display: none; padding: 2px 15px 15px; border-top: 1px solid var(--border-soft); }
.gstep.open > .bd { display: block; }
.gstep .lbl { font-size: var(--fs-sm); font-weight: 800; color: var(--accent); margin: 14px 0 6px;
  padding-left: 8px; border-left: 3px solid var(--accent); }
.gstep .lbl.warn { color: var(--warn); border-left-color: var(--warn); }
.gstep .lbl.ok { color: var(--ok); border-left-color: var(--ok); }
.gstep .txt { font-size: var(--fs-md); line-height: 1.9; color: var(--fg); white-space: pre-line; }
.gstep .txt.warnbox { background: var(--warn-bg); border: 1px solid var(--warn-border);
  border-radius: var(--radius-sm); padding: 10px 12px; }
.gstep .txt.okbox { background: var(--ok-bg); border: 1px solid var(--ok-border);
  border-radius: var(--radius-sm); padding: 10px 12px; }
.gstep .rel { margin-top: 13px; font-size: var(--fs-sm); line-height: 2; }
.gstep .mkbtns { display: flex; gap: 9px; margin-top: 14px; flex-wrap: wrap; }
.gstep .mkbtns button, .btn {
  border: 1px solid var(--border-strong); background: var(--bg-elev-2); color: var(--fg-dim);
  border-radius: var(--radius-sm); font-size: var(--fs-md); padding: 6px 15px; cursor: pointer;
  transition: background .13s, color .13s, border-color .13s; font-weight: 600;
}
.gstep .mkbtns button:hover, .btn:hover { background: var(--bg-hover); color: var(--fg-strong);
  border-color: var(--accent-dim); }
.gstep .mkbtns button.pri, .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.gstep .mkbtns button.pri:hover, .btn.pri:hover { background: var(--accent-strong); }
.gstep .mkbtns button.pri.done { background: var(--ok); border-color: var(--ok); }
.btn.sm { padding: 4px 10px; font-size: var(--fs-sm); }

/* ============================================================
 *  教程 / 阶段卡片
 * ============================================================ */
.gcard {
  border: 1px solid var(--border); border-left: 3px solid var(--warn);
  border-radius: var(--radius); background: var(--bg-elev);
  padding: 14px 16px; margin-bottom: 11px; cursor: pointer; transition: background .13s, border-color .13s;
}
.gcard:hover { background: var(--bg-hover); border-color: var(--warn); }
.gcard.active { border-color: var(--accent); border-left-color: var(--accent); background: var(--bg-active); }
.gcard .gt { font-size: var(--fs-lg); font-weight: 700; color: var(--fg-strong); margin-bottom: 6px; line-height: 1.5; }
.gcard .gd { font-size: var(--fs-md); color: var(--fg-dim); line-height: 1.8; margin-bottom: 8px; }
.gcard .gm { font-size: var(--fs-sm); color: var(--fg-faint); line-height: 1.7; }
.gcard .gm b { color: var(--warn); }
.guide-empty { color: var(--fg-faint); text-align: center; padding: 36px 12px; font-size: var(--fs-md); line-height: 2.1; }
.guide-empty b { color: var(--accent); }

.searchhint {
  font-size: var(--fs-sm); color: var(--accent); margin: 0 0 11px;
  background: var(--accent-bg); border: 1px solid var(--accent-dim);
  border-radius: var(--radius-sm); padding: 9px 12px; cursor: pointer;
}
.searchhint:hover { border-color: var(--accent); }

/* 跨板块：资料里没结果、教程里有 → 置顶推荐卡 */
.grpcard {
  margin: 0 0 12px; border: 1px solid var(--warn-border);
  border-radius: var(--radius); background: var(--warn-bg); overflow: hidden;
}
.grpcard .grphead {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; font-size: var(--fs-sm); font-weight: 700; color: var(--warn);
  border-bottom: 1px solid var(--warn-border); line-height: 1.5;
}
.grpcard .grphead .hgtxt { flex: 1; min-width: 0; }
.grpcard .grphead b { color: var(--warn); font-size: var(--fs-md); }
.grpcard .grphead .btn { flex: none; }
.grpcard .grprow { padding: 10px 13px; cursor: pointer; border-bottom: 1px solid var(--warn-border); }
.grpcard .grprow:last-child { border-bottom: 0; }
.grpcard .grprow:hover { background: var(--bg-hover); }
.grpcard .grprow .gt { font-size: var(--fs-md); font-weight: 700; color: var(--fg-strong); line-height: 1.6; }
.grpcard .grprow .gd { font-size: var(--fs-sm); color: var(--fg-dim); line-height: 1.75; margin-top: 5px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* 宽泛词提示条 */
.broadhint {
  font-size: var(--fs-sm); color: var(--warn); margin: 0 0 11px;
  background: var(--warn-bg); border: 1px solid var(--warn-border);
  border-radius: var(--radius-sm); padding: 9px 12px; line-height: 1.75;
}
.broadhint b { color: var(--warn); }
.broadhint .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.broadhint .chip {
  border: 1px solid var(--warn-border); background: var(--bg-elev-2); color: var(--fg);
  border-radius: 14px; padding: 2px 11px; cursor: pointer; font-size: var(--fs-sm); white-space: nowrap;
}
.broadhint .chip:hover { background: var(--warn); color: #1c1200; border-color: var(--warn); }

/* 分组折叠头（资料查询里把原型沉底） */
.grouphead {
  font-size: var(--fs-sm); font-weight: 700; color: var(--fg-dim);
  padding: 10px 13px 7px; background: var(--bg-inset); border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 7px; cursor: pointer; position: sticky; top: 0; z-index: 3;
}
.grouphead:hover { color: var(--fg-strong); }
.grouphead .caret { transition: transform .16s; font-size: 10px; }
.grouphead.collapsed .caret { transform: rotate(-90deg); }
.grouphead .gcnt { color: var(--fg-faint); font-weight: 500; }

/* 返回按钮（手机） */
.backbtn {
  display: none; width: 100%; text-align: left; background: var(--bg-elev);
  border: 1px solid var(--border); color: var(--accent); border-radius: var(--radius);
  padding: 11px 13px; font-size: var(--fs-base); margin-bottom: 13px; cursor: pointer;
  position: sticky; top: -22px; z-index: 9; font-weight: 600;
}
.backbtn:active { background: var(--bg-hover); }

/* ============================================================
 *  面板（收藏 / 最近 / 快捷键）
 * ============================================================ */
.panel {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
  display: none; align-items: flex-start; justify-content: center; padding: 60px 16px 24px;
  backdrop-filter: blur(2px);
}
.panel.show { display: flex; }
.panel .pbox {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg);
  width: 100%; max-width: 720px; max-height: 78vh; overflow-y: auto; box-shadow: var(--shadow-lg);
}
.panel .ph { display: flex; align-items: center; gap: 10px; padding: 15px 18px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-elev); z-index: 2; }
.panel .ph h3 { flex: 1; font-size: var(--fs-lg); font-weight: 700; color: var(--fg-strong);
  border: 0; padding: 0; margin: 0; display: block; }
.panel .ph button { border: 0; background: transparent; color: var(--fg-faint); cursor: pointer;
  font-size: 21px; line-height: 1; padding: 2px 7px; border-radius: 5px; }
.panel .ph button:hover { background: var(--bg-hover); color: var(--fg); }
.panel .pbody { padding: 15px 18px 22px; }
.panel .prow { display: flex; align-items: baseline; gap: 9px; padding: 9px 11px;
  border-radius: var(--radius-sm); cursor: pointer; line-height: 1.6; }
.panel .prow:hover { background: var(--bg-hover); }
.panel .prow .pn { font-family: var(--mono); font-size: var(--fs-md); color: var(--fg-strong);
  font-weight: 600; flex: none; }
.panel .prow .pd { font-size: var(--fs-sm); color: var(--fg-dim); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel .prow .pdel { border: 0; background: transparent; color: var(--fg-faint); cursor: pointer;
  font-size: 15px; padding: 2px 6px; border-radius: 4px; flex: none; }
.panel .prow .pdel:hover { background: var(--danger-bg); color: var(--danger); }
.panel .pempty { color: var(--fg-faint); text-align: center; padding: 34px 10px; font-size: var(--fs-md); line-height: 2; }
.kbdlist { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-items: baseline; }
.kbdlist dt { text-align: right; white-space: nowrap; }
.kbdlist dd { color: var(--fg-dim); font-size: var(--fs-md); }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
  background: var(--bg-elev-2); color: var(--fg); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 10px 18px; font-size: var(--fs-md);
  box-shadow: var(--shadow-lg); z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 回到顶部 */
#totop {
  position: fixed; right: 18px; bottom: 22px; z-index: 30;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--bg-elev-2); color: var(--fg-dim); cursor: pointer; font-size: 17px;
  display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
}
#totop:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
#totop.show { display: flex; }

/* 页脚数据版本戳（H2）：固定左下，显示「数据版本 + 导出时间」。
   手机端每改一次数据要把整份单文件重传一遍 —— 有这个戳就能一眼看出手上这份是不是最新的。
   内容由 rebuild 链写进 data_build_info.js（tools/export_json.js 生成），不手改。 */
#buildstamp {
  position: fixed; left: 12px; bottom: 10px; z-index: 30;
  font-size: 11px; color: var(--fg-faint);
  background: var(--bg-elev-2); border: 1px solid var(--border-soft);
  border-radius: 6px; padding: 2px 8px; opacity: .78; pointer-events: none;
}

/* ============================================================
 *  响应式
 * ============================================================ */
@media (max-width: 1240px) { :root { --aside-w: 300px; } .toc { display: none; } }
@media (max-width: 1000px) {
  :root { --aside-w: 262px; }
  .brand h1 small { display: none; }
  section { padding: 18px 22px 50px; }
}

/* ---- 手机 / 窄屏：单列双页 ---- */
@media (max-width: 760px) {
  :root { --fs-2xl: 19px; --fs-xl: 17px; }
  header { position: sticky; top: 0; }
  .hrow { padding: 7px 10px; gap: 7px; }
  .brand { order: 1; flex: 1 1 0; min-width: 0; }
  .brand h1 { font-size: var(--fs-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar { order: 2; flex: none; }
  .iconbtn { width: 30px; height: 30px; font-size: 14px; }
  .hspace { display: none; }
  .tabs { order: 3; flex: 1 1 100%; width: 100%; padding: 3px; margin-top: 2px; }
  .tabs button { flex: 1 1 0; justify-content: center; padding: 8px 3px; font-size: var(--fs-sm); gap: 4px; min-width: 0; }
  .tabs button .tcount { display: none; }
  .searchwrap { order: 1; flex: 1 1 100%; min-width: 0; }
  #q { padding: 10px 32px 10px 32px; font-size: 16px; }   /* 16px 防 iOS 缩放 */
  .hrow:nth-child(2) { padding-top: 0; }
  .selectwrap { order: 2; flex: 1 1 auto; min-width: 0; }
  .selectwrap > .slab { display: none; }
  select { padding: 8px 26px 8px 9px; font-size: var(--fs-sm); width: 100%; max-width: none; }
  #modwrap, #projwrap { flex: 1 1 auto; }
  #count { order: 3; flex: none; font-size: var(--fs-xs); text-align: right; white-space: nowrap; }
  #cntRef, #cntGuide, #cntBuild { display: none; }

  main { flex-direction: column; }
  aside { width: 100%; flex: 1 1 auto; border-right: 0; border-bottom: 0; }
  section { padding: 13px 14px 60px; display: none; }
  body.show-detail aside { display: none; }
  body.show-detail section { display: block; flex: 1 1 auto; }
  .backbtn { display: block; }
  .detail .dhead { top: -13px; padding-top: 4px; }
  .detail h2 { font-size: var(--fs-xl); }
  .detail h2 .title { flex: 1 1 100%; order: 3; }
  .dh-actions { position: static; margin-top: 8px; }
  table.params th, table.params td { padding: 7px 8px; font-size: var(--fs-sm); }
  pre.code { font-size: var(--fs-xs); }
  .gstep .mkbtns button { flex: 1; }
  .guide-progress { top: -13px; }
  #totop { right: 12px; bottom: 14px; }
  .panel { padding: 20px 10px 14px; }
  .hero { padding: 12px 12px 13px; }
  .heropaths { gap: 7px; }
  .grpcard .grphead { font-size: var(--fs-xs); }
}

@media print {
  aside, .tabs, .toolbar, .searchwrap, .selectwrap, #totop, .backbtn { display: none !important; }
  body { overflow: visible; height: auto; background: #fff; color: #000; }
  main, section { display: block !important; overflow: visible; padding: 0; }
  .detail .dhead { position: static; }
}
</style>
<style>
/* ============================================================
 *  手机版专用样式（只对手机版生效）
 *  ------------------------------------------------------------
 *  构建时 build_mobile.py 会给 <html> 打上 data-platform="mobile"；
 *  桌面浏览器打开网页版时没有这个属性，所以下面全部不影响网页版。
 *  这一版按手机端重做：底部固定导航、44px 热区、字号三档、安全区、点击反馈；
 *  并去掉桌面专属的"快捷键"入口（手机没有键盘）。
 * ============================================================ */
html[data-platform="mobile"] #btnHelp,
html[data-platform="mobile"] #panelHelp { display: none !important; }
/* 手机上没键盘：任何 <kbd> 与快捷键提示一律不显示（通用规则，别再逐个 ID 打补丁） */
html[data-platform="mobile"] kbd { display: none !important; }

/* 字号三档（默认中档，构建脚本不写 data-fs，由手机版脚本设置） */
html[data-platform="mobile"][data-fs="s"] {
  --fs-xs:10.5px; --fs-sm:11.5px; --fs-md:12.5px; --fs-base:13px;
  --fs-lg:15px; --fs-xl:17px; --fs-2xl:21px; }
html[data-platform="mobile"][data-fs="l"] {
  --fs-xs:13px; --fs-sm:14.5px; --fs-md:16px; --fs-base:16.5px;
  --fs-lg:19px; --fs-xl:21.5px; --fs-2xl:26px; }

/* 底部固定导航：把原来顶部的三个板块标签移到屏幕底部（单手可达） */
html[data-platform="mobile"] .tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 40; width: auto; margin: 0;
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  background: var(--bg-elev-2);
  border-top: 1px solid var(--bg-active);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: 0 -6px 18px rgba(0,0,0,.28);
}
html[data-platform="mobile"] .tabs button {
  flex: 1 1 0; min-height: 52px; justify-content: center; gap: 5px;
  font-size: var(--fs-sm); border-radius: var(--radius-sm);
}
html[data-platform="mobile"] main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }

/* 热区：手指点得准（按钮 ≥44px；列表项加高） */
html[data-platform="mobile"] .iconbtn { width: 44px; height: 44px; font-size: 19px; }
html[data-platform="mobile"] .item,
html[data-platform="mobile"] .gcard { padding: 12px 11px; }
html[data-platform="mobile"] .panel .pbody button { min-height: 44px; }
html[data-platform="mobile"] .gstep .mkbtns button { min-height: 44px; }
html[data-platform="mobile"] .backbtn { min-height: 40px; font-size: var(--fs-md); }

/* 手机手感：去掉点击高亮、滚动自带惯性、别把整页拖着跑 */
html[data-platform="mobile"] { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
html[data-platform="mobile"] #list,
html[data-platform="mobile"] #detail { -webkit-overflow-scrolling: touch; }
html[data-platform="mobile"] header { position: sticky; top: 0; z-index: 30; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="logo">ST</div>
      <h1>STM32F4 速查<small>SPL + FreeRTOS 离线手册</small></h1>
    </div>
    <div class="tabs" id="tabs">
      <button data-sec="ref" class="active">📖 资料查询 <span class="tcount" id="cntRef">0</span></button>
      <button data-sec="guide">📚 引导教程 <span class="tcount" id="cntGuide">0</span></button>
      <button data-sec="build">🧭 项目引导 <span class="tcount" id="cntBuild">0</span></button>
    </div>
    <div class="hspace"></div>
    <div class="toolbar">
      <button class="iconbtn" id="btnFav" title="收藏夹（Ctrl+B）">★<span class="bdg" id="favBadge" style="display:none">0</span></button>
      <button class="iconbtn" id="btnRecent" title="最近查看（Ctrl+H）">🕘</button>
      <button class="iconbtn" id="btnTheme" title="切换主题（Ctrl+J）">🌗</button>
      <button class="iconbtn" id="btnHelp" title="快捷键（?）">?</button>
    </div>
  </div>
  <div class="hrow">
    <div class="searchwrap" id="searchwrap">
      <span class="sicon">🔍</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="中文 / 英文 / 混排都能搜（如: 打开DMA中断、串口 中断、USART_Init）">
      <button id="clearq" title="清空（Esc）">×</button>
    </div>
    <div class="selectwrap" id="modwrap">
      <span class="slab" id="modlab">模块</span>
      <select id="mod"><option value="">全部模块</option></select>
    </div>
    <div class="selectwrap" id="projwrap" style="display:none">
      <span class="slab" id="projlab">工程</span>
      <select id="proj"></select>
    </div>
    <span id="count"></span>
  </div>
</header>
<main>
  <aside id="list"></aside>
  <section id="detail"></section>
</main>
<button id="totop" title="回到顶部">↑</button>
<div id="toast"></div>
<div id="buildstamp"></div>

<div class="panel" id="panelFav">
  <div class="pbox">
    <div class="ph"><h3>★ 收藏夹</h3>
      <button id="favClear" title="清空收藏" style="font-size:12px;padding:4px 9px">清空</button>
      <button data-close="panelFav">×</button></div>
    <div class="pbody" id="favBody"></div>
  </div>
</div>
<div class="panel" id="panelRecent">
  <div class="pbox">
    <div class="ph"><h3>🕘 最近查看</h3>
      <button data-close="panelRecent">×</button></div>
    <div class="pbody" id="recentBody"></div>
  </div>
</div>
<div class="panel" id="panelHelp">
  <div class="pbox">
    <div class="ph"><h3>⌨ 快捷键</h3><button data-close="panelHelp">×</button></div>
    <div class="pbody">
      <dl class="kbdlist">
        <dt><kbd>/</kbd></dt><dd>聚焦搜索框</dd>
        <dt><kbd>Esc</kbd></dt><dd>清空搜索 / 收起详情返回列表 / 关闭弹窗</dd>
        <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>在列表中上下选择条目</dd>
        <dt><kbd>Enter</kbd></dt><dd>打开当前选中的条目</dd>
        <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>切换板块（资料查询 / 引导教程 / 项目引导）</dd>

"use strict";

/* ============================================================
 *  STM32F4 标准库速查 —— 引擎
 *  ------------------------------------------------------------
 *  数据来源（外部 data*.js）：
 *    STD_LIB / STD_EXTRA  —— 手写详解
 *    STD_FULL / STD_STRUCTS —— 自动收录原型
 *    STD_TABLES / STD_TABLES2 —— 查找表
 *    STD_FLOW            —— 初始化流程卡
 *    STD_GUIDE           —— 引导向导
 *    STD_BUILD_GUIDE + STD_BUILD_B1/B2/QT —— 项目引导阶段
 *    STD_DATASHEET       —— 器件数据手册卡
 *    STD_DOC             —— 官方注释解析出的参数/返回值
 *    CN_NOTES / CN_FIELDS —— 自动条目的中文补全
 *    CARD_REL / STD_USAGE / CN_DEMO —— 联动 / 用法 / 示例
 * ============================================================ */
const ALL = [];
const seen = new Set();
const $ = (id) => document.getElementById(id);

/* ---------- 排序等级 ---------- */
function orderOf(f) {
  /* A2：阶段卡（带 _b，只在「项目引导」板块里显示）自带「阶段 N」序号 —— 拿它当真序号，
     不再靠 data_*.js 的数组顺序（重导顺序一变，阶段顺序就乱）。
     它们只跟同板阶段卡一起排，所以给 0..9 不会扰动「资料查询 / 引导」两块的顺序与搜索基线。 */
  if (f._t === "guide") {
    const m = /阶段\s*(\d+)/.exec(f.n || "");
    return m ? Number(m[1]) : -2;
  }
  if (f._t === "flow") return -1;
  if (f._t === "datasheet") return 0;
  if (f._t === "chip" || f._t === "table") return 9;
  if (f._t === "struct") return 1;
  if (f._src === "autostruct") return 2;
  if (/Init$/.test(f.n)) return 3;
  if (/(Cmd|ITConfig|LSEConfig|HSEConfig|HSIConfig)$/.test(f.n)) return 4;
  return 5;
}
const BIG_TABLE_RE = /^(中断向量表|标志宏表|中断宏表|时钟使能表|复用功能表|EXTI 中断线表|NVIC 优先级分组表|FLASH 扇区表|RTC 唤醒时钟分频表|DMA 请求映射表)/;

function pushCard(f, src, t) {
  if (seen.has(f.n)) return;
  seen.add(f.n);
  f._i = ALL.length;
  f._src = src;
  f._t = f.t || t;
  const steps = (f.f && f.f.length) ? f.f.map(x => Array.isArray(x) ? x.join(" ") : String(x)).join(" ") : "";
  const relTxt = (f.rel && f.rel.length) ? f.rel.map(x => Array.isArray(x) ? x.join(" ") : String(x)).join(" ") : "";
  const aTxt = (f.a && f.a.length) ? f.a.map(p => Array.isArray(p) ? p.join(" ") : String(p)).join(" ") : "";
  const hTxt = (f.h && f.h.length) ? (Array.isArray(f.h) ? f.h.join(" ") : String(f.h)) : "";
  f._hay = [f.n, f.d || "", f.k || "", f.m, f.r || "", f.s || "", f.g || "", steps, relTxt, aTxt, hTxt]
    .join(" ").toLowerCase();
  f._ord = orderOf(f);
  ALL.push(f);
}

/* 手写优先 → 自动原型 → 结构体 → 查找表 → 流程卡 → 向导 → 手册卡 → 项目引导 */
if (typeof STD_LIB !== "undefined")       STD_LIB.forEach(f => pushCard(f, "core", "func"));
if (typeof STD_EXTRA !== "undefined")     STD_EXTRA.forEach(f => pushCard(f, "core", "func"));
if (typeof STD_FULL !== "undefined")      STD_FULL.forEach(f => pushCard(f, "auto", "func"));
if (typeof STD_STRUCTS !== "undefined")   STD_STRUCTS.forEach(st => pushCard(
  { m: st.m, n: st.n, t: "struct", p: "结构体（自动收录，字段顺序与标准库一致）", f: st.f }, "autostruct", "struct"));
if (typeof STD_TABLES !== "undefined")    STD_TABLES.forEach(t => pushCard(t, "core", "table"));
if (typeof STD_FLOW !== "undefined")      STD_FLOW.forEach(f => pushCard(f, "core", "flow"));
if (typeof STD_GUIDE !== "undefined")     STD_GUIDE.forEach(f => pushCard(f, "core", "guide"));
if (typeof STD_DATASHEET !== "undefined") STD_DATASHEET.forEach(f => pushCard(f, "core", "datasheet"));
if (typeof STD_BUILD_GUIDE !== "undefined") STD_BUILD_GUIDE.forEach(f => pushCard(f, "core", "guide"));
/* data_tables2.js 的补充查找表：只在 STD_TABLES 里没有同名时才进 */
if (typeof STD_TABLES2 !== "undefined")   STD_TABLES2.forEach(t => pushCard(t, "core", "table"));

/* 挂载使用位置 / 联动 / 示例 / 文档 */
if (typeof STD_USAGE !== "undefined") ALL.forEach(f => { if (STD_USAGE[f.n]) f.u = STD_USAGE[f.n]; });
if (typeof CARD_REL !== "undefined") ALL.forEach(f => { if (!f.rel && CARD_REL[f.n]) f.rel = CARD_REL[f.n]; });
if (typeof CN_DEMO !== "undefined") ALL.forEach(f => { if (!f.e && CN_DEMO[f.n]) f.e = CN_DEMO[f.n]; });

if (typeof STD_DOC !== "undefined") {
  ALL.forEach(f => {
    const d = STD_DOC[f.n];
    if (!d) return;
    if ((!f.a || !f.a.length) && d.a && d.a.length) {
      f.a = d.a.map(pa => {
        if (!Array.isArray(pa)) return ["", "", String(pa)];
        return [pa[0] + "  [" + (pa[1] || "") + "]", pa[3] || "", pa[2] || ""];
      });
      f._docA = d.a;
    }
    if (!f.r && d.r) f.r = d.r;
    if (!f.d && d.b) f.d = d.b;
    if (d.a && d.a.length) {
      f._hay += " " + d.a.map(pa => Array.isArray(pa) ? (pa[0] + " " + pa[2] + " " + (pa[3] || "")) : String(pa)).join(" ").toLowerCase();
    }
    if (d.r) f._hay += " " + d.r.toLowerCase();
    if (d.b) f._hay += " " + d.b.toLowerCase();
    f._hasDoc = true;
  });
}

/* ============================================================
 *  本机存储（收藏 / 最近 / 进度 / 偏好）
 * ============================================================ */
const STORE_KEY = "stm32spm.v2";
const DB = {
  fav: [], recent: [], prog: {}, theme: "auto", sec: "ref", mod: {}, last: null,
  openGroups: {},
};
function dbLoad() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) Object.assign(DB, JSON.parse(raw));
  } catch (e) { /* 隐私模式 / 配额满：静默降级 */ }
}
let dbTimer = null;
function dbSave() {
  clearTimeout(dbTimer);
  dbTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
  }, 220);
}

/* ============================================================
 *  类型标签 / 中文补全
 * ============================================================ */
function typeLabel(f) {
  if (f._t === "guide") return "引导";
  if (f._t === "flow") return "流程";
  if (f._t === "chip") return "芯片对照";
  if (f._t === "datasheet") return "数据手册";
  if (f._t === "table") return "查找表";
  if (f._t === "struct") return f._src === "autostruct" ? "结构体" : "结构体";
  if (f._src === "auto") return "原型";
  return "详解";
}
function cnNote(f) { return (typeof CN_NOTES !== "undefined" && CN_NOTES[f.n]) || ""; }
function cnField(sn, fn) { return (typeof CN_FIELDS !== "undefined" && CN_FIELDS[structName_(sn, fn)]) || ""; }
function structName_(sn, fn) { return sn + "." + fn; }

function guessUse(f) {
  const n = f.n, m = f.m;
  if (/StructInit$/.test(n)) return m + "：把结构体填成默认值（初始化前先清零用）";
  if (/DeInit$/.test(n)) return m + "：把外设复位回默认状态（重新配置前先复位）";
  if (/Init$/.test(n)) return m + "：初始化该外设（配置前先开对应时钟）";
  if (/ITConfig$/.test(n)) return m + "：打开/关闭某个中断源（之后还要 NVIC_Init 使能）";
  if (/Cmd$/.test(n)) return m + "：使能/关闭该外设（参数填 ENABLE / DISABLE）";
  if (/GetITStatus$/.test(n)) return m + "：中断里判断是哪个中断源触发（返回 SET / RESET）";
  if (/ClearITPendingBit$/.test(n)) return m + "：清除中断挂起位（中断处理完要清）";
  if (/GetFlagStatus$/.test(n)) return m + "：查询状态标志（返回 SET / RESET，轮询常用）";
  if (/ClearFlag$/.test(n)) return m + "：清除状态标志（防误触发）";
  if (/SendData$/.test(n)) return m + "：发送一个数据（发前等 TXE、发完等 TC）";
  if (/ReceiveData$/.test(n)) return m + "：读取收到的数据";
  if (/Config$/.test(n)) return m + "：配置该外设相关参数";
  if (/Set[A-Z]/.test(n)) return m + "：设置某个值（运行时改参数常用）";
  if (/Get[A-Z]/.test(n)) return m + "：读取某个值/状态";
  if (/Read/.test(n)) return m + "：读取寄存器 / 数据";
  if (/Write/.test(n)) return m + "：写入寄存器 / 数据";
  if (/Enable$/.test(n)) return m + "：启动该功能";
  if (/Reset$/.test(n)) return m + "：复位该外设";
  return m + "：该外设的库函数（中文详解可看同模块紫色“详解”条目，或查官方头文件注释）";
}

function segCN(run) {
  const out = [];
  let i = 0;
  while (i < run.length) {
    let hit = '';
    for (let k = 0; k < SEG_DICT.length; k++) {
      const w = SEG_DICT[k];
      if (w.length <= run.length - i && run.startsWith(w, i)) { hit = w; break; }
    }
    if (hit) { out.push(hit); i += hit.length; continue; }
    let j = i + 1;
    while (j < run.length && !SEG_DICT.some(w => w.length <= run.length - j && run.startsWith(w, j))) j++;
    out.push(run.slice(i, j));
    i = j;
  }
  return out;
}

function tokenize(raw) {
  let s = String(raw == null ? '' : raw).trim().toLowerCase();
  if (!s) return [];
  s = s.replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
       .replace(/[\u3000\u00a0]/g, ' ')
       .replace(/([\u4e00-\u9fff])([0-9a-z])/g, '$1 $2')
       .replace(/([0-9a-z])([\u4e00-\u9fff])/g, '$1 $2')
       .replace(/[，。、；：！？（）【】《》""''·,.;:!?()[\]{}<>"']/g, ' ')
       .replace(/\s+/g, ' ');
  const out = [];
  s.split(' ').filter(Boolean).forEach(tok => {
    const fix = TYPO[tok] || tok;
    if (/^[\u4e00-\u9fff]+$/.test(fix)) {
      if (SEG_SET.has(fix)) out.push(fix);
      else segCN(fix).forEach(w => { if (w) out.push(w); });
    } else out.push(fix);
  });
  return out.filter((t, i) => t && out.indexOf(t) === i);
}

function nameTokens(f) {
  if (f._nt) return f._nt;
  const parts = [];
  String(f.n).split(/[^0-9A-Za-z\u4e00-\u9fff]+/).filter(Boolean).forEach(seg => {
    if (/[\u4e00-\u9fff]/.test(seg)) { parts.push(seg); return; }
    seg.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
       .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
       .split(/\s+/).filter(Boolean).forEach(p => parts.push(p));
  });
  f._nt = parts.map(p => p.toLowerCase());
  return f._nt;
}

const BOUND_RE = new Map();
function hasTok(text, t) {
  if (!t) return false;
  if (t.length > 3 || !/^[a-z0-9]+$/.test(t)) return text.indexOf(t) >= 0;
  let re = BOUND_RE.get(t);
  if (!re) { re = new RegExp('(^|[^a-z0-9])' + t + '([^a-z0-9]|$)'); BOUND_RE.set(t, re); }
  return re.test(text);
}

function dist1(a, b) {
  if (a === b) return false;
  if (a.length === b.length) {
    const d = [];
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d.push(i);
    if (d.length === 2 && d[1] === d[0] + 1 && a[d[0]] === b[d[1]] && a[d[1]] === b[d[0]]) return true;
  }
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++;
    else if (b.length > a.length) j++;
    else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}

function vocab() {

}
function nearWords(t) {
  if (NEAR_CACHE.has(t)) return NEAR_CACHE.get(t);
  const out = [];
  if (/^[a-z][a-z0-9]{3,11}$/.test(t)) {
    for (const v of vocab()) {
      if (Math.abs(v.length - t.length) > 1) continue;
      if (dist1(t, v)) { out.push(v); if (out.length >= 3) break; }
    }
  }
  NEAR_CACHE.set(t, out);
  return out;
}

const DF = new Map();
function dfOf(t) {
  if (DF.has(t)) return DF.get(t);
  let c = 0;
  for (let i = 0; i < ALL.length; i++) if (ALL[i]._hay.indexOf(t) >= 0) c++;
  DF.set(t, c);
  return c;
}
function weightOf(t) {
  const raw = 1 + 0.25 * Math.log((ALL.length + 1) / (1 + dfOf(t)));
  return Math.max(0.4, Math.min(2.0, raw));
}

function conceptsOf(w) {
  const out = [];
  const add = arr => arr.forEach(e => { if (out.indexOf(e) < 0) out.push(e); });
  const fixed = TYPO[w] || w;
  if (CONCEPT[fixed]) add(CONCEPT[fixed]);
  if (CONCEPT[w]) add(CONCEPT[w]);
  if (fixed.length >= 2) {
    Object.keys(CONCEPT)
      .filter(k => k.length >= 2 && k !== fixed && fixed.indexOf(k) >= 0)
      .sort((a, b) => b.length - a.length)
      .forEach(k => add(CONCEPT[k]));
  }
  return out;
}

function variantGroups(w) {
  const g = [];
  const add = x => { if (x && g.indexOf(x) < 0) g.push(x); };
  const fixed = TYPO[w] || w;
  add(w); add(fixed);
  (SYN[w] || []).forEach(add);
  (SYN[fixed] || []).forEach(add);
  conceptsOf(w).forEach(add);
  (ALIAS[w] || []).forEach(add);
  (ALIAS[fixed] || []).forEach(add);
  nearWords(fixed).forEach(add);
  g.slice().forEach(t => conceptsOf(t).forEach(add));
  return g;
}

function expandWords(rawWords) {
  const out = [];

}

function hitTier(f, group) {
  const nt = nameTokens(f);
  const nl = f._nl || (f._nl = f.n.toLowerCase());
  let best = 0;
  for (let i = 0; i < group.length; i++) {
    const t = group[i];
    if (!t) continue;
    const short = /^[a-z0-9]{1,3}$/.test(t);
    if (nt.indexOf(t) >= 0) { best = 3; break; }
    if (nt.some(x => t.length >= 3 && x.indexOf(t) === 0)) { if (best < 2) best = 2; continue; }
    if (!short && nl.indexOf(t) >= 0) { if (best < 2) best = 2; continue; }
    if (best < 1 && hasTok(f._hay, t)) best = 1;
  }
  return best;
}

function bagNear(hay, words, maxGap) {
  const pos = [];
  for (const w of words) {
    const i = hay.indexOf(w);
    if (i < 0) return 0;
    pos.push(i);
  }
  pos.sort((a, b) => a - b);
  let maxSpan = 0;
  for (let i = 1; i < pos.length; i++) maxSpan = Math.max(maxSpan, pos[i] - pos[i - 1]);
  if (pos.length > 1 && maxSpan > maxGap) return 0;
  return pos.length;
}

let CUR_G = [], CUR_W = [], CUR_REQ = [], CUR_HEADS = [], CUR_TOT = 1, CUR_REQTOT = 1, CUR_META = [];

function evalEntry(f) {
  let cov = 0, covReq = 0, sP = 0, sE = 0;
  const hits = [];
  for (let i = 0; i < CUR_G.length; i++) {
    const g = CUR_G[i];
    const pT = hitTier(f, [g[0]]);
    const eT = g.length > 1 ? hitTier(f, g.slice(1)) : 0;
    if (!pT && !eT) continue;
    const w = CUR_W[i];
    cov += w;
    if (CUR_REQ[i] && (pT >= 1 || eT >= 2)) covReq += w;
    sP += w * (pT >= 3 ? 70 : pT === 2 ? 40 : pT === 1 ? 18 : 0);
    sE += w * (eT >= 3 ? 28 : eT === 2 ? 16 : eT === 1 ? 6 : 0);
    hits.push({ i: i, tier: Math.max(pT, eT >= 2 ? 2 : eT), pT: pT, eT: eT });
  }
  const near = (CUR_HEADS.length > 1 && bagNear(f._hay, CUR_HEADS, 40)) ? 1 : 0;
  return {
    cov: CUR_TOT > 0 ? Math.min(1, cov / CUR_TOT) : 0,
    covReq: CUR_REQTOT > 0 ? Math.min(1, covReq / CUR_REQTOT) : 1,
    sP: sP, sE: sE, near: near, hits: hits,
  };
}

function scoreOf(f, words, e) {
  e = e || evalEntry(f);
  const nl = f._nl || (f._nl = f.n.toLowerCase());
  let s = e.sP + e.sE + e.cov * 30 + e.covReq * 20;
  if (e.near) s += 20;
  if (words.length > 1 && nl.indexOf(words.join("")) >= 0) s += 60;

  /* 类型权重：板块分离要干净 */
  if (f._t === "guide")  s += (SEC === "guide" ? 400 : -5000);
  else if (f._t === "flow") s += (SEC === "guide" ? 60 : 10);
  else if (f._t === "datasheet") s += 30;
  else if (f._src === "core" && f._t !== "table") s += 4;

  if (f._src === "core" && f.a && f.a.length && f._t !== "table" && f._t !== "datasheet") s += 3;

  if (/typedef$/i.test(f.n) && !/结构体|成员|字段|typedef|定义|参数/.test(qEl.value.toLowerCase())) s -= 14;

  if (f._t === "table" && BIG_TABLE_RE.test(f.n)) {
    const tableSeeking = words.some(w => /表|向量|宏|映射|分组|扇区|线/.test(w));
    s -= tableSeeking ? 0 : 60;
  }

  /* 手写条目（非自动收录）优先露出 —— 自动原型卡满屏是“查不到解释”的体验 */
  if (f._src === "auto" && SEC === "ref" && words.length) s -= 8;
  if (f._src === "autostruct" && SEC === "ref" && words.length) s -= 12;

  /* 概念干扰屏蔽：像 SAI_FrameInit 这种“同名不同义”的，别靠概念撞车爬到前面 */
  if (words.length) {
    for (let i = 0; i < words.length; i++) {
      const bl = CONCEPT_BLOCK[words[i]] || CONCEPT_BLOCK[TYPO[words[i]] || words[i]];
      if (bl && bl.some(re => re.test(f.n))) { s -= 90; break; }
    }
  }

  /* 泛化卡片屏蔽：一览表 / 总表 / 映射表这种“什么都提一句”的卡，
     在搜具体功能词（卡尔曼 / LoRa / Modbus / OLED …）时降权，
     免得顶掉真正讲这件事的条目；用户直接搜表名时不受影响。 */
  if (words.length && GENERIC_NAME.test(f.n)) {
    const spec = words.some(w => {
      const key = TYPO[w] || w;
      return GENERIC_DOWN_TOPICS.indexOf(key) >= 0;
    });
    if (spec) s -= 120;
  }
  return s;
}

let lastResult = { arr: [], relaxed: false, en: [], words: [], broad: false, mode: "all" };

function filtered() {
  const words = tokenize(qEl.value);
  const en = expandWords(words);
  const m = modSel.value;
  const inSec = f => (SEC === "guide")
      ? ((f._t === "guide" || f._t === "flow") && !f._b)
      : (f._t !== "guide" && f._t !== "flow" && !f._b);

  CUR_G = words.map(variantGroups);
  CUR_W = words.map(weightOf);
  CUR_HEADS = words.slice();
  CUR_REQ = words.map(w => !ACTION.has(w) && !ACTION.has(TYPO[w] || w));
  if (words.length && !CUR_REQ.some(Boolean)) CUR_REQ = words.map(() => true);
  CUR_TOT = CUR_W.reduce((a, b) => a + b, 0);
  CUR_REQTOT = CUR_W.reduce((a, b, i) => a + (CUR_REQ[i] ? b : 0), 0);

  const base = ALL.filter(f => inSec(f) && (!m || modKeyOf(f) === m));
  const ev = new Map();
  let arr = [], relaxed = false;
  if (words.length) {
    const tight = [], loose = [];
    base.forEach(f => {
      const e = evalEntry(f);
      ev.set(f, e);
      if (e.covReq >= 0.999) tight.push(f);
      else if (e.covReq >= 0.6) loose.push(f);
    });
    if (tight.length) { arr = tight.concat(loose); relaxed = loose.length > 0; }
    else if (loose.length) { arr = loose; relaxed = true; }
    if (!arr.length) {
      arr = base.filter(f => CUR_G.some(g => g.some(t => hasTok(f._hay, t))));
      arr.forEach(f => ev.set(f, evalEntry(f)));
      relaxed = arr.length > 0;
    }
  } else {
    arr = base;
  }

  if (words.length) {
    arr.sort((a, b) => {
      const ea = ev.get(a) || evalEntry(a), eb = ev.get(b) || evalEntry(b);
      const fa = ea.covReq >= 0.999 ? 1 : 0, fb = eb.covReq >= 0.999 ? 1 : 0;
      /* 名字命中（用户原词直接出现在条目名里）优先于「只靠同义词展开命中」：
         搜「断网缓存」时，名字里真有「缓存」的卡要压过只是正文提了一句 Flash 的卡。 */
      const na = (ea.hits[0] && ea.hits[0].pT >= 2) ? 1 : 0;
      const nb = (eb.hits[0] && eb.hits[0].pT >= 2) ? 1 : 0;
      return (fb - fa) || (nb - na) || (scoreOf(b, words, eb) - scoreOf(a, words, ea)) || (a._ord - b._ord);
    });
  } else {
    arr.sort((a, b) => a._ord - b._ord || 0);
  }

  /* 宽泛词判定：命中数过多 + 含宽泛词 且 用户没给限定词 */
  const broad = words.length > 0 && words.some(w => BROAD.has(w))
    && !words.some(w => !BROAD.has(w) && !ACTION.has(w))
    && arr.length > 60;

  const res = { arr: arr, relaxed: relaxed, en: en, words: words, broad: broad, ev: ev };
  lastResult = res;
  return res;
}

function topicOf(f) {
  if (f._topic) return f._topic;
  const name = String(f.n || "").toLowerCase();
  const head = name.split(/[（(]/)[0];
  const all = name + " " + String(f.k || "").toLowerCase() + " " + String(f.d || "").toLowerCase();
  for (const [t, re] of TOPIC_RULES) if (re.test(head)) { f._topic = t; return t; }
  for (const [t, re] of TOPIC_RULES) if (re.test(name)) { f._topic = t; return t; }
  for (const [t, re] of TOPIC_RULES) if (re.test(all)) { f._topic = t; return t; }
  f._topic = "其他";
  return f._topic;
}
function modKeyOf(f) {
  if (f._t === "guide" || f._t === "flow") return topicOf(f);
  return f.m;
}
function boardCards() {
  const all = ALL.filter(f => !f._b);

  return all.filter(f => f._t !== "guide" && f._t !== "flow");
}

/* ============================================================
 *  搜索词高亮
 * ============================================================ */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
/* 用本轮查询的所有候选写法（含近义词/概念英文/纠错）去打高亮 */
function hlTerms() {
  const set = new Set();
  (lastResult.words || []).forEach(w => {
    variantGroups(w).forEach(t => { if (t && t.length >= 2) set.add(t); });
  });
  return [...set].sort((a, b) => b.length - a.length).slice(0, 40);
}
function highlight(text, terms) {
  if (!text) return "";
  const terms_ = terms || hlTerms();
  if (!terms_.length) return esc(text);
  let out = esc(text);
  const used = [];
  terms_.forEach(t => {
    if (!t || t.length < 2) return;
    const et = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(" + et + ")", "gi");
    if (!re.test(out)) return;
    used.push(t);
    out = out.replace(re, "\u0001$1\u0002");
  });
  if (!used.length) return out;
  out = out.replace(/\u0001/g, '<mark class="hl">').replace(/\u0002/g, "</mark>");
  return out;
}

function setHash(i) {
  if (location.protocol === "file:") return;   /* file:// 下改 hash 会刷新，跳过 */
  const f = ALL[i];
  if (!f) return;
  try { history.replaceState(null, "", "#" + secName() + "/" + encodeURIComponent(f.n)); } catch (e) {}
}

function restoreFromHash() {
  /* 注意：只按【第一个】/ 切分。
     卡片名里本来就带 / 的不少（如「🧭 SPI 主机引导（接 W25QXX Flash / NRF24L01 / 触摸屏）」），
     原来用 split("/") 会把名字切成好几段，于是 m[1] 匹配不上任何条目，

     改成"板块 + 剩余全部"之后，setHash 写出去的链接自己就能还原回来。 */
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  const cut = raw.indexOf("/");
  const secPart = (cut < 0) ? raw : raw.slice(0, cut);
  const namePart = (cut < 0) ? "" : raw.slice(cut + 1);
  if (["ref", "guide", "build"].indexOf(secPart) >= 0) SEC = secPart;
  if (namePart) {
    const f = findByExactName(namePart);
    if (f) { SEC = f._b ? "build" : (f._t === "guide" || f._t === "flow" ? "guide" : "ref"); return f._i; }

    'config': ['中断 配置', 'DMA 配置', 'NVIC 配置'],
    'it': ['串口 中断', '定时器 中断'],
    'get': ['读取 状态', '获取 标志'],
  };
  return combos[w] || combos[words[0]] || [];
}

/* ============================================================
 *  落地页（未搜索时）
 *  ------------------------------------------------------------
 *  旧版一进来就是「传感器数据手册 + 一堆 InitTypeDef」，
 *  最有价值的流程卡 / 向导被藏在第二个板块。
 *  新版给一个「从这里开始」：先给新手入口，再给热门模块，
 *  最后才是全部条目的分组列表。
 * ============================================================ */
const HOT_MODULES = ["USART", "GPIO", "TIM", "ADC", "DMA", "I2C", "SPI", "NVIC", "EXTI", "RCC", "FLASH", "RTC"];
const HOT_TOPICS = ["串口 DMA + 空闲中断", "定时器 PWM", "数据帧组包 + CRC16", "FreeRTOS 任务框架",
  "LoRa 点对点", "ESP8266 + MQTT", "I2C 接传感器", "看门狗", "RTC 电子钟", "Flash 断网缓存"];

function renderLanding() {
  /* 这里的计数必须现算，不能写死：以前写的是「38 流程卡 + 56 向导」，
     数据涨到 39 / 57 之后就一直是错的（同文件别处都用 ALL.length 动态取，
     只有这一处硬编码，属于漏网）。 */
  const nFlow  = ALL.filter(f => f._t === "flow").length;
  const nGuide = ALL.filter(f => f._t === "guide").length;
  countEl.innerHTML = "共 <b>" + ALL.length + "</b> 条 · <span style='opacity:.8'>" +
    nFlow + " 流程卡 + " + nGuide + " 向导可直接照着做</span>";

    '或「引导教程」（从零一步步搭到能跑）。下面按你常做的事分组。</div>';

  /* 新手三步路径 */
  const paths = document.createElement("div");
  paths.className = "heropaths";

    { ic: "🧭", t: "我要自己搭一个外设", d: "打开「引导教程」，从接线到验收一步步做", sec: "guide" },
    { ic: "📋", t: "我知道要干嘛，只差代码", d: "搜功能词（如「打开DMA中断」），直接看流程卡", q: "打开DMA中断" },
    { ic: "📖", t: "我要查某个函数的参数", d: "搜函数名或宏名，看参数表 / 返回值 / 示例", q: "USART_Init" },
  ].forEach(p => {
    const c = document.createElement("div");
    c.className = "herocard";

  /* ---- 全部条目（按模块分组，手写在前） ---- */

}

/* 把一批条目按「手写详解 / 自动原型」两组铺进列表。
   落地页与"选了模块但没搜索"两条路径共用，避免两处各写一份分组逻辑。
   collapseAuto：true=强制折叠自动组（落地页口径），不传则按 DB.openGroups 判定。 */
function renderGroupedList(arr, collapseAuto) {
  const coreArr = arr.filter(f => f._src === "core");
  const autoArr = arr.filter(f => f._src === "auto" || f._src === "autostruct");
  const frag = document.createDocumentFragment();
  if (coreArr.length) {
    frag.appendChild(groupHeader("手写详解 / 查找表 / 手册", coreArr.length, "core", false));
    const g = document.createElement("div");
    g.dataset.group = "core";
    coreArr.forEach(f => g.appendChild(listRow(f, [])));
    frag.appendChild(g);
  }
  if (autoArr.length) {
    const collapsed = (collapseAuto === undefined)
      ? (coreArr.length > 0 && DB.openGroups["auto"] !== true)
      : collapseAuto;
    frag.appendChild(groupHeader("自动收录原型 / 结构体", autoArr.length, "auto", collapsed));
    const g = document.createElement("div");
    g.dataset.group = "auto";
    if (collapsed) g.style.display = "none";
    autoArr.forEach(f => g.appendChild(listRow(f, [])));
    frag.appendChild(g);
  }
  listEl.appendChild(frag);
}

function renderList() {
  if (SEC === "build") { renderBuildList(); return; }
  const res = filtered();
  const words = res.words;
  const arr = res.arr;

  if (SEC === "guide") { renderGuideList(arr, words, res.relaxed, res.en); return; }

  /* 未搜索时分两种：
     ① 选了某个模块 → 列该模块的条目。以前这里直接给落地页，导致"切模块毫无反应"
        （模块筛选被落地页整个盖掉），用户反馈过。
     ② 资料查询 · 全部模块 → 才是「从这里开始」落地页该出现的地方。 */
  if (!words.length) {
    if (modSel.value) {
      const m = modSel.value;
      countEl.innerHTML = "模块：<b>" + esc(m) + "</b> · 共 <b>" + arr.length + "</b> 条";
      listEl.innerHTML = "";
      if (!arr.length) {
        listEl.innerHTML = "<div class='empty'>该模块下暂时没有条目</div>";
        return;
      }
      renderGroupedList(arr);
      return;
    }
    renderLanding();
    return;
  }

  const tutN = tutorialMatches();
  const nCore = arr.filter(f => f._src === "core").length;
  countEl.innerHTML = "匹配 <b>" + arr.length + "</b> / 共 " + ALL.length +
      "（详解 " + nCore + "，原型 " + (arr.length - nCore) + "）" + (res.relaxed ? "｜宽松" : "");

  listEl.innerHTML = "";

  if (!arr.length) {
    listEl.innerHTML = "<div class='empty'>没有匹配的条目<br>试试更短的词，或直接写中文功能词<br>（如: 打开DMA中断 / 串口 中断 / USART_Init）</div>";
    const tlist0 = relatedTutorials(4);
    if (tlist0.length) listEl.appendChild(tutorialCardsNode(tlist0));
    if (tutN > 0) listEl.appendChild(tutHint(tutN));
    return;
  }
  if (res.broad) listEl.appendChild(broadHintNode(res));
  /* 跨板块直达：资料里没几个结果，但教程里有 → 置顶推给用户 */
  const tlist = relatedTutorials(3);
  const coreHit = arr.filter(f => f._src === "core" && f._t !== "table" && f._t !== "chip").length;
  if (tlist.length && (coreHit < 3 || arr.length < 8)) {
    const node = tutorialCardsNode(tlist);
    if (node) listEl.appendChild(node);
  }
  if (tutN > 0 && arr.length > 0) listEl.appendChild(tutHint(tutN));

  const terms = hlTerms();
  /* 分组：手写详解（含流程/手册/查找表）在前，自动原型沉到可折叠组 */
  const coreArr = arr.filter(f => f._src !== "auto" && f._src !== "autostruct");
  const autoArr = arr.filter(f => f._src === "auto" || f._src === "autostruct");

  const frag = document.createDocumentFragment();

  if (coreArr.length) {
    frag.appendChild(groupHeader("详解 / 流程 / 手册", coreArr.length, "core", false));
    const g = document.createElement("div");
    g.dataset.group = "core";
    coreArr.forEach(f => g.appendChild(listRow(f, terms)));
    frag.appendChild(g);
  }
  if (autoArr.length) {
    /* 有手写命中时，自动原型默认折叠（避免满屏“无解释的原型”） */
    const collapsed = coreArr.length > 0 && (DB.openGroups["auto"] !== true);
    frag.appendChild(groupHeader("自动收录原型 / 结构体", autoArr.length, "auto", collapsed));
    const g = document.createElement("div");
    g.dataset.group = "auto";
    if (collapsed) g.style.display = "none";
    autoArr.forEach(f => g.appendChild(listRow(f, terms)));
    frag.appendChild(g);
  }
  listEl.appendChild(frag);
}

function groupHeader(label, n, key, collapsed) {
  const h = document.createElement("div");
  h.className = "grouphead" + (collapsed ? " collapsed" : "");
  h.innerHTML = '<span class="caret">▼</span><span>' + esc(label) + '</span><span class="gcnt">(' + n + ')</span>';
  h.onclick = () => {
    const g = listEl.querySelector('[data-group="' + key + '"]');
    if (!g) return;
    const nowHidden = g.style.display !== "none";
    g.style.display = nowHidden ? "none" : "";
    h.classList.toggle("collapsed", nowHidden);
    DB.openGroups[key] = !nowHidden;
    dbSave();
  };
  return h;
}

function listRow(f, terms) {
  const div = document.createElement("div");
  div.className = "item" + (current === f._i ? " active" : "") + (isFav(f.n) ? " fav-on" : "");
  div.dataset.i = f._i;

  const fn = document.createElement("div");
  fn.className = "fn";
  const b1 = document.createElement("span"); b1.className = "badge"; b1.textContent = f.m;
  const b2 = document.createElement("span"); b2.className = "badge btype"; b2.textContent = typeLabel(f);
  if (f._src === "auto" || f._src === "autostruct") b2.classList.add("raw");
  if (f._t === "flow") b2.classList.add("flow");
  if (f._t === "guide") b2.classList.add("guide");
  if (f._t === "datasheet") b2.classList.add("datasheet");
  const nm = document.createElement("span");
  nm.innerHTML = highlight(f.n, terms);
  fn.append(b1, b2, nm);

  let fdText = f.d || f.p || "";
  const cnList = (f._src === "auto") ? cnNote(f) : "";
  if (cnList) fdText = cnList;
  else if (f._src === "auto" && !f.d) fdText = guessUse(f);

  const fd = document.createElement("div");
  fd.className = "fd";
  fd.innerHTML = highlight(fdText, terms);

  div.append(fn, fd);

  /* 命中原因（只在搜索时显示，帮用户理解为什么这条会出来） */
  const ev = lastResult.ev && lastResult.ev.get(f);
  if (lastResult.words.length && ev && ev.hits && ev.hits.length) {
    const r = document.createElement("div");
    r.className = "hitreason";
    ev.hits.slice(0, 3).forEach(h => {
      const tag = document.createElement("span");
      tag.className = "rtag" + (h.tier >= 2 ? "" : " lvl2");
      tag.textContent = lastResult.words[h.i] + (h.tier >= 3 ? " · 名称" : h.tier === 2 ? " · 名称" : " · 正文");
      r.appendChild(tag);
    });
    div.appendChild(r);
  }

  div.onclick = () => showDetail(f._i);
  return div;
}

function tutHint(n) {
  const d = document.createElement("div");
  d.className = "searchhint";
  d.innerHTML = "📚 「引导教程」里有 <b>" + n + "</b> 个相关教程（向导 / 流程卡）—— 点这里切过去看";

/* ============================================================
 *  跨板块主题直达
 *  ------------------------------------------------------------
 *  问题：像「卡尔曼滤波」「Modbus」「OLED」「步进电机」这类主题，
 *  在资料库里根本没有对应函数卡，只在【流程卡 / 向导】里有 ——
 *  于是在「资料查询」板块搜它们，只会命中一堆无关的 Filter/FastMode 函数。
 *  做法：搜索时额外在流程卡 / 向导里按同一套引擎打分，
 *  把命中的教程以醒目条目置顶，让用户一眼就能跳过去。
 * ============================================================ */
function relatedTutorials(limit) {
  if (!qEl.value.trim()) return [];
  const words = lastResult.words;
  if (!words.length) return [];
  const pool = ALL.filter(f => !f._b && (f._t === "guide" || f._t === "flow"));
  const scored = [];
  pool.forEach(f => {
    const e = evalEntry(f);
    if (e.covReq < 0.6) return;
    /* 同一套评分，但不叠加“板块惩罚”——这里的目的是找出相关教程 */
    let s = e.sP + e.sE + e.cov * 30 + e.covReq * 20;
    if (e.near) s += 20;
    if (f._t === "guide") s += 40;
    scored.push({ f: f, s: s });
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, limit || 3).map(x => x.f);
}

function tutorialCardsNode(list_) {
  if (!list_.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "grpcard";
  const head = document.createElement("div");

  htxt.className = "hgtxt";
  htxt.innerHTML = "📚 匹配到 <b>" + list_.length + "</b> 个「引导教程」—— 这个主题的完整做法在这里";
  const go = document.createElement("button");
  go.className = "btn sm pri";
  go.textContent = "看全部 →";
  go.onclick = (e) => { e.stopPropagation(); setSection("guide"); };
  head.append(htxt, go);
  wrap.appendChild(head);
  const terms = hlTerms();
  list_.forEach(f => {
    const row = document.createElement("div");
    row.className = "grprow";
    const t = document.createElement("div");
    t.className = "gt";
    t.innerHTML = '<span class="badge btype ' + (f._t === "flow" ? "flow" : "guide") + '">' +
      (f._t === "flow" ? "流程" : "引导") + "</span>" + highlight(f.n, terms);
    const d = document.createElement("div");
    d.className = "gd";
    d.innerHTML = highlight(f.d || "", terms).slice(0, 260);
    row.append(t, d);
    row.onclick = () => showDetail(f._i);
    wrap.appendChild(row);
  });
  return wrap;
}

    ? "搜阶段（如: 时钟 / 任务 / 组帧 / LoRa / 验收）"

      ? "搜引导教程（如: 打开DMA中断 / FreeRTOS / RTC 电子钟 / 看门狗 / 卡尔曼）"
      : "中文 / 英文 / 混排都能搜（如: 打开DMA中断、串口 中断、USART_Init）");
  if (!keepQuery && sec !== "build") { /* 保留用户输入，跨板块搜索体验更连贯 */ }
  current = null;
  detailEl.innerHTML = "<div class='empty'>" +
    (isBuild ? "点选左侧阶段开始 →<br>（每个阶段：一串动作 + 真实 API + 验收标准 + 常见坑）"

}

function addSection(parent, title, makeNode, icon) {

function wrapTable(tb) {

  w.appendChild(tb);

 *  引导向导渲染（进度持久化到 localStorage）

function cmdKey(f) { return f.n; }

function makeCodeBox(code, label) {
  const wrap = document.createElement("div");
  wrap.className = "codewrap";
  const btn = document.createElement("button");
  btn.className = "copybtn always";
  btn.textContent = label || "复制本步代码";
  btn.onclick = () => copy(code, btn);
  const pre = document.createElement("pre");
  pre.className = "code";
  pre.textContent = code;
  wrap.append(btn, pre);
  return wrap;
}

function makeRelLine(names) {

  String(names).split(/\s+/).filter(Boolean).forEach(nm => {
    const a = document.createElement("a");

    a.onclick = () => jumpTo(nm);

    d.appendChild(document.createTextNode("　"));
